var GRANT_DL_TYPES=[
  {key:'financial',  label:'تقرير مالي',     icon:'💰'},
  {key:'narrative',  label:'تقرير فني/سردي', icon:'📝'},
  {key:'audit',      label:'مراجعة حسابية',  icon:'🔍'},
  {key:'procurement',label:'تقرير مشتريات',  icon:'🛒'},
  {key:'interim',    label:'تقرير مرحلي',    icon:'📊'},
  {key:'final',      label:'تقرير ختامي',    icon:'🏁'},
  {key:'other',      label:'موعد آخر',       icon:'📅'},
];

function gDlTypeInfo(key){
  return GRANT_DL_TYPES.find(function(t){return t.key===key;})||GRANT_DL_TYPES[GRANT_DL_TYPES.length-1];
}

function gDlStatus(dl){
  if(dl.submitted) return 'submitted';
  var todayMs=new Date().setHours(0,0,0,0);
  var dueMs=new Date(dl.dueDate).getTime();
  var diff=Math.round((dueMs-todayMs)/86400000);
  if(diff<0)  return 'overdue';
  if(diff<=14) return 'urgent';
  if(diff<=30) return 'warning';
  return 'upcoming';
}

function gDlDaysLabel(dl){
  if(dl.submitted) return '✅ تم التقديم';
  var todayMs=new Date().setHours(0,0,0,0);
  var diff=Math.round((new Date(dl.dueDate).getTime()-todayMs)/86400000);
  if(diff<0)  return 'متأخر '+Math.abs(diff)+' يوم';
  if(diff===0) return 'اليوم!';
  if(diff===1) return 'غداً!';
  return diff+' يوم';
}

function gDlBadgeStyle(dl){
  var s=gDlStatus(dl);
  if(s==='submitted') return 'background:#D1FAE5;color:#059669;';
  if(s==='overdue'||s==='urgent') return 'background:#FEE2E2;color:#DC2626;';
  if(s==='warning') return 'background:#FEF3C7;color:#92400E;';
  return 'background:#E0F2FE;color:#0369A1;';
}

// Get all deadlines across all grant files
function getAllGrantDeadlines(daysAhead){
  var grantFiles=DB.grantFiles||[];
  var todayMs=new Date().setHours(0,0,0,0);
  var cutoffMs=daysAhead?todayMs+daysAhead*86400000:null;
  var results=[];
  grantFiles.forEach(function(gf,gi){
    (gf.deadlines||[]).forEach(function(dl,di){
      if(!dl.dueDate) return;
      var dueMs=new Date(dl.dueDate).getTime();
      if(dl.submitted) return; // skip submitted
      // Include overdue always + upcoming within cutoff
      var isOverdue=dueMs<todayMs;
      var inWindow=cutoffMs?dueMs<=cutoffMs:true;
      if(isOverdue||inWindow){
        results.push({dl:dl,grantIdx:gi,dlIdx:di,grantName:gf.projName,donor:gf.donor||''});
      }
    });
  });
  results.sort(function(a,b){return new Date(a.dl.dueDate)-new Date(b.dl.dueDate);});
  return results;
}

  var upcoming=getAllGrantDeadlines(60);

    h+='<div style="text-align:center;font-size:11px;color:var(--g4);margin-top:6px;cursor:pointer;" onclick="openAllGrantDeadlines()">+ '+(upcoming.length-5)+' مواعيد أخرى</div>';

function openAllGrantDeadlines(){
  var all=getAllGrantDeadlines(null);
  // Also include upcoming beyond 60d
  var allIncl=[];
  (DB.grantFiles||[]).forEach(function(gf,gi){
    (gf.deadlines||[]).forEach(function(dl,di){
      if(!dl.dueDate) return;
      allIncl.push({dl:dl,grantIdx:gi,dlIdx:di,grantName:gf.projName,donor:gf.donor||''});
    });
  });
  allIncl.sort(function(a,b){
    if(a.dl.submitted&&!b.dl.submitted) return 1;
    if(!a.dl.submitted&&b.dl.submitted) return -1;
    return new Date(a.dl.dueDate)-new Date(b.dl.dueDate);
  });

  var groups={overdue:[],urgent:[],warning:[],upcoming:[],submitted:[]};
  allIncl.forEach(function(r){ var s=gDlStatus(r.dl); if(groups[s]) groups[s].push(r); });

  var grpLabels={overdue:'⛔ متأخر',urgent:'🚨 خلال 14 يوم',warning:'⚠️ خلال 30 يوم',upcoming:'📅 قادم',submitted:'✅ تم التقديم'};

  var h='';
  if(!allIncl.length){
    h='<div style="text-align:center;padding:30px;color:var(--g4);font-size:13px;">لا توجد مواعيد مسجلة</div>';
    om('📅 مواعيد التقارير',h); return;
  }

  ['overdue','urgent','warning','upcoming','submitted'].forEach(function(gk){
    var list=groups[gk];
    if(!list.length) return;
    h+='<div style="font-size:10.5px;font-weight:800;color:var(--g4);letter-spacing:.3px;margin:12px 0 6px;">'+grpLabels[gk]+' ('+list.length+')</div>';
    list.forEach(function(r){
      var ti=gDlTypeInfo(r.dl.type);
      var bs=gDlBadgeStyle(r.dl);
      h+='<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9;cursor:pointer;" onclick="sub(\'grantfiles\')">';
      h+='<div style="font-size:18px;">'+ti.icon+'</div>';
      h+='<div style="flex:1;min-width:0;">';
      h+='<div style="font-size:12.5px;font-weight:700;color:var(--nd);">'+r.dl.label+'</div>';
      h+='<div style="font-size:10.5px;color:var(--g4);">'+r.grantName+' · '+r.dl.dueDate+'</div>';
      h+='</div>';
      h+='<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;">';
      h+='<span style="font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;'+bs+'">'+gDlDaysLabel(r.dl)+'</span>';
      if(!r.dl.submitted){

      }

}

// ── مراجعة Readiness ───────────────────────────────────────────────
function calcمراجعةReadiness(gf){
  if(!gf) return 0;
  var totalSlots=0,filled=0;
  GRANT_SECTIONS.forEach(function(sec){
    var docs=gf.sections[sec.key]||[];
    sec.docs.forEach(function(docName){
      totalSlots++;
      if(docs.some(function(d){return d.label===docName&&d.file;})) filled++;
    });
  });
  // Extra points for linked entries
  var proj=gf.projCode;
  var linkedEntries=(DB.entries||[]).filter(function(e){
    return e.status==='posted'&&(e.proj===proj);
  }).length;
  if(linkedEntries>0) filled=Math.min(filled+5,totalSlots);
  return Math.round(filled/totalSlots*100);
}

function getDocIcon(type){
  if(!type) return '📄';
  if(type.includes('pdf')) return '📕';
  if(type.includes('image')||type.includes('jpg')||type.includes('png')) return '🖼️';
  if(type.includes('excel')||type.includes('sheet')||type.includes('xlsx')) return '📊';
  if(type.includes('word')||type.includes('doc')) return '📝';
  return '📎';
}

function previewUploadFile(input){
  var preview=document.getElementById('ud-preview');
  if(!preview||!input.files.length) return;
  var file=input.files[0];
  var sizeMB=(file.size/1024/1024).toFixed(2);
  preview.innerHTML='<div style="background:#f0fdf4;border-radius:7px;padding:8px;font-size:11px;color:#059669;">'
    +'✅ '+file.name+' ('+sizeMB+' MB)</div>';
}

function saveGrantDoc(gfIdx,secKey){
  initGrantFiles();
  var gf=DB.grantFiles[gfIdx];
  if(!gf) return;
  var labelSel=document.getElementById('ud-label');
  var label=labelSel?labelSel.value:'';
  if(label==='__other'){
    label=(document.getElementById('ud-other-name')||{}).value||'مستند';
  }
  if(!label){toast('⚠️ اختر نوع المستند');return;}
  var fileInput=document.getElementById('ud-file');
  var date=(document.getElementById('ud-date')||{}).value||new Date().toISOString().split('T')[0];
  var amount=parseFloat((document.getElementById('ud-amount')||{}).value)||0;
  var entryId=(document.getElementById('ud-entry')||{}).value||'';

  if(fileInput&&fileInput.files.length){
    var file=fileInput.files[0];
    if(file.size>5*1024*1024){toast('⚠️ الملف أكبر من 5MB');return;}
    var reader=new FileReader();
    reader.onload=function(ev){
      if(!gf.sections[secKey]) gf.sections[secKey]=[];
      // Remove existing doc with same label
      gf.sections[secKey]=gf.sections[secKey].filter(function(d){return d.label!==label;});
      gf.sections[secKey].push({
        label:label,file:ev.target.result,
        fileName:file.name,type:file.type,
        date:date,amount:amount,entryId:entryId,
        uploadedAt:new Date().toISOString()
      });
      save(); cm();
      toast('✅ تم رفع المستند: '+label);
      renderGrantFilePage(gfIdx);
    };
    reader.readAsDataURL(file);
  } else {
    // Save without file (just metadata/link)
    if(!gf.sections[secKey]) gf.sections[secKey]=[];
    gf.sections[secKey]=gf.sections[secKey].filter(function(d){return d.label!==label;});
    gf.sections[secKey].push({
      label:label,file:null,
      date:date,amount:amount,entryId:entryId,
      note:'بدون ملف',
      uploadedAt:new Date().toISOString()
    });
    save(); cm();
    toast('✅ تم تسجيل المستند: '+label);
    renderGrantFilePage(gfIdx);
  }
}

function viewGrantDoc(gfIdx,secKey,docName){
  var gf=DB.grantFiles[gfIdx];
  if(!gf) return;
  var doc=(gf.sections[secKey]||[]).find(function(d){return d.label===docName;});
  if(!doc||!doc.file){toast('⚠️ لا يوجد ملف مرفق');return;}
  // Open in new overlay
  var overlay=document.createElement('div');

  overlay.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#0D3B6E;color:white;">'
    +'<button onclick="this.closest(\'div\').parentElement.remove()" style="background:rgba(255,255,255,.2);border:none;color:white;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:Cairo,sans-serif;">✕ إغلاق</button>'
    +'<span style="font-size:13px;font-weight:700;">'+doc.label+'</span>'

function deleteGrantDoc(btn){
  var di=parseInt(btn.dataset.idx);
  var gfIdx=parseInt(btn.dataset.gidx);
  var secKey=btn.dataset.sec;
  if(!confirm('حذف المستند؟')) return;
  var gf=DB.grantFiles[gfIdx];
  if(!gf||!gf.sections[secKey]) return;
  gf.sections[secKey].splice(di,1);

  renderGrantFilePage(gfIdx);
}

function buildالأرشيفList(entries, filter, search){
  var filtered=entries.filter(function(e){
    var st=(DB.archiveLog[e.id]||{}).status||'pending';
    if(filter!=='all'&&st!==filter) return false;
    if(search){
      var s=search.toLowerCase();
      return e.id.toLowerCase().includes(s)||
             (e.desc||'').toLowerCase().includes(s)||
             (e.date||'').includes(s)||
             (e.ref||'').toLowerCase().includes(s);
    }
    return true;
  });

  if(!filtered.length) return '<div style="text-align:center;padding:20px;color:var(--g4);">لا توجد نتائج</div>';

  var h='';
  filtered.forEach(function(entry){
    var arch=DB.archiveLog[entry.id]||{status:'pending'};
    var totalDr=entry.lines.reduce(function(s,l){return s+(l.dr||0);},0);
    var statusClr=arch.status==='archived'?'#1a7a4a':arch.status==='missing'?'#c0392b':'#d97706';
    var statusLbl=arch.status==='archived'?'✅ مؤرشف':arch.status==='missing'?'❌ ناقص':'⏳ قيد الأرشفة';
    var statusBg=arch.status==='archived'?'#d1fae5':arch.status==='missing'?'#fee2e2':'#fff9c4';

    h+='<div style="background:white;border-radius:11px;padding:11px;margin-bottom:7px;box-shadow:0 1px 5px rgba(0,0,0,.06);border:1px solid #eee;">';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">';
    h+='<div>';
    h+='<div style="display:flex;align-items:center;gap:6px;"><span style="font-weight:800;font-size:12px;color:var(--nd);">'+entry.id+'</span>'+getDocBadge(entry.id)+'</div>';
    h+='<div style="font-size:10.5px;color:var(--g4);">'+entry.date+' · '+entry.desc+'</div>';
    if(arch.boxRef) h+='<div style="font-size:10px;color:#2563eb;">📦 '+arch.boxRef+'</div>';
    h+='</div>';
    h+='<div style="text-align:left;">';
    h+='<div style="font-weight:800;font-size:13px;color:var(--nd);">'+fmt(totalDr)+' ج.م</div>';
    h+='<div style="background:'+statusBg+';color:'+statusClr+';font-size:10px;font-weight:700;border-radius:5px;padding:2px 8px;margin-top:3px;">'+statusLbl+'</div>';
    h+='</div></div>';

    h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;">';
    h+='<button data-eid="'+entry.id+'" onclick="printEntrySheet(this.dataset.eid)" style="background:var(--am);border:none;color:white;border-radius:7px;padding:5px;font-size:9.5px;cursor:pointer;font-family:Cairo,sans-serif;">🖨️ طباعة القيد</button>';
    h+='<button data-eid="'+entry.id+'" onclick="openDocsModal(this.dataset.eid)" style="background:#059669;border:none;color:white;border-radius:7px;padding:5px;font-size:9.5px;cursor:pointer;font-family:Cairo,sans-serif;">📎 '+(DB.entryDocs&&DB.entryDocs[entry.id]?DB.entryDocs[entry.id].length+' مستند':'رفع')+'</button>';
    h+='<button data-eid="'+entry.id+'" onclick="markالأرشيفd(this.dataset.eid)" style="background:#1a7a4a;border:none;color:white;border-radius:7px;padding:5px;font-size:9.5px;cursor:pointer;font-family:Cairo,sans-serif;">✅ مؤرشف</button>';
    h+='<button data-eid="'+entry.id+'" onclick="markMissing(this.dataset.eid)" style="background:#c0392b;border:none;color:white;border-radius:7px;padding:5px;font-size:9.5px;cursor:pointer;font-family:Cairo,sans-serif;">❌ ناقص</button>';
    h+='<button data-eid="'+entry.id+'" onclick="viewE(this.dataset.eid)" style="background:var(--sk);border:none;color:white;border-radius:7px;padding:5px;font-size:9.5px;cursor:pointer;font-family:Cairo,sans-serif;">👁️ القيد</button>';
    h+='</div></div>';
  });
  return h;
}

function exportالأرشيفReport(){
  loadSheetJS(function(){
    initالأرشيف();
    var posted=(DB.entries||[]).filter(function(e){return e.status==='posted';})
      .sort(function(a,b){return b.date>a.date?1:-1;});

    var headers=['رقم القيد','التاريخ','البيان','المرجع','المبلغ (ج.م)','حالة الأرشفة','رقم الدرج/الملف','أُرشف بواسطة','تاريخ الأرشفة','ملاحظات'];
    var rows=posted.map(function(e){
      var arch=DB.archiveLog[e.id]||{};
      var amt=e.lines.reduce(function(s,l){return s+(l.dr||0);},0);
      var stMap={reviewed:'✅ مكتملة',incomplete:'⚠️ مستندات ناقصة',archived:'📦 مؤرشف',pending:'🔵 قيد المراجعة'};
      var st=stMap[arch.status]||'🔵 قيد المراجعة';
      var docCount=(DB.entryDocs&&DB.entryDocs[e.id])?DB.entryDocs[e.id].length:0;
      return [e.id,e.date,e.desc,e.ref||'',amt,st,docCount+' مستند',arch.reviewedBy||arch.archivedBy||'',arch.reviewedAt?arch.reviewedAt.slice(0,10):'',arch.notes||''];
    });

    // Summary
    var archived=rows.filter(function(r){return r[5].includes('✅');}).length;
    var missing=rows.filter(function(r){return r[5].includes('❌');}).length;
    var pending=rows.length-archived-missing;

    rows.push([]);
    rows.push(['','','','الإجمالي:',rows.length-2+'','','','','','']);
    rows.push(['','','','✅ مؤرشف:',archived,'','','','','']);
    rows.push(['','','','❌ ناقص:',missing,'','','','','']);
    rows.push(['','','','⏳ قيد الأرشفة:',pending,'','','','','']);

    var ws=XLSX.utils.aoa_to_sheet([headers].concat(rows));
    ws['!cols']=[{wch:18},{wch:12},{wch:35},{wch:14},{wch:14},{wch:16},{wch:18},{wch:16},{wch:14},{wch:25}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'تقرير الأرشيف');
    downloadXLSX(wb,'تقرير_الأرشيف_'+new Date().toISOString().slice(0,10)+'.xlsx');
    toast('✅ تم تصدير تقرير الأرشيف');
  });
}
