// ── Parsers ───────────────────────────────────────────────────────
function sheetToRows(wb, sheetName){
  var ws = wb.Sheets[sheetName];
  if(!ws) return null;
  var data = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
  if(data.length<2) return null;
  return data.slice(1).filter(function(r){return r.some(function(c){return c!=='';});});
}

function parseEntriesSheet(wb){
  var rows=sheetToRows(wb,'القيود اليومية');
  if(!rows) return {valid:0,errors:[],data:[]};
  var entries={}, errors=[];
  rows.forEach(function(r,i){
    // New format: ID | Date | Desc | Ref | Acc | Dr | Cr | Proj | WBS | CC | TP
    var id    = String(r[0]||'').trim();
    var date  = String(r[1]||'').trim();
    var desc  = String(r[2]||'').trim();
    var ref   = String(r[3]||'').trim();
    var acc   = String(r[4]||'').trim();
    var dr    = parseFloat(r[5])||0;
    var cr    = parseFloat(r[6])||0;
    var proj  = String(r[7]||'').trim();
    var wbs   = String(r[8]||'').trim();
    var cc    = String(r[9]||'').trim();
    var tpId  = String(r[10]||'').trim();

    if(!id||!date||!desc){errors.push('سطر '+(i+2)+': بيانات ناقصة (ID أو تاريخ أو بيان)');return;}
    if(!acc){errors.push('سطر '+(i+2)+': كود الحساب مطلوب');return;}

    // Create entry header if first line
    if(!entries[id]) entries[id]={
      id:id,date:date,desc:desc,ref:ref,proj:proj,status:'posted',lines:[]
    };

    // Add line
    if(dr>0||cr>0){
      entries[id].lines.push({
        acc:acc,an:'',
        dr:dr,cr:cr,
        proj:proj,
        wbsCode:wbs,
        cc:cc,
        tpId:tpId,tpName:'',tpType:''
      });
    }
  });

  // Validate balance
  Object.values(entries).forEach(function(e){
    var totDr=e.lines.reduce(function(s,l){return s+l.dr;},0);
    var totCr=e.lines.reduce(function(s,l){return s+l.cr;},0);
    if(Math.abs(totDr-totCr)>0.01)
      errors.push('قيد '+e.id+': غير متوازن — مدين='+totDr+' دائن='+totCr);
  });

  return {valid:Object.keys(entries).length,errors:errors,data:Object.values(entries)};
}

function parseProjectsSheet(wb){
  var rows=sheetToRows(wb,'المشروعات والموازنة');
  if(!rows) return {valid:0,errors:[],data:[]};
  var data=[],errors=[];
  rows.forEach(function(r,i){
    var code=String(r[0]||'').trim();
    var name=String(r[1]||'').trim();
    if(!code||!name){errors.push('مشروع سطر '+(i+2)+': كود أو اسم ناقص');return;}
    data.push({code:code,name:name,donor:String(r[2]||''),budget:parseFloat(r[3])||0,
      start:String(r[4]||''),end:String(r[5]||''),status:String(r[6]||'active'),spent:0});
  });
  return {valid:data.length,errors:errors,data:data};
}

function parseEmployeesSheet(wb){
  var rows=sheetToRows(wb,'الموظفين');
  if(!rows) return {valid:0,errors:[],data:[]};
  var data=[],errors=[];
  rows.forEach(function(r,i){
    var id=String(r[0]||'').trim();
    var name=String(r[1]||'').trim();
    if(!id||!name){errors.push('موظف سطر '+(i+2)+': كود أو اسم ناقص');return;}
    data.push({id:id,name:name,pos:String(r[2]||''),dept:String(r[3]||''),
      sal:parseFloat(r[4])||0,nw:parseFloat(r[5])||0,tr:parseFloat(r[6])||0,housing:parseFloat(r[7])||0,
      hireDate:String(r[8]||''),contractType:String(r[9]||'indefinite'),
      status:String(r[10]||'active'),empType:'full-time'});
  });
  return {valid:data.length,errors:errors,data:data};
}

function parseTPSheet(wb){
  var rows=sheetToRows(wb,'الموردين والأطراف الثالثة');
  if(!rows) return {valid:0,errors:[],data:[]};
  var data=[],errors=[];
  rows.forEach(function(r,i){
    var id=String(r[0]||'').trim();
    var name=String(r[1]||'').trim();
    if(!id||!name){errors.push('طرف ثالث سطر '+(i+2)+': كود أو اسم ناقص');return;}
    data.push({id:id,name:name,type:String(r[2]||'supplier'),
      taxId:String(r[3]||''),whtType:String(r[4]||''),whtRate:parseFloat(r[5])||0,
      address:String(r[6]||''),notes:''});
  });
  return {valid:data.length,errors:errors,data:data};
}

function parseCOASheet(wb){
  var rows=sheetToRows(wb,'حسابات جديدة (إضافة فقط)');
  if(!rows) return {valid:0,errors:[],data:[]};
  var data=[],errors=[];
  rows.forEach(function(r,i){
    var code=String(r[0]||'').trim();
    var name=String(r[1]||'').trim();
    var nat=String(r[2]||'').trim().toLowerCase();
    if(!code||!name){errors.push('حساب سطر '+(i+2)+': كود أو اسم ناقص');return;}
    if(nat!=='dr'&&nat!=='cr'){errors.push('حساب '+code+': طبيعة الحساب يجب dr أو cr');return;}
    // Check if already exists
    if(DB.accounts.find(function(a){return a.c===code;})){
      errors.push('حساب '+code+' موجود بالفعل — سيتم تجاهله');return;
    }
    data.push({c:code,n:name,nat:nat});
  });
  return {valid:data.length,errors:errors,data:data};
}

// ── Execute Import ────────────────────────────────────────────────
function executeImport(){
  var d = window._importData;
  if(!d){toast('لا توجد بيانات للاستيراد');return;}
  var stats={entries:0,projects:0,employees:0,thirdParties:0,accounts:0};

  // Import projects
  if(d.projects&&d.projects.data.length){
    d.projects.data.forEach(function(p){
      if(!DB.projects.find(function(x){return x.code===p.code;})){
        DB.projects.push(p); stats.projects++;
      }
    });
  }

  // Import employees
  if(d.employees&&d.employees.data.length){
    d.employees.data.forEach(function(e){
      if(!DB.employees.find(function(x){return x.id===e.id;})){
        DB.employees.push(e); stats.employees++;
      }
    });
  }

  // Import third parties
  if(d.thirdParties&&d.thirdParties.data.length){
    if(!DB.thirdParties) DB.thirdParties=[];
    d.thirdParties.data.forEach(function(tp){
      if(!DB.thirdParties.find(function(x){return x.id===tp.id;})){
        DB.thirdParties.push(tp); stats.thirdParties++;
      }
    });
  }

  // Import COA
  if(d.accounts&&d.accounts.data.length){
    d.accounts.data.forEach(function(a){
      if(!DB.accounts.find(function(x){return x.c===a.c;})){
        DB.accounts.push(a); stats.accounts++;
      }
    });
    DB.accounts.sort(function(a,b){return a.c<b.c?-1:1;});
  }

  // Import entries — enrich with account names + TP names
  if(d.entries&&d.entries.data.length){
    var accMap={};
    DB.accounts.forEach(function(a){accMap[a.c]=a.n;});
    var tpMap={};
    (DB.thirdParties||[]).forEach(function(t){tpMap[t.id]=t;});

    d.entries.data.forEach(function(e){
      if(!DB.entries.find(function(x){return x.id===e.id;})){
        // Enrich lines
        e.lines.forEach(function(l){
          l.an = accMap[l.acc]||l.acc;
          if(l.tpId){
            var tp=tpMap[l.tpId];
            if(tp){l.tpName=tp.name;l.tpType=tp.type;}
          }
        });
        DB.entries.push(e); stats.entries++;
      }
    });
    DB.entries.sort(function(a,b){return a.date>b.date?-1:1;});
  }

  save();
  window._importData=null;
  document.getElementById('import-preview').innerHTML='';

// ── Helper: get item stock per warehouse ─────────────────────────
function getItemStock(itemId, warehouseId){
  var qty=0;
  (DB.invMovements||[]).forEach(function(mv){
    if(mv.itemId!==itemId) return;
    if(warehouseId&&mv.warehouseId!==warehouseId&&mv.toWarehouseId!==warehouseId) return;
    if(mv.type==='receive'||(mv.type==='transfer'&&mv.toWarehouseId===warehouseId)) qty+=mv.qty;
    if(mv.type==='issue'||mv.type==='dispose'||(mv.type==='transfer'&&mv.warehouseId===warehouseId)) qty-=mv.qty;
  });
  return qty;
}

function getTotalStock(itemId){
  var qty=0;
  (DB.invMovements||[]).forEach(function(mv){
    if(mv.itemId!==itemId) return;
    if(mv.type==='receive') qty+=mv.qty;
    if(mv.type==='issue'||mv.type==='dispose') qty-=mv.qty;
  });
  return qty;
}

// ── Override getOpeningBals to use DB.openingBals ────────────────
// Patch the existing getOpeningBals to merge DB entries + manual opening bals
function getOpeningBals(fromDate){
  // Calculate opening balances from entries before fromDate
  var ob={};
  DB.accounts.forEach(function(a){ob[a.c]={dr:0,cr:0};});
  if(fromDate){
    (DB.entries||[]).filter(function(e){
      return e.status==='posted' && e.date < fromDate;
    }).forEach(function(e){
      (e.lines||[]).forEach(function(l){
        if(!ob[l.acc]) ob[l.acc]={dr:0,cr:0};
        ob[l.acc].dr+=(l.dr||0);
        ob[l.acc].cr+=(l.cr||0);
      });
    });
  }
  // Add manual opening balances from DB.openingBals
  if(DB.openingBals){
    Object.keys(DB.openingBals).forEach(function(acc){
      if(!ob[acc]) ob[acc]={dr:0,cr:0};
      var a=DB.accounts.find(function(x){return x.c===acc;});
      if(a){
        if(a.nat==='dr') ob[acc].dr+=DB.openingBals[acc];
        else ob[acc].cr+=DB.openingBals[acc];
      }
    });
  }
  return ob;
}

function generateClosingEntries(){
  var B=bals();
  var year=DB.org&&DB.org.year?DB.org.year:new Date().getFullYear();
  var today=year+'-12-31';
  var tRev=0,tExp=0;
  var revLines=[],expLines=[];

  DB.accounts.forEach(function(a){
    var b=B[a.c]||{dr:0,cr:0};
    if(a.c[0]==='4'){var bal=b.cr-b.dr;if(bal>0){tRev+=bal;revLines.push({acc:a.c,an:a.n,dr:bal,cr:0,proj:'',cc:'',tpId:'',tpName:'',tpType:'',wbsCode:'',autoGenerated:true});}}
    if(a.c[0]==='5'){var bal2=b.dr-b.cr;if(bal2>0){tExp+=bal2;expLines.push({acc:a.c,an:a.n,dr:0,cr:bal2,proj:'',cc:'',tpId:'',tpName:'',tpType:'',wbsCode:'',autoGenerated:true});}}
  });
  var surplus=tRev-tExp;
  if(!tRev&&!tExp){toast('⚠️ لا توجد إيرادات أو مصروفات للإقفال');return;}

  var closeId='CLS-'+year;
  if(DB.entries.find(function(e){return e.id===closeId;})){
    if(!confirm('قيود الإقفال موجودة بالفعل. هل تريد الاستبدال؟')) return;
    DB.entries=DB.entries.filter(function(e){return e.id!==closeId;});
  }

  // Summary account line
  revLines.push({acc:'3999',an:'ملخص الدخل',dr:0,cr:tRev,proj:'',cc:'',tpId:'',tpName:'',tpType:''});
  expLines.push({acc:'3999',an:'ملخص الدخل',dr:tExp,cr:0,proj:'',cc:'',tpId:'',tpName:'',tpType:''});
  var surplusLine=surplus>=0
    ?{acc:'3999',an:'ملخص الدخل',dr:surplus,cr:0,proj:'',cc:'',tpId:'',tpName:'',tpType:''}
    :{acc:'3999',an:'ملخص الدخل',dr:0,cr:-surplus,proj:'',cc:'',tpId:'',tpName:'',tpType:''};
  var reserveLine=surplus>=0
    ?{acc:'3111',an:'الاحتياطي العام',dr:0,cr:surplus,proj:'',cc:'',tpId:'',tpName:'',tpType:''}
    :{acc:'3111',an:'الاحتياطي العام',dr:-surplus,cr:0,proj:'',cc:'',tpId:'',tpName:'',tpType:''};

  DB.entries.push({
    id:closeId,date:today,
    desc:'قيود إقفال السنة المالية '+year,
    ref:'CLOSING-'+year,proj:'',status:'posted',
    lines:revLines.concat(expLines).concat([surplusLine,reserveLine])
  });
  save();
  toast('✅ تم توليد قيود الإقفال للسنة '+year);
}

function getWBSSpent(projCode,wbsCode){
  var total=0;
  (DB.entries||[]).filter(function(e){return e.status==='posted';}).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if((l.proj===projCode||e.proj===projCode)&&l.wbsCode===wbsCode&&l.dr>0){
        total+=l.dr;
      }
    });
  });
  return total;
}

function ensureLoanDB(){
  if(!DB.loans) DB.loans=[];
  if(!DB.entries) DB.entries=[];
}
function addMonthsISO(dateStr,monthsToAdd){
  var d=new Date(dateStr);
  if(isNaN(d.getTime())) d=new Date();
  var day=d.getDate();
  d.setMonth(d.getMonth()+monthsToAdd);
  // handle month-end overflow safely
  if(d.getDate()<day) d.setDate(0);
  return d.toISOString().slice(0,10);
}
function buildLoanSchedule(principal,annualRate,months,startDate,freq){
  principal=parseFloat(principal)||0;
  annualRate=parseFloat(annualRate)||0;
  months=parseInt(months)||0;
  freq=freq||'monthly';
  var interval=(freq==='biannual')?6:1;
  var count=Math.max(1,Math.ceil(months/interval));
  var totalInterest=Math.round(principal*(annualRate/100)*(months/12));
  var totalAmount=principal+totalInterest;
  var schedule=[];
  var remP=principal, remI=totalInterest, remT=totalAmount;
  for(var i=1;i<=count;i++){
    var principalPart=(i===count)?remP:Math.round(principal/count);
    var interestPart=(i===count)?remI:Math.round(totalInterest/count);
    var amount=(i===count)?remT:(principalPart+interestPart);
    schedule.push({
      installNo:i,
      dueDate:addMonthsISO(startDate,interval*i),
      amount:amount,
      principalPart:principalPart,
      interestPart:interestPart,
      status:'pending',
      paidDate:null,
      paidAmount:0,
      interestPaid:0
    });
    remP-=principalPart; remI-=interestPart; remT-=amount;
  }
  return {totalInterest:totalInterest,schedule:schedule};
}

    overdueقروض.forEach(function(l){
      (l.schedule||[]).filter(function(s){return s.status==='pending'&&new Date(s.dueDate)<today;}).forEach(function(s){
        var days=Math.floor((today-new Date(s.dueDate))/(1000*60*60*24));
        h+='<tr><td style="font-weight:700;">'+l.clientName+'</td><td style="text-align:center;">'+s.installNo+'</td>'
          +'<td>'+fmtDate2(s.dueDate)+'</td><td class="tn">'+fmtN(s.amount)+'</td>'
          +'<td style="color:var(--rd);font-weight:800;">'+days+' يوم</td></tr>';
      });
    });
    h+='</tbody></table></div></div>';
  }

  h+='<div style="background:white;border-radius:12px;border:1px solid var(--g2);padding:14px;margin-bottom:14px;">';
  h+='<div style="font-weight:800;font-size:13px;color:var(--n);margin-bottom:10px;">📋 تقرير شامل</div>';
  h+='<div style="overflow-x:auto;"><table><thead><tr><th>العميل</th><th>الأصل</th><th>مصروفات إدارية %</th><th>الدورية</th><th>الحالة</th></tr></thead><tbody>';
  loans.forEach(function(l){
    var sl=l.status==='active'?'نشط':l.status==='closed'?'مغلق':'معلق';
    var sc=l.status==='active'?'bg':l.status==='closed'?'bgy':'ba';
    h+='<tr><td style="font-weight:700;">'+l.clientName+'</td><td class="tn">'+fmtN(l.principal)+'</td>'
      +'<td style="text-align:center;">'+l.interestRate+'%</td>'
      +'<td style="text-align:center;">'+(l.payFreq==='monthly'?'شهري':'نصف سنوي')+'</td>'
      +'<td><span class="badge '+sc+'">'+sl+'</span></td></tr>';
  });
  h+='</tbody></table></div></div>';

  // Upcoming 30 days
  var d30=new Date(today); d30.setDate(d30.getDate()+30);
  var soon=[];
  loans.filter(function(l){return l.status==='active';}).forEach(function(l){
    (l.schedule||[]).filter(function(s){var dd=new Date(s.dueDate);return s.status==='pending'&&dd>=today&&dd<=d30;}).forEach(function(s){soon.push({name:l.clientName,s:s});});
  });
  if(soon.length){
    h+='<div style="background:white;border-radius:12px;border:1px solid var(--g2);padding:14px;margin-bottom:14px;">';
    h+='<div style="font-weight:800;font-size:13px;color:var(--n);margin-bottom:10px;">📅 الأقساط المستحقة خلال 30 يوماً</div>';
    h+='<div style="overflow-x:auto;"><table><thead><tr><th>العميل</th><th>قسط</th><th>الاستحقاق</th><th>المبلغ</th></tr></thead><tbody>';
    soon.sort(function(a,b){return a.s.dueDate.localeCompare(b.s.dueDate);}).forEach(function(x){
      h+='<tr><td style="font-weight:700;">'+x.name+'</td><td style="text-align:center;">'+x.s.installNo+'</td><td>'+fmtDate2(x.s.dueDate)+'</td><td class="tn">'+fmtN(x.s.amount)+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  }
  return h;
}

function previewLoanSchedule(){

  var principal=parseFloat(elPrincipal.value)||0;

    'إجمالي المصروفات الإدارية: <b style="color:var(--am);">'+fmtN(res.totalInterest)+'</b> <span style="color:var(--g5);">(تُحصّل بالكامل مع القسط الأول)</span> | '
    +'إجمالي المبلغ: <b style="color:var(--n);">'+fmtN(principal+res.totalInterest)+'</b><br>'

function saveLoan(){
  ensureLoanDB();
  var elName=document.getElementById('ln-name'), elPrincipal=document.getElementById('ln-principal'), elRate=document.getElementById('ln-rate'), elMonths=document.getElementById('ln-months'), elStart=document.getElementById('ln-start'), elFreq=document.getElementById('ln-freq');
  if(!elName||!elPrincipal||!elMonths||!elStart||!elFreq){toast('⚠️ افتح شاشة قرض جديد مرة أخرى');return;}
  var name=(elName.value||'').trim();
  var principal=parseFloat(elPrincipal.value)||0;
  var rate=parseFloat(elRate?elRate.value:0)||0;
  var months=parseInt(elMonths.value)||0;
  var startDate=elStart.value;
  var freq=elFreq.value;
  var accPay=(document.getElementById('ln-accpay')&&document.getElementById('ln-accpay').value)||'1111';
  if(!name){toast('⚠️ أدخل اسم العميل');return;}
  if(!principal){toast('⚠️ أدخل مبلغ القرض');return;}
  if(!months){toast('⚠️ أدخل مدة القرض');return;}
  if(!startDate){toast('⚠️ أدخل تاريخ الصرف');return;}
  var res=buildLoanSchedule(principal,rate,months,startDate,freq);
  var loanId='LN'+Date.now();
  if((DB.loans||[]).some(function(x){return x.id===loanId;})) loanId='LN'+Date.now()+'_'+Math.floor(Math.random()*1000);
  DB.entries.push({id:'E'+Date.now(),date:startDate,ref:loanId,narr:'صرف قرض صغير — '+name,
    lines:[{acc:'1126',dr:principal,cr:0,narr:'أصل القرض — '+name},{acc:accPay,dr:0,cr:principal,narr:'صرف من الخزينة/البنك'}],
    status:'posted',type:'journal',createdAt:new Date().toISOString()});
  if(res.totalInterest>0){
    DB.entries.push({id:'E'+(Date.now()+1),date:startDate,ref:loanId,narr:'إثبات المصروفات الإدارية للقرض — '+name,
      lines:[{acc:'1127',dr:res.totalInterest,cr:0,narr:'مصروفات إدارية مستحقة — '+name},{acc:'4213',dr:0,cr:res.totalInterest,narr:'إيرادات مصروفات إدارية للقروض'}],
      status:'posted',type:'journal',createdAt:new Date().toISOString()});
  }
  DB.loans.push({id:loanId,clientName:name,clientId:(document.getElementById('ln-cid').value||'').trim(),
    clientPhone:(document.getElementById('ln-phone').value||'').trim(),clientAddr:(document.getElementById('ln-addr').value||'').trim(),
    principal:principal,interestRate:rate,months:months,payFreq:freq,startDate:startDate,
    totalInterest:res.totalInterest,schedule:res.schedule,status:'active',
    createdAt:new Date().toISOString()});
  if(!save()) return;
  closeLMo('mo-loan');
  toast('✅ تم إنشاء القرض للعميل '+name);
  rقروضPage();
  rDash();
}

function openLoanCard(loanId){

  var paidPrincipal=paid.reduce(function(s,x){return s+(x.principalPart||0);},0);
  var paidInterest=paid.reduce(function(s,x){return s+(x.interestPaid||x.interestPart||0);},0);
  var h='<div style="background:linear-gradient(135deg,var(--nd),var(--n));color:white;border-radius:12px;padding:14px;margin-bottom:12px;">'
    +'<div style="font-family:Tajawal,sans-serif;font-size:17px;font-weight:900;margin-bottom:4px;">'+l.clientName+'</div>';
  if(l.clientId) h+='<div style="font-size:11px;opacity:.8;">🪪 '+l.clientId+'</div>';
  if(l.clientPhone) h+='<div style="font-size:11px;opacity:.8;">📞 '+l.clientPhone+'</div>';
  h+='<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">'
    +'<span style="background:rgba(255,255,255,.2);font-size:10px;padding:2px 9px;border-radius:20px;">'+(l.payFreq==='monthly'?'شهري':'نصف سنوي')+'</span>'
    +'<span style="background:rgba(255,255,255,.2);font-size:10px;padding:2px 9px;border-radius:20px;">'+l.interestRate+'% سنوياً</span>'
    +'<span style="background:rgba(255,255,255,.2);font-size:10px;padding:2px 9px;border-radius:20px;">'+l.months+' شهر</span>'
    +'</div></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">';
  [{l:'أصل القرض',v:fmtN(l.principal),c:'var(--n)'},{l:'إجمالي المصروفات الإدارية',v:fmtN(l.totalInterest||0),c:'var(--am)'},
   {l:'مسدد (أصل)',v:fmtN(paidPrincipal),c:'var(--gr)'},{l:'مصروفات إدارية محصلة',v:fmtN(paidInterest),c:'var(--gr)'},
   {l:'متبقي (أصل)',v:fmtN(l.principal-paidPrincipal),c:'var(--rd)'},{l:'مصروفات إدارية متبقية',v:fmtN((l.totalInterest||0)-paidInterest),c:'var(--am)'}
  ].forEach(function(c){h+='<div style="background:var(--g1);border-radius:8px;padding:10px;text-align:center;"><div style="font-size:10px;color:var(--g5);">'+c.l+'</div><div style="font-family:Tajawal,sans-serif;font-size:14px;font-weight:900;color:'+c.c+';margin-top:3px;">'+c.v+'</div></div>';});
  h+='</div>';
  if(overdue.length) h+='<div style="background:var(--rbg);border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px;font-weight:800;color:var(--rd);">⚠️ '+overdue.length+' قسط متأخر</div>';
  h+='<div style="font-weight:800;font-size:12px;color:var(--n);margin-bottom:8px;">📅 جدول الأقساط</div>';
  h+='<div style="overflow-x:auto;"><table><thead><tr><th>#</th><th>الاستحقاق</th><th>القسط</th><th>أصل</th><th>مصروفات إدارية</th><th>الحالة</th></tr></thead><tbody>';
  (l.schedule||[]).forEach(function(s){
    var isOD=s.status==='pending'&&new Date(s.dueDate)<today;
    var st=s.status==='paid'?'<span class="badge bg">مسدد</span>':isOD?'<span class="badge br">متأخر</span>':'<span class="badge ba">قادم</span>';
    h+='<tr style="'+(isOD?'background:#fff5f5;':'')+'"><td style="text-align:center;font-weight:700;">'+s.installNo+'</td>'
      +'<td>'+fmtDate2(s.dueDate)+'</td><td class="tn">'+fmtN(s.amount)+'</td>'
      +'<td class="tn">'+fmtN(s.principalPart)+'</td><td class="tn" style="color:var(--am);">'+fmtN(s.interestPart)+'</td>'
      +'<td>'+st+'</td></tr>';
  });
  h+='</tbody></table></div>';
  document.getElementById('mo-lcard-t').textContent='📋 كارت — '+l.clientName;

function confirmLoanPaymentFromModal(){
  var loanId=document.getElementById('lpay-lid').value;
  var installNo=parseInt(document.getElementById('lpay-ins').value);
  var amt=parseFloat(document.getElementById('lpay-amt').value)||0;
  var date=document.getElementById('lpay-date').value;
  var acc=document.getElementById('lpay-acc').value;
  var l=(DB.loans||[]).find(function(x){return x.id===loanId;});
  if(!l||!amt||!date){toast('⚠️ بيانات ناقصة');return;}
  var s=(l.schedule||[]).find(function(x){return x.installNo===installNo;});
  if(!s) return;
  s.status='paid'; s.paidDate=date; s.paidAmount=amt; s.interestPaid=s.interestPart;
  DB.entries.push({id:'E'+Date.now(),date:date,ref:loanId,narr:'تحصيل قسط '+installNo+' — '+l.clientName,
    lines:[{acc:acc,dr:amt,cr:0,narr:'تحصيل قسط '+installNo},{acc:'1126',dr:0,cr:s.principalPart,narr:'سداد أصل'},{acc:'1127',dr:0,cr:s.interestPart,narr:'سداد مصروفات إدارية'}],
    status:'posted',type:'journal',createdAt:new Date().toISOString()});
  if((l.schedule||[]).every(function(x){return x.status==='paid';})){l.status='closed';toast('🎉 تم سداد القرض بالكامل!');}
  else toast('✅ تم تسجيل سداد القسط '+installNo);
  save(); closeLMo('mo-lpay'); rقروضPage(); rDash();
}

function runLoanAccruals(loanId){
  var l=(DB.loans||[]).find(function(x){return x.id===loanId;});
  if(!l) return;
  var today=new Date(); today.setHours(0,0,0,0);
  var pending=(l.schedule||[]).filter(function(s){return s.status==='pending'&&new Date(s.dueDate)<=today;});
  if(!pending.length){toast('ℹ️ لا توجد أقساط مستحقة حتى اليوم');return;}
  var total=pending.reduce(function(s,x){return s+x.amount;},0);
  var h='<div style="background:var(--skp);border-radius:10px;padding:12px;margin-bottom:12px;">'
    +'<div style="font-weight:800;font-size:13px;color:var(--n);">'+l.clientName+'</div>'
    +'<div style="font-size:11px;color:var(--g5);">'+pending.length+' قسط مستحق — إجمالي: '+fmtN(total)+'</div></div>';
  pending.forEach(function(s){
    h+='<div style="display:flex;justify-content:space-between;padding:8px;background:var(--g1);border-radius:8px;margin-bottom:6px;">'
      +'<span style="font-size:12px;">قسط '+s.installNo+' — '+fmtDate2(s.dueDate)+'</span>'
      +'<span style="font-weight:700;color:var(--rd);">'+fmtN(s.amount)+'</span></div>';
  });

function createAccrualEntriesFromModal(){
  var loanId=document.getElementById('lacc-lid').value;

  var l=(DB.loans||[]).find(function(x){return x.id===loanId;});

  var today=new Date(); today.setHours(0,0,0,0);

      narr:'استحقاق قسط '+s.installNo+' — '+l.clientName,

      status:'posted',type:'journal',createdAt:new Date().toISOString()};
    DB.entries.push(entry); s.accrualEntryId=entry.id; count++;
  });
  save(); closeLMo('mo-lacc'); toast('✅ تم إنشاء '+count+' قيد استحقاق'); rقروضPage();

// fmt, fmtDate2, fmtN defined globally

function rContractsPage(){
  if(!DB.contracts) DB.contracts=[];
  var h='';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
  h+='<div><div class="ph-t">📋 سجل العقود</div>';
  h+='<div style="font-size:11px;color:var(--g4);">'+DB.contracts.length+' عقد مسجل</div></div>';
  h+='<button onclick="newContract()" class="btn btn-gr btn-sm">+ عقد جديد</button>';
  h+='</div>';

  // Expiring soon
  var today=new Date().toISOString().slice(0,10);
  var in30=new Date(Date.now()+30*24*60*60*1000).toISOString().slice(0,10);
  var expiring=DB.contracts.filter(function(c){return c.endDate&&c.endDate>=today&&c.endDate<=in30;});
  if(expiring.length){
    h+='<div style="background:#fff9c4;border-radius:10px;padding:10px;margin-bottom:12px;">';
    h+='<div style="font-weight:800;color:#92400e;margin-bottom:6px;">⚠️ عقود تنتهي خلال 30 يوماً ('+expiring.length+')</div>';
    expiring.forEach(function(c){
      h+='<div style="font-size:11.5px;color:#92400e;">• '+c.name+' — ينتهي: '+c.endDate+'</div>';
    });
    h+='</div>';
  }

  if(!DB.contracts.length){
    h+='<div style="text-align:center;padding:30px;color:var(--g4);">لا توجد عقود مسجلة</div>';
    return h;
  }

  DB.contracts.forEach(function(ct,i){
    // Calculate actual spending from entries linked to this contract
    var spent=0;
    // Method 1: entries with contractId matching this contract name
    (DB.entries||[]).filter(function(e){
      return e.status==='posted' && e.contractId===ct.name;
    }).forEach(function(e){
      (e.lines||[]).forEach(function(l){
        if(l.dr>0 && l.acc && l.acc[0]==='5') spent+=l.dr;
      });
    });
    // Method 2: if no contractId entries, fall back to tp+project+date range
    if(spent===0){
      var tpId=ct.party||'';
      (DB.entries||[]).filter(function(e){
        if(e.status!=='posted') return false;
        if(ct.startDate && e.date < ct.startDate) return false;
        if(ct.endDate && e.date > ct.endDate) return false;
        if(ct.project && e.proj!==ct.project && !e.lines.some(function(l){return l.proj===ct.project;})) return false;
        return true;
      }).forEach(function(e){
        (e.lines||[]).forEach(function(l){
          if(l.dr>0 && l.acc && l.acc[0]==='5' && (tpId?l.tpId===tpId:false)) spent+=l.dr;
        });
      });
    }
    spent=Math.min(spent,ct.value||0);
    var remaining=(ct.value||0)-spent;
    var daysLeft=ct.endDate?Math.ceil((new Date(ct.endDate)-new Date())/(1000*60*60*24)):null;
    var pct=ct.value>0?Math.round(spent/(ct.value||1)*100):0;
    var statusColor=daysLeft!==null&&daysLeft<30?'#dc2626':daysLeft!==null&&daysLeft<90?'#d97706':'#059669';
    h+='<div style="background:white;border-radius:11px;padding:12px;margin-bottom:8px;border:1px solid #eee;">';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">';
    h+='<div>';
    h+='<div style="font-weight:800;font-size:13px;color:var(--nd);">'+ct.name+'</div>';
    h+='<div style="font-size:10.5px;color:var(--g4);">'+(ct.party||'')+(ct.project?' · '+ct.project:'')+'</div>';
    h+='</div>';
    h+='<div style="text-align:left;">';
    h+='<div style="font-weight:900;font-size:14px;">'+fmt(ct.value)+' ج.م</div>';
    h+='<div style="font-size:10px;color:'+(pct>100?'#dc2626':pct>80?'#d97706':'#059669')+';">'+pct+'% منصرف</div>';
    if(daysLeft!==null) h+='<div style="font-size:10px;color:'+statusColor+';font-weight:700;">'+(daysLeft<0?'منتهي':daysLeft+' يوم متبقي')+'</div>';
    h+='</div></div>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:10.5px;margin-bottom:8px;">';
    h+='<div><span style="color:var(--g4);">بداية: </span>'+ct.startDate+'</div>';
    h+='<div><span style="color:var(--g4);">نهاية: </span>'+ct.endDate+'</div>';
    h+='<div><span style="color:var(--g4);">النوع: </span>'+(ct.type||'—')+'</div>';
    h+='</div>';
    var barW=Math.min(pct,100);
    h+='<div style="background:#f0f0f0;border-radius:4px;height:5px;margin:6px 0;">';
    h+='<div style="background:'+(pct>100?'#dc2626':pct>80?'#d97706':'#059669')+';height:100%;border-radius:4px;width:'+barW+'%;"></div></div>';
    h+='<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--g4);margin-bottom:6px;">';
    h+='<span>متبقي: '+fmt(remaining)+' ج.م</span><span>'+fmt(ct.value)+' ج.م</span></div>';
    h+='<div style="display:flex;gap:6px;">';
    h+='<button data-idx="'+i+'" onclick="viewContractEntries(this.dataset.idx)" style="flex:1;background:#1d4ed8;border:none;color:white;border-radius:7px;padding:6px;font-size:10.5px;cursor:pointer;font-family:Cairo,sans-serif;">📝 قيوده</button>';
    h+='<button data-idx="'+i+'" onclick="editContract(this.dataset.idx)" style="flex:1;background:var(--sk);border:none;color:white;border-radius:7px;padding:5px;font-size:10px;cursor:pointer;font-family:Cairo,sans-serif;">✏️ تعديل</button>';
    h+='<button data-idx="'+i+'" onclick="deleteContract(this.dataset.idx)" style="background:#fee2e2;border:none;color:#dc2626;border-radius:7px;padding:5px 8px;font-size:10px;cursor:pointer;">🗑️</button>';
    h+='</div></div>';
  });
  return h;
}

function postProvisionEntry(){
  var activeEmps=(DB.employees||[]).filter(function(e){return e.status==='active';});
  var total=0;
  activeEmps.forEach(function(e){
    var hireDate=e.hireDate?new Date(e.hireDate):null;
    var years=hireDate?Math.floor((new Date()-hireDate)/(365.25*24*60*60*1000)):0;
    if(years>0) total+=(e.sal||0)/12;
  });
  if(total<=0){toast('⚠️ لا توجد مخصصات محسوبة');return;}
  total=Math.round(total*100)/100;
  var today=new Date().toISOString().slice(0,10);
  var eid='PROV-'+today.slice(0,7);
  if(DB.entries.find(function(e){return e.id===eid;})){
    toast('⚠️ قيد المخصص لهذا الشهر موجود بالفعل: '+eid);return;
  }
  DB.entries.push({
    id:eid,date:today,
    desc:'مخصص مكافأة نهاية الخدمة — '+today.slice(0,7),
    ref:'PROV',proj:'',status:'posted',
    lines:[
      {acc:'5319',an:'مخصص مكافأة نهاية الخدمة',dr:total,cr:0,proj:'',cc:'',tpId:'',tpName:'',tpType:''},
      {acc:'2211',an:'مخصص مستحق — مكافأة نهاية خدمة',dr:0,cr:total,proj:'',cc:'',tpId:'',tpName:'',tpType:''},
    ]
  });
  save();
  toast('✅ تم ترحيل قيد المخصص: '+fmt(total)+' ج.م — رقم القيد: '+eid);
}

function rExecDash(){
  var B=bals();

  // ── Cash & Financial Health ───────────────────────────────────

    var b=B[a.c]||{dr:0,cr:0}; cash+=b.dr-b.cr;
  });
  var tRev=0,tExp=0;
  DB.accounts.forEach(function(a){
    var b=B[a.c]||{dr:0,cr:0};
    if(a.c&&a.c[0]==='4') tRev+=b.cr-b.dr;
    if(a.c&&a.c[0]==='5') tExp+=b.dr-b.cr;
  });
  var surplus=tRev-tExp;
  var now3=new Date(Date.now()-90*24*60*60*1000).toISOString().slice(0,10);

    (e.lines||[]).forEach(function(l){if(l.acc&&l.acc[0]==='5'&&l.dr>0){monthlyMap[mo]+=l.dr;}});

      var dt=mo[0]+'-'+String(day).padStart(2,'0');
      var tp=pick(['TP001','TP002','TP004','TP005','TP006','TP007','TP009','TP012']);
      var tpName=(DB.thirdParties.find(function(t){return t.id===tp;})||{name:tp}).name;
      var e=entry(id,dt,'سداد مستحقات — '+tpName,'PAY-'+id,'',[
        ln('2111','موردون ودائنون',amt,0,'',tp,tpName),
        ln('1112','ح/ البنك الجاري',0,amt,'',tp,tpName),
      ]);
      if(e){newEntries.push(e);existingIds.add(id);}
    }
  });

  // ── مجموعة 7: مصروفات متفرقة (50 قيد) ─────────────────────
  var miscTxns=[
    {acc:'5221',an:'مكافآت ومنح موظفين',range:[2000,8000]},
    {acc:'5241',an:'مستلزمات مكتبية',range:[500,3000]},
    {acc:'5251',an:'مصروفات طباعة وتصوير',range:[300,1500]},
    {acc:'5261',an:'تدريب وتأهيل',range:[3000,15000]},
    {acc:'5271',an:'مصروفات سفر وانتقالات',range:[1000,5000]},
    {acc:'5281',an:'ضيافة واجتماعات',range:[500,2000]},
    {acc:'5291',an:'مصروفات متنوعة',range:[200,1000]},
    {acc:'5411',an:'استشارات ودراسات',range:[5000,20000]},
  ];
  for(var k=0;k<50;k++){
    var id=eid();
    if(!existingIds.has(id)){
      var op=miscTxns[k%miscTxns.length];
      var mo=months[k%months.length];
      var day=Math.floor(Math.random()*25)+1;
      var dt=mo[0]+'-'+String(day).padStart(2,'0');
      var amt2=r(op.range[0],op.range[1]);
      amt2=Math.round(amt2/100)*100;
      var proj2=pick(projs);
      var e=entry(id,dt,op.an,'MISC-'+id,proj2,[
        ln(op.acc,op.an,amt2,0,proj2),
        ln('1112','ح/ البنك الجاري',0,amt2,proj2),
      ]);
      if(e){newEntries.push(e);existingIds.add(id);}
    }
  }

  // Add all entries
  DB.entries=DB.entries.concat(newEntries);
  DB.entries.sort(function(a,b){return a.date>b.date?1:-1;});
  save();
  toast('✅ تم إضافة '+newEntries.length+' قيد + '+tpSeed.length+' مورد + '+contractSeed.length+' عقد');
  console.log('Added entries:',newEntries.length);
}
