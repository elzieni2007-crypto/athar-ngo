function rptSupplierPayments(){
  var h='<div style="font-weight:800;font-size:14px;margin-bottom:12px;">📅 دفعات الموردين</div>';
  var rows=[];
  (DB.entries||[]).filter(function(e){return e.status==="posted";}).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.tpId&&l.tpId.startsWith("SUP-")&&(l.dr||0)>0){
        rows.push({date:e.date,ref:e.ref,desc:e.desc,sup:l.tpName||l.tpId,acc:l.acc,an:l.an,amt:l.dr,pm:e.payMethod||"—"});
      }
    });
  });
  rows.sort(function(a,b){return a.date<b.date?-1:1;});
  var csvRows=[["التاريخ","المرجع","البيان","المورد","الحساب","المبلغ","طريقة الدفع"]];
  h+='<div style="overflow-x:auto;"><table><thead><tr><th>التاريخ</th><th>المرجع</th><th>المورد</th><th>الحساب</th><th>المبلغ</th><th>طريقة الدفع</th></tr></thead><tbody>';
  var total=0;
  rows.forEach(function(r){
    total+=r.amt;
    csvRows.push([r.date,r.ref,r.desc,r.sup,r.acc+"—"+r.an,r.amt,r.pm]);
    h+='<tr><td style="font-size:11px;white-space:nowrap;">'+r.date+'</td>';
    h+='<td style="font-size:11px;color:var(--sk);">'+r.ref+'</td>';
    h+='<td style="font-size:12px;font-weight:700;">'+r.sup+'</td>';
    h+='<td style="font-size:10.5px;"><code>'+r.acc+'</code></td>';
    h+='<td class="tn" style="font-weight:700;">'+fmt(r.amt)+'</td>';
    h+='<td style="font-size:11px;">'+r.pm+'</td></tr>';
  });
  h+='</tbody><tfoot><tr style="background:var(--n);"><td colspan="4" style="color:white;font-weight:900;padding:9px;">الإجمالي</td>';
  h+='<td class="tn" style="color:white;font-weight:900;padding:9px;">'+fmt(total)+'</td><td></td></tr></tfoot></table></div>';
  h+='<button class="btn btn-sm btn-gy" onclick="dlCSV('+JSON.stringify(csvRows)+',\'supplier-payments.csv\')" style="width:100%;margin-top:8px;font-size:11px;">📥 تصدير CSV</button>';
  om("📅 دفعات الموردين",h);
}

function rptProjectsSummary(){
  var h='<div style="font-weight:800;font-size:14px;margin-bottom:12px;">📋 ملخص إنجاز المشروعات</div>';
  DB.projects.forEach(function(p){
    var spent=getProjectSpent(p.code);
    var budget=p.budget||0;
    var pct=budget>0?Math.round(spent/budget*100):0;
    var col=pct>90?"var(--rd)":pct>70?"var(--am)":"var(--gr)";
    var entCount=(DB.entries||[]).filter(function(e){return e.proj===p.code&&e.status==="posted";}).length;
    h+='<div class="card" style="margin-bottom:10px;">';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">';
    h+='<div><span class="badge bb" style="font-size:9.5px;">'+p.code+'</span>';
    h+='<div style="font-weight:800;font-size:14px;margin-top:3px;">'+p.name+'</div>';
    h+='<div style="font-size:11px;color:var(--g4);">'+(p.donor||"—")+' · '+(p.start||"")+(p.end?" → "+p.end:"")+'</div>';
    if(p.thematic){
      var thObj=(DB.masterData&&DB.masterData.thematics||[]).find(function(x){return x.code===p.thematic;});
      if(thObj)h+='<span class="badge bb" style="font-size:9px;">'+thObj.nameAr+'</span>';
    }
    h+='</div>';
    h+='<div style="text-align:left;"><div style="font-size:9px;color:var(--g4);">صُرف</div><div style="font-weight:900;font-size:18px;color:'+col+';">'+pct+'%</div></div></div>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;font-size:11px;text-align:center;margin-bottom:8px;">';
    h+='<div style="background:var(--g1);border-radius:7px;padding:7px;"><div style="color:var(--g4);font-size:9.5px;">الموازنة</div><div style="font-weight:800;">'+fmt(budget)+'</div></div>';
    h+='<div style="background:var(--rbg);border-radius:7px;padding:7px;"><div style="color:var(--g4);font-size:9.5px;">الصرف</div><div style="font-weight:800;color:var(--rd);">'+fmt(spent)+'</div></div>';
    var remClr=(budget-spent)>=0?"var(--gr)":"var(--rd)";
    h+='<div style="background:var(--gbg);border-radius:7px;padding:7px;"><div style="color:var(--g4);font-size:9.5px;">المتبقي</div><div style="font-weight:800;color:'+remClr+';">'+fmt(budget-spent)+'</div></div>';
    h+='<div style="background:var(--skp);border-radius:7px;padding:7px;"><div style="color:var(--g4);font-size:9.5px;">القيود</div><div style="font-weight:800;color:var(--n);">'+entCount+'</div></div>';
    h+='</div>';
    h+='<div class="pw"><div class="pb" style="width:'+Math.min(pct,100)+'%;background:'+col+';"></div></div>';
    h+='<div style="display:flex;gap:6px;margin-top:8px;">';
    h+='<button class="btn btn-sm" style="background:var(--n);flex:1;font-size:10.5px;" onclick="viewProject(\''+p.code+'\')">📉 BVA التفصيلي</button>';
    h+='<button class="btn btn-sm btn-gy" onclick="exportBVA(\''+p.code+'\')" style="font-size:10.5px;">📥 CSV</button>';
    h+='</div></div>';
  });
  om("📋 ملخص المشروعات",h);
}
