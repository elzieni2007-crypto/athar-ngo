<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أثر</title>
<style>
body{font-family:sans-serif;background:#f0f5fa;margin:0;padding:0;direction:rtl;}
.topbar{background:#1e3a6e;color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.topbar h1{font-size:18px;margin:0;}
.content{padding:14px;}
.card{background:white;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.card h3{color:#1e3a6e;margin:0 0 10px;font-size:15px;}
.btn{background:#1e3a6e;color:white;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-family:sans-serif;cursor:pointer;margin:4px;}
.btn-sky{background:#29abe2;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:white;border-radius:10px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.stat-val{font-size:18px;font-weight:900;color:#1e3a6e;}
.stat-lbl{font-size:11px;color:#637591;margin-top:3px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#152a52;display:flex;justify-content:space-around;padding:8px 0;}
.bn{display:flex;flex-direction:column;align-items:center;color:rgba(255,255,255,.6);font-size:10px;cursor:pointer;padding:4px 10px;border-radius:8px;}
.bn.active,.bn:hover{color:white;background:rgba(41,171,226,.2);}
.bn span{font-size:20px;}
.page{display:none;padding-bottom:70px;}
.page.active{display:block;}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:#d1fae5;color:#065f46;}
.badge-red{background:#fee2e2;color:#991b1b;}
.badge-blue{background:#dbeafe;color:#1e3a6e;}
input,select{width:100%;padding:9px 12px;border:1.5px solid #e2eaf3;border-radius:8px;font-size:13px;font-family:sans-serif;box-sizing:border-box;margin-top:4px;}
label{font-size:11px;font-weight:700;color:#637591;}
.form-group{margin-bottom:10px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:#f8fafc;padding:8px;text-align:right;color:#637591;font-size:11px;border-bottom:2px solid #e2eaf3;}
td{padding:8px;border-bottom:1px solid #f0f5fa;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;}
.modal.open{display:flex;}
.modal-box{background:white;border-radius:14px;width:94%;max-height:90vh;overflow-y:auto;}
.modal-header{background:#1e3a6e;color:white;padding:14px 16px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:center;}
.modal-body{padding:16px;}
</style>
</head>
<body>

<div class="topbar">
  <h1>أثر | للحلول المالية</h1>
  <span id="org-name" style="font-size:12px;opacity:.8;">جمعية نموذجية</span>
</div>

<div class="content">
  <div id="page-dashboard" class="page active"></div>
  <div id="page-journal" class="page"></div>
  <div id="page-projects" class="page"></div>
  <div id="page-payroll" class="page"></div>
  <div id="page-more" class="page"></div>
</div>

<div class="bottom-nav">
  <div class="bn active" onclick="showPage('dashboard',this)"><span>📊</span>الرئيسية</div>
  <div class="bn" onclick="showPage('journal',this)"><span>📝</span>القيود</div>
  <div class="bn" onclick="showPage('projects',this)"><span>🎯</span>المشروعات</div>
  <div class="bn" onclick="showPage('payroll',this)"><span>💳</span>المرتبات</div>
  <div class="bn" onclick="showPage('more',this)"><span>☰</span>المزيد</div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <span id="modal-title">–</span>
      <button onclick="closeModal()" style="background:rgba(255,255,255,.2);border:none;color:white;border-radius:6px;padding:4px 10px;font-size:16px;cursor:pointer;">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// ════ DATA ════════════════════════════════════
var DB = {
  org: {name:'جمعية نموذجية للتنمية',year:2025},
  projects: [
    {code:'P001',name:'مشروع التمكين الاقتصادي',donor:'USAID',budget:1500000,spent:820000,status:'active'},
    {code:'P002',name:'برنامج الصحة الإنجابية',donor:'EU',budget:800000,spent:320000,status:'active'},
  ],
  entries: [
    {id:'J2025-001',date:'2025-01-15',ref:'REC-001',desc:'استلام منحة USAID',proj:'P001',lines:[{acc:'110102',an:'بنك مصر',dr:750000,cr:0},{acc:'4001',an:'منحة USAID',dr:0,cr:750000}],status:'posted'},
    {id:'J2025-002',date:'2025-01-20',ref:'PV-001',desc:'رواتب يناير',proj:'P001',lines:[{acc:'5101',an:'رواتب',dr:85000,cr:0},{acc:'110101',an:'الخزينة',dr:0,cr:85000}],status:'posted'},
  ],
  employees: [
    {id:'E001',name:'أحمد محمد السيد',pos:'مدير مالي',sal:18000,allow:2000,status:'active'},
    {id:'E002',name:'سارة علي حسن',pos:'محاسبة',sal:12000,allow:1000,status:'active'},
  ],
  accounts: [
    {c:'110101',n:'الخزينة',nat:'dr'},{c:'110102',n:'بنك مصر',nat:'dr'},
    {c:'110103',n:'البنك الأهلي',nat:'dr'},{c:'4001',n:'منحة USAID',nat:'cr'},
    {c:'4002',n:'منحة EU',nat:'cr'},{c:'5101',n:'رواتب وأجور',nat:'dr'},
    {c:'5201',n:'إيجارات',nat:'dr'},{c:'5301',n:'تدريب',nat:'dr'},
    {c:'2103',n:'ضرائب محجوزة',nat:'cr'},{c:'5103',n:'تأمينات',nat:'dr'},
  ]
};

// Load saved data
try {
  var saved = localStorage.getItem('athar');
  if(saved) DB = JSON.parse(saved);
} catch(e){}

function save() {
  try { localStorage.setItem('athar', JSON.stringify(DB)); } catch(e){}
}

function fmt(n) {
  return (n||0).toLocaleString('ar-EG',{minimumFractionDigits:0,maximumFractionDigits:0});
}

function calcTax(sal,allow) {
  var gross = sal + (allow||0);
  var ins = Math.round(Math.min(gross,10400)*0.11);
  var taxBase = Math.max(0,gross-ins-1667)*12;
  var tax = 0;
  if(taxBase>400000) tax=61375+(taxBase-400000)*0.225;
  else if(taxBase>200000) tax=21375+(taxBase-200000)*0.2;
  else if(taxBase>70000) tax=1875+(taxBase-70000)*0.15;
  else if(taxBase>40000) tax=(taxBase-40000)*0.025;
  return {gross:gross, ins:ins, tax:Math.round(tax/12), net:gross-ins-Math.round(tax/12)};
}

// ════ PAGES ════════════════════════════════════
function renderDashboard() {
  var tG=0,tE=0,cash=0,bank=0;
  DB.entries.forEach(function(e){
    if(e.status!=='posted') return;
    (e.lines||[]).forEach(function(l){
      if(l.acc==='110101') cash += (l.dr||0)-(l.cr||0);
      if(l.acc==='110102'||l.acc==='110103') bank += (l.dr||0)-(l.cr||0);
      if((l.acc||'').charAt(0)==='4') tG += l.cr||0;
      if((l.acc||'').charAt(0)==='5') tE += l.dr||0;
    });
  });
  
  var html = '<div style="background:linear-gradient(135deg,#152a52,#1e3a6e,#29abe2);color:white;border-radius:12px;padding:18px;margin-bottom:14px;">'
    +'<div style="font-size:20px;font-weight:900;">أثر للحلول المالية</div>'
    +'<div style="font-size:12px;opacity:.8;margin-top:4px;">النظام المحاسبي المتكامل للجمعيات — برعاية تنمويين مصر</div>'
    +'</div>'
    +'<div class="grid2">'
    +'<div class="stat"><div class="stat-val">'+fmt(tG)+'</div><div class="stat-lbl">إجمالي المنح</div></div>'
    +'<div class="stat"><div class="stat-val" style="color:#dc2626;">'+fmt(tE)+'</div><div class="stat-lbl">المصروفات</div></div>'
    +'<div class="stat"><div class="stat-val" style="color:#059669;">'+fmt(bank)+'</div><div class="stat-lbl">رصيد البنوك</div></div>'
    +'<div class="stat"><div class="stat-val" style="color:#29abe2;">'+fmt(cash)+'</div><div class="stat-lbl">رصيد الخزينة</div></div>'
    +'</div>'
    +'<div class="card"><h3>📉 المشروعات <button class="btn btn-sky" onclick="showPage(\'projects\',null)" style="float:left;padding:5px 10px;font-size:11px;">عرض الكل</button></h3>';
  
  DB.projects.forEach(function(p){
    var pct = Math.round((p.spent/p.budget)*100);
    html += '<div style="margin-bottom:10px;">'
      +'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">'
      +'<strong>'+p.name+'</strong><span style="color:'+(pct>90?'#dc2626':pct>70?'#d97706':'#059669')+';">'+pct+'%</span></div>'
      +'<div style="height:6px;background:#f0f5fa;border-radius:4px;overflow:hidden;">'
      +'<div style="height:100%;width:'+Math.min(pct,100)+'%;background:'+(pct>90?'#dc2626':pct>70?'#d97706':'#059669')+';border-radius:4px;"></div></div>'
      +'<div style="display:flex;justify-content:space-between;font-size:11px;color:#637591;margin-top:3px;">'
      +'<span>الموازنة: '+fmt(p.budget)+' ج.م</span><span>الصرف: '+fmt(p.spent)+' ج.م</span></div>'
      +'</div>';
  });
  
  html += '</div><div class="card"><h3>📝 آخر القيود <button class="btn" onclick="openNewEntry()" style="float:left;padding:5px 10px;font-size:11px;">+ قيد جديد</button></h3>'
    +'<table><thead><tr><th>رقم القيد</th><th>البيان</th><th>المبلغ</th></tr></thead><tbody>';
  
  DB.entries.slice(-3).reverse().forEach(function(e){
    var t = (e.lines||[]).reduce(function(s,l){return s+(l.dr||0);},0);
    html += '<tr><td><span class="badge badge-blue">'+e.id+'</span></td>'
      +'<td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+e.desc+'</td>'
      +'<td style="font-weight:700;text-align:left;">'+fmt(t)+'</td></tr>';
  });
  
  html += '</tbody></table></div>';
  document.getElementById('page-dashboard').innerHTML = html;
}

function renderJournal() {
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'
    +'<h2 style="color:#1e3a6e;margin:0;font-size:18px;">📝 قيود اليومية</h2>'
    +'<button class="btn" onclick="openNewEntry()">+ قيد جديد</button></div>';
  
  if(DB.entries.length===0) {
    html += '<div class="card" style="text-align:center;color:#637591;padding:30px;">لا توجد قيود بعد</div>';
  } else {
    DB.entries.slice().reverse().forEach(function(e){
      var tD = (e.lines||[]).reduce(function(s,l){return s+(l.dr||0);},0);
      html += '<div class="card">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start;">'
        +'<div style="flex:1;">'
        +'<div style="margin-bottom:5px;"><span class="badge badge-blue">'+e.id+'</span> '
        +'<span class="badge '+(e.status==='posted'?'badge-green':'')+'">'+( e.status==='posted'?'مرحّل':'مسودة')+'</span></div>'
        +'<div style="font-weight:700;font-size:13px;">'+e.desc+'</div>'
        +'<div style="font-size:11px;color:#637591;">'+e.date+' · '+e.ref+'</div>'
        +'</div>'
        +'<div style="text-align:left;">'
        +'<div style="font-weight:900;font-size:16px;color:#1e3a6e;">'+fmt(tD)+'</div>'
        +'<button class="btn" onclick="viewEntry(\''+e.id+'\')" style="padding:4px 10px;font-size:11px;margin-top:4px;">عرض</button>'
        +'</div></div>'
        +'<div style="margin-top:8px;background:#f8fafc;border-radius:7px;padding:8px;">'
        +(e.lines||[]).map(function(l){return'<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;">'
          +'<span style="color:#637591;">'+l.acc+' — '+l.an+'</span>'
          +'<span style="font-weight:700;color:'+((l.dr||0)>0?'#dc2626':'#059669')+';">'
          +((l.dr||0)>0?'مدين '+fmt(l.dr):'دائن '+fmt(l.cr))+'</span></div>';}).join('')
        +'</div></div>';
    });
  }
  document.getElementById('page-journal').innerHTML = html;
}

function renderProjects() {
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'
    +'<h2 style="color:#1e3a6e;margin:0;font-size:18px;">🎯 المشروعات</h2>'
    +'<button class="btn" onclick="openNewProject()">+ مشروع جديد</button></div>';
  
  DB.projects.forEach(function(p){
    var pct = (p.spent/p.budget)*100;
    html += '<div class="card">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">'
      +'<div><span class="badge badge-blue">'+p.code+'</span>'
      +'<div style="font-weight:800;font-size:14px;margin-top:4px;">'+p.name+'</div>'
      +'<div style="font-size:11px;color:#637591;">'+p.donor+'</div></div>'
      +'<span class="badge badge-green">'+( p.status==='active'?'نشط':'إغلاق')+'</span></div>'
      +'<div class="grid2" style="gap:8px;font-size:12px;">'
      +'<div style="background:#f8fafc;border-radius:7px;padding:8px;text-align:center;"><div style="color:#637591;">الموازنة</div><div style="font-weight:800;">'+fmt(p.budget)+'</div></div>'
      +'<div style="background:#fee2e2;border-radius:7px;padding:8px;text-align:center;"><div style="color:#637591;">الصرف</div><div style="font-weight:800;color:#dc2626;">'+fmt(p.spent)+'</div></div></div>'
      +'<div style="margin-top:8px;height:6px;background:#f0f5fa;border-radius:4px;overflow:hidden;">'
      +'<div style="height:100%;width:'+Math.min(pct,100)+'%;background:'+(pct>90?'#dc2626':pct>70?'#d97706':'#059669')+';border-radius:4px;"></div></div>'
      +'<div style="text-align:left;font-size:11px;color:#637591;margin-top:3px;">'+pct.toFixed(1)+'%</div>'
      +'</div>';
  });
  document.getElementById('page-projects').innerHTML = html;
}

function renderPayroll() {
  var rows = DB.employees.filter(function(e){return e.status==='active';});
  var tG=0,tI=0,tT=0,tN=0;
  rows.forEach(function(e){var r=calcTax(e.sal,e.allow);tG+=r.gross;tI+=r.ins;tT+=r.tax;tN+=r.net;});
  
  var now = new Date();
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">'
    +'<h2 style="color:#1e3a6e;margin:0;font-size:18px;">💳 مسير المرتبات</h2>'
    +'<button class="btn" style="background:#059669;" onclick="genPayEntry()">✅ إنشاء قيد</button></div>'
    +'<div class="grid2" style="margin-bottom:12px;">'
    +'<div class="stat"><div class="stat-val">'+fmt(tG)+'</div><div class="stat-lbl">إجمالي الرواتب</div></div>'
    +'<div class="stat"><div class="stat-val" style="color:#059669;">'+fmt(tN)+'</div><div class="stat-lbl">إجمالي الصافي</div></div>'
    +'<div class="stat"><div class="stat-val" style="color:#dc2626;">'+fmt(tI)+'</div><div class="stat-lbl">تأمينات 11%</div></div>'
    +'<div class="stat"><div class="stat-val" style="color:#d97706;">'+fmt(tT)+'</div><div class="stat-lbl">ضريبة الدخل</div></div>'
    +'</div>';
  
  rows.forEach(function(e,i){
    var r = calcTax(e.sal,e.allow);
    html += '<div class="card">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">'
      +'<div><div style="font-weight:800;font-size:14px;">'+e.name+'</div>'
      +'<div style="font-size:11px;color:#637591;">'+e.pos+'</div></div>'
      +'<div style="text-align:left;"><div style="font-size:10px;color:#637591;">صافي المرتب</div>'
      +'<div style="font-weight:900;font-size:17px;color:#059669;">'+fmt(r.net)+'</div></div></div>'
      +'<div class="grid2" style="gap:6px;font-size:11px;margin-bottom:8px;">'
      +'<div style="background:#f8fafc;border-radius:7px;padding:7px;"><div style="color:#637591;">الإجمالي</div><div style="font-weight:800;">'+fmt(r.gross)+'</div></div>'
      +'<div style="background:#fee2e2;border-radius:7px;padding:7px;"><div style="color:#637591;">تأمين 11%</div><div style="font-weight:800;color:#dc2626;">'+fmt(r.ins)+'</div></div>'
      +'<div style="background:#fef3c7;border-radius:7px;padding:7px;"><div style="color:#637591;">ضريبة الدخل</div><div style="font-weight:800;color:#d97706;">'+fmt(r.tax)+'</div></div>'
      +'<div style="background:#d1fae5;border-radius:7px;padding:7px;"><div style="color:#637591;">صافي المرتب</div><div style="font-weight:800;color:#059669;">'+fmt(r.net)+'</div></div>'
      +'</div>'
      +'<button class="btn" onclick="editSal('+i+')" style="width:100%;background:#29abe2;font-size:12px;">✏️ تعديل المرتب</button>'
      +'</div>';
  });
  document.getElementById('page-payroll').innerHTML = html;
}

function renderMore() {
  var html = '<h2 style="color:#1e3a6e;margin:0 0 14px;font-size:18px;">القائمة الكاملة</h2>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">';
  var items = [
    {icon:'🌳',title:'شجرة الحسابات',fn:'accounts'},
    {icon:'⚖️',title:'ميزان المراجعة',fn:'trial'},
    {icon:'📈',title:'الميزانية العمومية',fn:'balance'},
    {icon:'💰',title:'قائمة الدخل',fn:'income'},
    {icon:'📉',title:'متابعة BVA',fn:'bva'},
    {icon:'🏦',title:'البنوك والخزينة',fn:'banks'},
    {icon:'📦',title:'المخازن',fn:'inventory'},
    {icon:'👥',title:'الموظفين',fn:'employees'},
    {icon:'⚙️',title:'الإعدادات',fn:'settings'},
  ];
  items.forEach(function(item){
    html += '<div class="card" onclick="openSubPage(\''+item.fn+'\')" style="cursor:pointer;text-align:center;padding:16px;">'
      +'<div style="font-size:26px;">'+item.icon+'</div>'
      +'<div style="font-weight:700;font-size:13px;margin-top:6px;color:#1e3a6e;">'+item.title+'</div>'
      +'</div>';
  });
  html += '</div>';
  document.getElementById('page-more').innerHTML = html;
}

// ════ NAVIGATION ════════════════════════════════
function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.bn').forEach(function(b){b.classList.remove('active');});
  
  var el = document.getElementById('page-'+name);
  if(el) el.classList.add('active');
  if(btn) btn.classList.add('active');
  
  if(name==='dashboard') renderDashboard();
  else if(name==='journal') renderJournal();
  else if(name==='projects') renderProjects();
  else if(name==='payroll') renderPayroll();
  else if(name==='more') renderMore();
  
  window.scrollTo(0,0);
}

function openSubPage(name) {
  var pages = {
    accounts: renderAccountsPage,
    trial: renderTrialPage,
    balance: renderBalancePage,
    income: renderIncomePage,
    bva: renderBVAPage,
    banks: renderBanksPage,
    inventory: renderInventoryPage,
    employees: renderEmployeesPage,
    settings: renderSettingsPage,
  };
  if(pages[name]) {
    openModal(name, pages[name]());
  }
}

// ════ MODALS ════════════════════════════════════
function openModal(title, content) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = content;
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

// ════ ENTRY MODAL ════════════════════════════════
function openNewEntry() {
  var accOpts = DB.accounts.map(function(a){return'<option value="'+a.c+'">'+a.c+' — '+a.n+'</option>';}).join('');
  var projOpts = DB.projects.map(function(p){return'<option value="'+p.code+'">'+p.name+'</option>';}).join('');
  
  document.getElementById('modal-title').textContent = 'قيد يومية جديد';
  document.getElementById('modal-body').innerHTML = 
    '<div class="form-group"><label>التاريخ *</label><input type="date" id="e-date" value="'+new Date().toISOString().split('T')[0]+'"></div>'
    +'<div class="form-group"><label>المرجع</label><input type="text" id="e-ref" placeholder="PV-001"></div>'
    +'<div class="form-group"><label>البيان *</label><input type="text" id="e-desc" placeholder="وصف العملية المالية"></div>'
    +'<div class="form-group"><label>المشروع</label><select id="e-proj"><option value="">—</option>'+projOpts+'</select></div>'
    +'<hr style="margin:12px 0;border:none;border-top:1px solid #e2eaf3;">'

function addEntryLine() {
  var i = window._entryLines++;
  var div = document.createElement('div');
  div.style = 'display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;';
  div.id = 'el-'+i;
  div.innerHTML = '<select id="ea-'+i+'" style="grid-column:1/-1;"><option value="">اختر الحساب</option>'+window._accOpts+'</select>'
    +'<input type="number" id="edr-'+i+'" placeholder="مدين" oninput="updateEntryTotal()">'
    +'<input type="number" id="ecr-'+i+'" placeholder="دائن" oninput="updateEntryTotal()">';
  document.getElementById('entry-lines').appendChild(div);
}

function updateEntryTotal() {
  var tD=0, tC=0;
  for(var i=0;i<window._entryLines;i++) {
    var dr=document.getElementById('edr-'+i); var cr=document.getElementById('ecr-'+i);
    if(dr) tD+=parseFloat(dr.value)||0;
    if(cr) tC+=parseFloat(cr.value)||0;
  }
  var ok = Math.abs(tD-tC)<0.01;
  var el = document.getElementById('entry-total');
  if(el) el.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;">'
    +'<span>مدين: <strong>'+fmt(tD)+'</strong> | دائن: <strong>'+fmt(tC)+'</strong></span>'
    +'<span style="color:'+(ok?'#059669':'#dc2626')+';font-weight:700;">'+(ok?'✅ متوازن':'⚠️ غير متوازن')+'</span></div>';
}

function saveEntry() {
  var lines = [];
  for(var i=0;i<window._entryLines;i++) {
    var sel=document.getElementById('ea-'+i);
    var dr=parseFloat(document.getElementById('edr-'+i)?document.getElementById('edr-'+i).value:0)||0;
    var cr=parseFloat(document.getElementById('ecr-'+i)?document.getElementById('ecr-'+i).value:0)||0;
    if(sel&&sel.value&&(dr>0||cr>0)) {
      var acc=DB.accounts.find(function(a){return a.c===sel.value;});
      lines.push({acc:sel.value,an:acc?acc.n:'',dr:dr,cr:cr});
    }
  }
  if(lines.length<2){alert('يجب إدخال سطرين على الأقل');return;}
  var tD=lines.reduce(function(s,l){return s+l.dr;},0);
  var tC=lines.reduce(function(s,l){return s+l.cr;},0);
  if(Math.abs(tD-tC)>0.01){alert('القيد غير متوازن!');return;}
  var id='J'+new Date().getFullYear()+'-'+(DB.entries.length+1).toString().padStart(3,'0');
  var desc=document.getElementById('e-desc').value;
  var date=document.getElementById('e-date').value;
  var ref=document.getElementById('e-ref').value||'REF';
  var proj=document.getElementById('e-proj').value;
  DB.entries.push({id:id,date:date,ref:ref,desc:desc||'قيد محاسبي',proj:proj,lines:lines,status:'posted'});
  save();closeModal();showPage('journal',null);
}

function viewEntry(id) {
  var e=DB.entries.find(function(x){return x.id===id;});if(!e)return;
  var tD=(e.lines||[]).reduce(function(s,l){return s+(l.dr||0);},0);
  var tC=(e.lines||[]).reduce(function(s,l){return s+(l.cr||0);},0);
  var ok=Math.abs(tD-tC)<0.01;
  var html='<div style="font-size:12px;margin-bottom:12px;">'
    +'<div><strong>رقم القيد:</strong> '+e.id+'</div>'
    +'<div><strong>التاريخ:</strong> '+e.date+'</div>'
    +'<div><strong>البيان:</strong> '+e.desc+'</div></div>'
    +'<table><thead><tr><th>الحساب</th><th>البيان</th><th>مدين</th><th>دائن</th></tr></thead><tbody>'
    +(e.lines||[]).map(function(l){return'<tr><td>'+l.acc+'</td><td>'+l.an+'</td><td style="color:#dc2626;">'+(l.dr>0?fmt(l.dr):'-')+'</td><td style="color:#059669;">'+(l.cr>0?fmt(l.cr):'-')+'</td></tr>';}).join('')
    +'</tbody><tfoot><tr style="background:#1e3a6e;color:white;"><td colspan="2" style="padding:8px;font-weight:900;">الإجمالي</td><td style="padding:8px;font-weight:800;">'+fmt(tD)+'</td><td style="padding:8px;font-weight:800;">'+fmt(tC)+'</td></tr></tfoot></table>'
    +'<div style="margin-top:10px;padding:10px;border-radius:8px;background:'+(ok?'#d1fae5':'#fee2e2')+';color:'+(ok?'#065f46':'#991b1b')+';font-weight:700;">'+(ok?'✅ القيد متوازن':'⚠️ غير متوازن')+'</div>';

    '<div style="background:#d1fae5;border-radius:8px;padding:10px;margin-bottom:12px;color:#065f46;font-size:12px;">الكمية الحالية: <strong>'+item.qty+'</strong></div>'
    +'<div class="form-group"><label>الكمية المضافة *</label><input type="number" id="stk-q" min="1"></div>'
    +'<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn" onclick="doStock('+i+',true)" style="flex:1;background:#059669;">✅ تأكيد</button><button class="btn" onclick="closeModal()" style="background:#637591;">إلغاء</button></div>'
  );
}
function outStockModal(i){
  var item=DB.inventory[i];
  openModal('📤 صرف — '+item.name,
    '<div style="background:#fee2e2;border-radius:8px;padding:10px;margin-bottom:12px;color:#991b1b;font-size:12px;">الكمية المتاحة: <strong>'+item.qty+'</strong></div>'
    +'<div class="form-group"><label>الكمية المصروفة *</label><input type="number" id="stk-q" min="1" max="'+item.qty+'"></div>'
    +'<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn" onclick="doStock('+i+',false)" style="flex:1;background:#dc2626;">✅ تأكيد</button><button class="btn" onclick="closeModal()" style="background:#637591;">إلغاء</button></div>'
  );
}
function doStock(i,add){
  var q=parseInt(document.getElementById('stk-q').value)||0;
  if(q<=0){alert('ادخل كمية صحيحة');return;}
  if(!add&&q>DB.inventory[i].qty){alert('الكمية أكبر من المتاح!');return;}
  DB.inventory[i].qty=add?DB.inventory[i].qty+q:DB.inventory[i].qty-q;
  save();closeModal();openSubPage('inventory');
}

function renderEmployeesPage(){
  var html='<h3 style="color:#1e3a6e;margin:0 0 12px;">👥 الموظفين</h3>'
    +'<button class="btn btn-sky" onclick="openAddEmpModal()" style="width:100%;margin-bottom:12px;">+ موظف جديد</button>';
  DB.employees.forEach(function(e,i){
    var r=calcTax(e.sal,e.allow);
    html+='<div class="card" style="margin-bottom:10px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">'
      +'<div><div style="font-weight:800;font-size:14px;">'+e.name+'</div><div style="font-size:11px;color:#637591;">'+e.pos+'</div></div>'
      +'<span class="badge badge-green">نشط</span></div>'
      +'<div class="grid2" style="gap:6px;font-size:12px;margin-bottom:8px;">'
      +'<div style="background:#f8fafc;border-radius:7px;padding:7px;"><div style="color:#637591;">الراتب</div><div style="font-weight:800;">'+fmt(e.sal)+'</div></div>'
      +'<div style="background:#d1fae5;border-radius:7px;padding:7px;"><div style="color:#637591;">الصافي</div><div style="font-weight:800;color:#059669;">'+fmt(r.net)+'</div></div></div>'
      +'<button class="btn" onclick="editSal('+i+')" style="width:100%;background:#29abe2;font-size:12px;">✏️ تعديل المرتب</button>'
      +'</div>';
  });
  return html;
}

function openAddEmpModal(){
  openModal('موظف جديد',
    '<div class="form-group"><label>كود الموظف *</label><input id="em-i" placeholder="E003"></div>'
    +'<div class="form-group"><label>الاسم الكامل *</label><input id="em-n"></div>'
    +'<div class="form-group"><label>المسمى الوظيفي</label><input id="em-p"></div>'
    +'<div class="form-group"><label>الراتب الأساسي</label><input type="number" id="em-s"></div>'
    +'<div class="form-group"><label>البدلات</label><input type="number" id="em-a" value="0"></div>'
    +'<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn" onclick="saveEmp()" style="flex:1;">✅ إضافة</button><button class="btn" onclick="closeModal()" style="background:#637591;">إلغاء</button></div>'
  );
}
function saveEmp(){
  var i=document.getElementById('em-i').value.trim();var n=document.getElementById('em-n').value.trim();
  if(!i||!n){alert('الكود والاسم مطلوبان');return;}
  DB.employees.push({id:i,name:n,pos:document.getElementById('em-p').value,sal:parseFloat(document.getElementById('em-s').value)||0,allow:parseFloat(document.getElementById('em-a').value)||0,status:'active'});
  save();closeModal();openSubPage('employees');
}

function renderSettingsPage(){
  return '<h3 style="color:#1e3a6e;margin:0 0 12px;">⚙️ الإعدادات</h3>'
    +'<div class="form-group"><label>اسم الجمعية</label><input id="set-n" value="'+DB.org.name+'"></div>'
    +'<button class="btn" onclick="saveSettings()" style="width:100%;margin-bottom:12px;">💾 حفظ</button>'
    +'<hr style="margin:12px 0;border:none;border-top:1px solid #e2eaf3;">'
    +'<button class="btn" onclick="exportDB()" style="width:100%;background:#29abe2;margin-bottom:8px;">📤 تصدير البيانات</button>'
    +'<button class="btn" onclick="importDB()" style="width:100%;background:#637591;">📥 استيراد البيانات</button>';
}
function saveSettings(){DB.org.name=document.getElementById('set-n').value;document.getElementById('org-name').textContent=DB.org.name;save();alert('✅ تم الحفظ');}
function exportDB(){var b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='athar-backup.json';a.click();}
function importDB(){var i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=function(ev){var f=ev.target.files[0];var r=new FileReader();r.onload=function(e){try{DB=JSON.parse(e.target.result);save();closeModal();showPage('dashboard',null);alert('✅ تم الاستيراد');}catch(err){alert('ملف غير صحيح');}};r.readAsText(f);};i.click();}

// ════ INIT ════════════════════════════════════
try { var s=localStorage.getItem('athar'); if(s) DB=JSON.parse(s); } catch(e){}
document.getElementById('org-name').textContent = DB.org.name;
renderDashboard();
</script>
</body>
</html>
