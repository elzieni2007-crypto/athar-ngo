  h+='<div class="sd" style="margin-bottom:8px;">✏️ تسويات يدوية (م. بنكية / حركات خاطئة)</div>';
  h+='<div style="background:white;border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid #e5e7eb;">';
  h+='<div id="manual-items">';
  if(manualItems.length){
    manualItems.forEach(function(mi,i){
      h+=buildManualItemRow(mi,i);
    });
  }
  h+='</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px;">';
  h+='<input id="mi-desc" placeholder="البيان (م. بنكية، مصروفات إدارية...)" style="padding:8px;border-radius:7px;border:1px solid #e5e7eb;font-family:Cairo,sans-serif;">';

  h+='<div style="display:flex;gap:4px;">';
  h+='<button onclick="addManualItem(1)" style="background:#059669;border:none;color:white;border-radius:7px;padding:8px 10px;cursor:pointer;font-size:12px;">+ إضافة</button>';
  h+='<button onclick="addManualItem(-1)" style="background:#dc2626;border:none;color:white;border-radius:7px;padding:8px 10px;cursor:pointer;font-size:12px;">− خصم</button>';

  // Save buttons
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';

    +'<div style="display:flex;align-items:center;gap:8px;">'
    +'<span style="font-weight:700;color:'+(mi.type>0?'#059669':'#dc2626')+';">'
    +(mi.type>0?'+':'-')+fmt(Math.abs(mi.amt))+'</span>'
    +'<button data-idx="'+idx+'" onclick="removeManualItem(this.dataset.idx)" '
    +'style="background:#fee2e2;border:none;border-radius:5px;padding:3px 7px;cursor:pointer;color:#dc2626;font-size:11px;">✕</button>'
    +'</div></div>';
}

function buildReconSummary(openBal,txns,prevPending,manualItems,bankBal){
  var bankInput=document.getElementById?document.getElementById('recon-bank-bal'):null;
  var stmtBal=bankInput?parseFloat(bankInput.value)||bankBal:bankBal||0;
  if(isNaN(stmtBal))stmtBal=bankBal||0;

  var clearedIds=[];
  if(document.querySelectorAll){
    document.querySelectorAll('[data-cid]').forEach(function(cb){
      if(cb.checked)clearedIds.push(cb.dataset.cid);
    });
  }

  var allTxns=(txns||[]).concat(prevPending||[]);
  var unclearedItems=[];
  allTxns.forEach(function(t){
    var cid=t.entryId+t.date;
    var cleared=clearedIds.indexOf(cid)>-1||clearedIds.indexOf('P_'+t.entryId)>-1;
    if(!cleared)unclearedItems.push(t);
  });

  var deposits=unclearedItems.filter(function(t){return (t.dr||0)>0;});
  var totalDeposits=deposits.reduce(function(s,t){return s+(t.dr||0);},0);
  var checks=unclearedItems.filter(function(t){return (t.cr||0)>0;});
  var totalChecks=checks.reduce(function(s,t){return s+(t.cr||0);},0);
  var manualAdj=(manualItems||[]).reduce(function(s,mi){return s+mi.type*mi.amt;},0);

  var monthDr=(txns||[]).reduce(function(s,t){return s+(t.dr||0);},0);
  var monthCr=(txns||[]).reduce(function(s,t){return s+(t.cr||0);},0);
  var bookBal=(openBal||0)+monthDr-monthCr;

  // المعادلة الصحيحة للتسوية البنكية:
  // الرصيد البنكي المعدّل = رصيد كشف الحساب + إيداعات لم تظهر − شيكات لم تُصرف ± تسويات يدوية
  // ثم يتم مقارنته بالرصيد الدفتري.
  var adjustedBank=stmtBal+totalDeposits-totalChecks+manualAdj;
  var diff=bookBal-adjustedBank;
  var balanced=Math.abs(diff)<0.01;

  var h='<div style="font-weight:800;color:var(--nd);margin-bottom:10px;font-size:13px;">📊 ملخص التسوية</div>';
  h+='<div style="display:flex;flex-direction:column;gap:8px;">';

  // ── الرصيد الدفتري ────────────────────────────────────────────
  h+='<div style="background:#f8f9fa;border-radius:8px;padding:10px;">';
  h+='<div style="font-weight:700;font-size:12px;margin-bottom:6px;color:var(--nd);">الرصيد الدفتري</div>';
  [{lbl:'رصيد أول الشهر',val:openBal||0,style:''},
   {lbl:'+ حركات مدينة',val:monthDr,style:'color:#059669'},
   {lbl:'− حركات دائنة',val:monthCr,style:'color:#dc2626'},
   {lbl:'الرصيد الدفتري',val:bookBal,style:'font-weight:900;border-top:1px solid #e5e7eb;padding-top:4px;margin-top:4px;'},
  ].forEach(function(row){
    h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;'+row.style+';">';
    h+='<span>'+row.lbl+'</span><span>'+fmt(row.val)+'</span></div>';
  });
  h+='</div>';

  // ── إيداعات لم تظهر (بالتفاصيل) ─────────────────────────────
  if(deposits.length){
    h+='<div style="background:#fff5f5;border-radius:8px;padding:10px;border:1px solid #fca5a5;">';
    h+='<div style="font-weight:700;font-size:12px;margin-bottom:6px;color:#dc2626;">− إيداعات لم تظهر في كشف الحساب</div>';
    deposits.forEach(function(t){
      h+='<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:#475569;">';
      h+='<span>'+t.date+' · '+t.desc+'</span><span style="color:#dc2626;">'+fmt(t.dr)+'</span></div>';
    });
    h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;padding-top:4px;margin-top:4px;border-top:1px solid #fca5a5;color:#dc2626;">';
    h+='<span>الإجمالي</span><span>'+fmt(totalDeposits)+'</span></div>';
    h+='</div>';
  }

  // ── شيكات لم تُصرف (بالتفاصيل) ──────────────────────────────
  if(checks.length){
    h+='<div style="background:#f0fdf4;border-radius:8px;padding:10px;border:1px solid #86efac;">';
    h+='<div style="font-weight:700;font-size:12px;margin-bottom:6px;color:#059669;">+ شيكات لم تُصرف من كشف الحساب</div>';
    checks.forEach(function(t){
      h+='<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:#475569;">';
      h+='<span>'+t.date+' · '+t.desc+'</span><span style="color:#059669;">'+fmt(t.cr)+'</span></div>';
    });
    h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;padding-top:4px;margin-top:4px;border-top:1px solid #86efac;color:#059669;">';
    h+='<span>الإجمالي</span><span>'+fmt(totalChecks)+'</span></div>';
    h+='</div>';
  }

  // ── تسويات يدوية ──────────────────────────────────────────────
  if((manualItems||[]).length){
    h+='<div style="background:#fffbeb;border-radius:8px;padding:10px;border:1px solid #fde68a;">';
    h+='<div style="font-weight:700;font-size:12px;margin-bottom:6px;color:#d97706;">± تسويات يدوية</div>';
    manualItems.forEach(function(mi){
      h+='<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;">';
      h+='<span>'+(mi.type>0?'+ ':' − ')+mi.desc+'</span>';
      h+='<span style="color:'+(mi.type>0?'#059669':'#dc2626')+';">'+fmt(mi.amt)+'</span></div>';
    });
    h+='</div>';
  }

  // ── الرصيد البنكي المعدّل ──────────────────────────────────
  h+='<div style="background:#f8f9fa;border-radius:8px;padding:10px;">';
  h+='<div style="font-weight:700;font-size:12px;margin-bottom:6px;color:var(--nd);">الرصيد البنكي المعدّل</div>';
  h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;">';
  h+='<span>رصيد كشف الحساب</span><span>'+fmt(stmtBal)+'</span></div>';
  if(totalDeposits>0){
    h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;color:#059669;">';
    h+='<span>+ إيداعات لم تظهر</span><span>'+fmt(totalDeposits)+'</span></div>';
  }
  if(totalChecks>0){
    h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;color:#dc2626;">';
    h+='<span>− شيكات لم تُصرف</span><span>'+fmt(totalChecks)+'</span></div>';
  }
  if(manualAdj!==0){
    h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;color:#d97706;">';
    h+='<span>± تسويات يدوية</span><span>'+fmt(manualAdj)+'</span></div>';
  }
  h+='<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:900;padding-top:4px;margin-top:4px;border-top:2px solid #e5e7eb;">';
  h+='<span>الرصيد البنكي المعدّل</span><span>'+fmt(adjustedBank)+'</span></div>';
  h+='</div>';

  // ── النتيجة: الرصيد البنكي المعدّل vs الرصيد الدفتري ───────────────────────────
  h+='<div style="background:'+(balanced?'#059669':'#dc2626')+';border-radius:10px;padding:12px;color:white;">';
  h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;opacity:.85;margin-bottom:3px;">';
  h+='<span>الرصيد البنكي المعدّل</span><span>'+fmt(adjustedBank)+'</span></div>';
  h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;opacity:.85;margin-bottom:6px;">';
  h+='<span>الرصيد الدفتري</span><span>'+fmt(bookBal)+'</span></div>';
  h+='<div style="font-weight:900;font-size:15px;text-align:center;border-top:1px solid rgba(255,255,255,.3);padding-top:8px;">';
  h+=(balanced?'✅ التسوية متطابقة':'⚠️ الفرق: '+fmt(Math.abs(diff))+' ج.م');
  h+='</div></div>';

  h+='</div>';
  return h;
}

function toggleCleared(cb){
  var cid=cb.dataset.cid;
  var row=document.getElementById('row-'+cid);
  if(row) row.style.background=cb.checked?'#f0fdf4':'white';
  updateReconCalc();
}

function toggleAllCleared(masterCb){
  document.querySelectorAll('#recon-txns input[type="checkbox"]').forEach(function(cb){
    cb.checked=masterCb.checked;
    var row=document.getElementById('row-'+cb.dataset.cid);
    if(row) row.style.background=masterCb.checked?'#f0fdf4':'white';
  });

}

function updateReconCalc(){
  if(!window._recon) return;
  var r=window._recon;
  var bankInput=document.getElementById('recon-bank-bal');
  var currentBankBal=bankInput?parseFloat(bankInput.value)||r.bankBal:r.bankBal;
  var summary=document.getElementById('recon-summary');
  if(summary) summary.innerHTML=buildReconSummary(r.openBal,r.txns,r.prevPending,r.manualItems,currentBankBal);
}

function addManualItem(type){
  var desc=(document.getElementById('mi-desc')||{}).value||'';
  var amt=parseFloat((document.getElementById('mi-amt')||{}).value)||0;
  if(!desc||!amt){toast('⚠️ أدخل البيان والمبلغ');return;}
  if(!window._recon) return;
  window._recon.manualItems.push({desc:desc,amt:Math.abs(amt),type:type});
  var container=document.getElementById('manual-items');
  if(container) container.innerHTML=window._recon.manualItems.map(buildManualItemRow).join('');
  if(document.getElementById('mi-desc')) document.getElementById('mi-desc').value='';
  if(document.getElementById('mi-amt')) document.getElementById('mi-amt').value='';
  updateReconCalc();
}

function removeManualItem(idx){
  if(!window._recon) return;
  window._recon.manualItems.splice(parseInt(idx),1);
  var container=document.getElementById('manual-items');
  if(container) container.innerHTML=window._recon.manualItems.map(buildManualItemRow).join('');
  updateReconCalc();
}

function getReconState(){
  if(!window._recon) return null;
  var r=window._recon;
  var clearedIds=[];
  document.querySelectorAll('[data-cid]').forEach(function(cb){
    if(cb.checked) clearedIds.push(cb.dataset.cid);
  });
  var bankBal=parseFloat((document.getElementById('recon-bank-bal')||{}).value)||r.bankBal;
  // Pending items = unchecked items from this month + prev pending
  var allTxns=r.txns.concat(r.prevPending);
  var pendingItems=allTxns.filter(function(t){
    var cid=t.entryId+t.date;
    return clearedIds.indexOf(cid)<0&&clearedIds.indexOf('P_'+t.entryId)<0;
  });
  return {
    accCode:r.accCode,month:r.month,bankBal:bankBal,
    clearedIds:clearedIds,manualItems:r.manualItems,
    pendingItems:pendingItems,
  };
}

function saveReconDraft(accCode,month){
  // Ensure _recon is set (sometimes lost after page interaction)
  if(!window._recon){
    toast('⚠️ البيانات غير محملة — أعد تحميل شهر التسوية');return;
  }
  var state=getReconState();
  if(!state){toast('⚠️ لا توجد بيانات');return;}
  initRecon();
  DB.bankRecons=DB.bankRecons.filter(function(r){
    return !(r.accCode===accCode&&r.month===month&&!r.closed);
  });
  var bankInput=document.getElementById('recon-bank-bal');
  var currentBankBal=bankInput?parseFloat(bankInput.value)||state.bankBal:state.bankBal;
  DB.bankRecons.push({
    id:'RC'+Date.now(),accCode:accCode,month:month,
    bankBal:currentBankBal,clearedIds:state.clearedIds,
    manualItems:state.manualItems,pendingItems:state.pendingItems,
    closed:false,createdAt:new Date().toISOString(),
  });
  save();
  toast('✅ تم حفظ المسودة — '+accCode+' / '+month);
}

function closeRecon(accCode,month){
  if(!window._recon){
    toast('⚠️ البيانات غير محملة — أعد تحميل شهر التسوية');return;
  }
  var state=getReconState();
  if(!state){toast('⚠️ لا توجد بيانات');return;}
  var r=window._recon;
  var bankBal=parseFloat((document.getElementById('recon-bank-bal')||{}).value)||0;
  var monthDr=r.txns.reduce(function(s,t){return s+t.dr;},0);
  var monthCr=r.txns.reduce(function(s,t){return s+t.cr;},0);
  var bookBal=r.openBal+monthDr-monthCr;
  // Quick balance check
  var uncleared=r.txns.concat(r.prevPending).filter(function(t){
    return state.clearedIds.indexOf(t.entryId+t.date)<0&&
           state.clearedIds.indexOf('P_'+t.entryId)<0;
  });
  var totalDeposits=uncleared.reduce(function(s,t){return s+(t.dr||0);},0);
  var totalChecks=uncleared.reduce(function(s,t){return s+(t.cr||0);},0);
  var manAdj=state.manualItems.reduce(function(s,mi){return s+mi.type*mi.amt;},0);
  var adjustedBank=bankBal+totalDeposits-totalChecks+manAdj;
  var diff=Math.abs(bookBal-adjustedBank);

  if(diff>0.01){
    if(!confirm('التسوية غير متطابقة — الفرق '+fmt(diff)+' ج.م\nالرصيد الدفتري: '+fmt(bookBal)+'\nالرصيد البنكي المعدّل: '+fmt(adjustedBank)+'\nهل تريد الإقفال على أي حال؟')) return;
  }
  initRecon();
  DB.bankRecons=DB.bankRecons.filter(function(r){
    return !(r.accCode===accCode&&r.month===month);
  });
  DB.bankRecons.push({
    id:'RC'+Date.now(),accCode:accCode,month:month,
    bankBal:bankBal,bookBal:bookBal,adjustedBank:adjustedBank,diff:bookBal-adjustedBank,
    clearedIds:state.clearedIds,manualItems:state.manualItems,
    pendingItems:state.pendingItems,
    closed:true,closedAt:new Date().toISOString(),
    closedBy:(getCurrentUser()||{}).name||'النظام',
  });
  save();
  toast('✅ تم إقفال تسوية '+month+(diff<0.01?' — متطابقة ✅':' — فرق '+fmt(diff)));
  sub('banks');
}


// اختبار داخلي سريع لمعادلة التسوية البنكية بدون التأثير على بيانات المستخدم
function testBankReconFormula(){
  // الرصيد الدفتري = 1,300، كشف البنك = 1,000، إيداع لم يظهر = 500، شيك لم يصرف = 200
  // الرصيد البنكي المعدل = 1,000 + 500 - 200 = 1,300 => الفرق صفر
  var bookBal=1300, stmtBal=1000, deposits=500, checks=200, manualAdj=0;
  var adjustedBank=stmtBal+deposits-checks+manualAdj;
  var diff=Math.abs(bookBal-adjustedBank);
  return diff<0.01;
}

function refreshAccLedger(accCode,accName){
  var from=sv('al-from')||'';var to=sv('al-to')||'';
  var el2=document.getElementById('al-body');
  if(el2)el2.innerHTML=buildAccLedgerTable(accCode,from,to);
}
function buildAccLedgerTable(accCode,fromD,toD){
  // Opening balance before fromD
  var opening=fromD?getAccBalAtDate(accCode, getPrevDay(fromD)).net:0;
  var rows=getAccMovements(accCode,fromD,toD);
  if(!rows.length&&!opening)
    return '<div style="text-align:center;color:var(--g4);padding:20px;">لا توجد حركات</div>';

  var h='<div style="overflow-x:auto;"><table><thead><tr>';
  h+='<th>التاريخ</th><th>المرجع</th><th>البيان</th><th>مدين ↑</th><th>دائن ↓</th><th>الرصيد</th>';
  h+='</tr></thead><tbody>';

  var run=opening;
  if(fromD&&opening!==0){
    h+='<tr style="background:var(--g1);">';
    h+='<td colspan="3" style="font-weight:700;font-size:11px;">رصيد أول المدة</td>';
    h+='<td class="tn"></td><td class="tn"></td>';
    h+='<td class="tn" style="font-weight:800;">'+fmt(Math.abs(opening))+(opening>=0?' م':' د')+'</td></tr>';
  }

  var tDr=0,tCr=0;
  rows.forEach(function(r){
    run+=r.dr-r.cr;tDr+=r.dr;tCr+=r.cr;
    var balAbs=Math.abs(run);var balDir=run>=0?'م':'د';
    h+='<tr>';
    h+='<td style="font-size:11px;white-space:nowrap;">'+r.date+'</td>';
    h+='<td style="font-size:11px;color:var(--sk);">'+r.ref+'</td>';
    h+='<td style="font-size:11px;">'+r.desc+(r.tpName?'<br><span style="font-size:10px;color:var(--g4);">'+r.tpName+'</span>':'')+'</td>';
    h+='<td class="tn" style="color:var(--n);font-weight:700;">'+(r.dr>0?fmt(r.dr):'-')+'</td>';
    h+='<td class="tn" style="color:var(--gr);font-weight:700;">'+(r.cr>0?fmt(r.cr):'-')+'</td>';
    h+='<td class="tn" style="font-weight:800;">'+fmt(balAbs)+' '+balDir+'</td>';
    h+='</tr>';
  });

  var finalBal=opening+tDr-tCr;
  h+='</tbody><tfoot>';

  h+='</div>';

  var last30=new Date(dateVal);last30.setDate(last30.getDate()-30);

  var recentMvs=mvs.filter(function(r){return r.date>=last30str;});
  if(recentMvs.length&&!ok){
    h+='<div style="margin-top:10px;">';
    h+='<div style="font-size:11.5px;font-weight:800;margin-bottom:6px;color:var(--n);">📋 آخر 30 يوم (قد تكون غير مُصرفة)</div>';

      h+='<span style="font-weight:700;color:'+(r.dr>0?'var(--n)':'var(--gr)')+';">'+(r.dr>0?'+'+fmt(r.dr):'-'+fmt(r.cr))+'</span>';

  el2.innerHTML=h;
}

// ── Calculate depreciation for one asset ────────────────────────
function calcAssetDepr(asset){
  // القسط الثابت: (التكلفة - القيمة المتبقية) / العمر الإنتاجي بالأشهر
  var cost   = asset.cost || 0;
  var resVal = asset.residualValue || 0;
  var lifeM  = (asset.lifeYears || 1) * 12;
  var monthly = Math.round((cost - resVal) / lifeM * 100) / 100;

  // حساب المدة المنقضية
  var start  = new Date(asset.startDate || asset.purchaseDate);
  var today  = new Date();
  var elapsed= (today.getFullYear()-start.getFullYear())*12 + (today.getMonth()-start.getMonth());
  var accDepr= Math.min(monthly * elapsed, cost - resVal);
  var bookVal= Math.max(cost - accDepr, resVal);
  var remainM= Math.max(0, lifeM - elapsed);

  return {monthly:monthly, accumulated:Math.round(accDepr), bookValue:Math.round(bookVal), elapsedMonths:elapsed, remainingMonths:remainM, fullyDepreciated:remainM===0};
}

function previewAssetCalc(){
  var cost=parseFloat((document.getElementById('ast-cost')||{}).value)||0;
  var resid=parseFloat((document.getElementById('ast-resid')||{}).value)||0;
  var life=parseInt((document.getElementById('ast-life')||{}).value)||5;

  h+='<button class="btn btn-gy" onclick="cm()">إلغاء</button>';
  h+='</div>';
  om('📋 قيد الإهلاك الشهري — '+mName, h);

function postDeprEntry(byCategory){
  var today=new Date().toISOString().split('T')[0];
  var id='J'+new Date().getFullYear()+'-DEP-'+String(Date.now()).slice(-5);
  var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var d=new Date();
  var mName=MONTHS[d.getMonth()]+' '+d.getFullYear();
  var lines=[];

  Object.values(byCategory).forEach(function(g){
    if(g.total<=0)return;
    lines.push({acc:g.cat.expAcc, an:'إهلاك '+g.cat.name, dr:Math.round(g.total), cr:0});
    lines.push({acc:g.cat.deprAcc, an:'مجمع إهلاك '+g.cat.name, dr:0, cr:Math.round(g.total)});
  });

  if(!lines.length){toast('لا توجد مبالغ إهلاك');return;}

  var entry={
    id:id, date:today, desc:'قيد إهلاك شهر '+mName+' — تلقائي',
    ref:'DEP-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),
    lines:lines, status:'posted', autoDepr:true
  };
  if(!DB.entries) DB.entries=[];
  DB.entries.push(entry);
  save();
  cm();
  sub('assets');
  toast('✅ تم ترحيل قيد الإهلاك — '+mName);
}

  {code:'annual',  name:'إجازة سنوية',     color:'#1d4ed8', bg:'#dbeafe'},
  {code:'sick',    name:'إجازة مرضية',     color:'#dc2626', bg:'#fee2e2'},

function getLeaveDatesForTs(empId, year, month){
  initLeaves();
  return DB.leaveRequests.filter(function(r){
    return r.empId===empId && r.status==='approved';
  }).reduce(function(dates,req){
    // expand date range
    var d=new Date(req.fromDate);
    var end=new Date(req.toDate);
    while(d<=end){
      var ds=d.toISOString().split('T')[0];
      var dy=parseInt(ds.split('-')[0]);
      var dm=parseInt(ds.split('-')[1]);
      if(dy===year&&dm===month&&dates.indexOf(ds)<0) dates.push(ds);
      d.setDate(d.getDate()+1);
    }
    return dates;
  },[]);
}

function calcLeaveDays(){
  var from=(document.getElementById('lv-from')||{}).value;
  var to=(document.getElementById('lv-to')||{}).value;
  if(!from||!to)return;
  var days=Math.round((new Date(to)-new Date(from))/86400000)+1;

  initLeaves();
  var cu=getCurrentUser();
  var emp=DB.employees.find(function(e){return e.userId===cu.id||e.username===cu.username||e.id===cu.empId;});
  var empId=emp?emp.id:(document.getElementById('lv-emp')||{}).value||cu.id;

  var from=(document.getElementById('lv-from')||{}).value;

  var reason=(document.getElementById('lv-reason')||{}).value||'';

  if(new Date(to)<new Date(from)){toast('⚠️ تاريخ الانتهاء قبل تاريخ البداية');return;}

  var req={
    id:'LV-'+Date.now(),
    empId:empId,
    requestedBy:cu.id,

    fromDate:from,
    toDate:to,
    reason:reason,

    approvedBy:autoApprove?cu.name:null,
    createdAt:new Date().toISOString()
  };
  DB.leaveRequests.push(req);

function getTsSettings(){ initTimesheet(); return DB.tsSettings; }

function getWorkDaysInMonth(year, month){ // month 1-based
  var cfg=getTsSettings();
  var days=[], d=new Date(year,month-1,1);
  while(d.getMonth()===month-1){
    if(cfg.workDays.indexOf(d.getDay())>-1){
      var ds=d.toISOString().split('T')[0];
      var isHol=cfg.holidays.some(function(h){return h.date===ds;});
      if(!isHol) days.push(ds);
    }
    d.setDate(d.getDate()+1);
  }
  return days;
}

  // Returns approved leave dates from leaveRequests

}

function roundHours(h, rounding){
  if(rounding==='whole')  return Math.round(h);
  if(rounding==='half')   return Math.round(h*2)/2;
  return Math.round(h*100)/100;
}

// ── Smart daily distribution ─────────────────────────────────────
// Distributes monthly hours across days in a natural, audit-friendly way
function distributeHoursSmartly(workDates, leaveDates, allocs, totalDailyHours, rounding){
  var activeDates=workDates.filter(function(d){return leaveDates.indexOf(d)<0;});
  var n=activeDates.length;
  if(!n) return [];

  // ── Step 1: Calculate exact total hours per project ──────────
  // Use floor to avoid over-allocation, then distribute remainder
  var projTotals=allocs.map(function(a){
    return {
      proj:a.proj, projName:a.projName, pct:a.pct,
      total: Math.floor(n * totalDailyHours * a.pct / 100),
      remaining: 0
    };
  });

  // Distribute any lost hours from rounding to projects in order
  var allocSum=projTotals.reduce(function(s,p){return s+p.total;},0);
  var totalExpected=n*totalDailyHours;
  var lost=totalExpected-allocSum;
  for(var pi=0;pi<projTotals.length&&lost>0;pi++){
    projTotals[pi].total+=1; lost--;
  }
  projTotals.forEach(function(p){p.remaining=p.total;});

  // ── Step 2: Day-by-day distribution ─────────────────────────
  var rows=[];
  activeDates.forEach(function(date,di){
    var daysLeft=n-di;
    var dayAllocs=[];
    var daySum=0;

    projTotals.forEach(function(p,pi){
      if(p.remaining<=0) return;
      var isLastProj=(pi===projTotals.length-1);

      var h;
      if(isLastProj){
        // Last project fills remainder of the day exactly
        h=totalDailyHours-daySum;
        h=Math.max(0,Math.min(h,p.remaining));
      } else {
        // Spread remaining hours evenly across remaining days
        var raw=p.remaining/daysLeft;
        h=roundHours(raw,rounding);
        // Never exceed remaining budget OR leave no room for day total
        h=Math.max(0,Math.min(h,p.remaining));
        // Don't let partial projects overflow the day
        h=Math.min(h,totalDailyHours-daySum);
      }

      if(h>0){
        dayAllocs.push({proj:p.proj,projName:p.projName,hours:h});
        p.remaining-=h;
        daySum+=h;
      }
    });

    // Safety: if daySum != totalDailyHours (due to rounding), adjust last alloc
    var diff=totalDailyHours-daySum;
    if(Math.abs(diff)>=0.5 && dayAllocs.length>0){
      // Find last project with remaining budget
      for(var k=dayAllocs.length-1;k>=0;k--){
        var adj=dayAllocs[k].hours+diff;
        if(adj>0 && adj<=totalDailyHours){
          // Undo previous remaining deduction and redo with correction
          var pObj=projTotals.find(function(p){return p.proj===dayAllocs[k].proj;});
          if(pObj) pObj.remaining-=diff;
          dayAllocs[k].hours=adj;
          daySum=totalDailyHours;
          break;
        }
      }
    }

    var d=new Date(date);
    var dayNames=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    rows.push({
      date:date, dayName:dayNames[d.getDay()],
      type:'work', allocs:dayAllocs, totalHours:totalDailyHours
    });
  });

  // ── Step 3: Add non-work days ────────────────────────────────
  var cfg=getTsSettings();
  var firstDate=new Date(workDates[0]);
  var yr=firstDate.getFullYear(), mo=firstDate.getMonth();
  var dd=new Date(yr,mo,1);
  var dayNames2=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  while(dd.getMonth()===mo){
    var ds=dd.toISOString().split('T')[0];
    if(workDates.indexOf(ds)<0){
      var isHol=cfg.holidays.some(function(h){return h.date===ds;});
      var isLeave=leaveDates.indexOf(ds)>-1;
      rows.push({
        date:ds, dayName:dayNames2[dd.getDay()],
        type:isLeave?'leave':isHol?'holiday':'weekend',
        allocs:[], totalHours:0
      });
    }
    dd.setDate(dd.getDate()+1);
  }

  rows.sort(function(a,b){return a.date<b.date?-1:1;});
  return rows;
}

function calcPctTotal(){

  document.querySelectorAll('.pr-pct').forEach(function(inp){total+=parseFloat(inp.value)||0;});
  var el=document.getElementById('al-pct-total');
  var box=document.getElementById('al-pct-check');
  if(el) el.textContent=total;
  if(box){
    box.style.background=Math.abs(total-100)<0.01?'#d1fae5':'#fee2e2';
    box.style.color=Math.abs(total-100)<0.01?'#065f46':'#c0392b';
  }
}

function updateAllocSalary(){
  var empId=(document.getElementById('al-emp')||{}).value;
  if(!empId)return;
  var emp=DB.employees.find(function(e){return e.id===empId;});
  if(!emp)return;
  var r=calcFull(emp,{});
  var salEl=document.getElementById('al-sal');
  if(salEl) salEl.value=r.gross||emp.sal||0;
}

function saveAllocation(){
  initTimesheet();
  var empId=(document.getElementById('al-emp')||{}).value;
  var month=parseInt((document.getElementById('al-month')||{}).value);
  var year=parseInt((document.getElementById('al-year')||{}).value);
  var sal=parseFloat((document.getElementById('al-sal')||{}).value)||0;
  if(!empId||!month||!year){toast('⚠️ بيانات غير مكتملة');return;}

  // Collect projects
  var projs=[];
  document.querySelectorAll('.pr-proj').forEach(function(sel,i){
    var code=sel.value;
    if(!code)return;
    var pct=parseFloat(document.querySelectorAll('.pr-pct')[i].value)||0;
    var proj=DB.projects.find(function(p){return p.code===code;});
    if(proj) projs.push({projCode:code,proj:code,projName:proj.name,pct:pct});
  });

  var total=projs.reduce(function(s,p){return s+p.pct;},0);
  if(Math.abs(total-100)>0.01){toast('⚠️ إجمالي النسب يجب أن يساوي 100% — الحالي: '+total+'%');return;}

  var alloc={
    id:'AL-'+Date.now(),empId:empId,month:month,year:year,salary:sal,
    projects:projs,status:'saved',tsGenerated:false,
    createdAt:new Date().toISOString()
  };
  DB.allocations.push(alloc);
  save();cm();
  sub('timesheet');
  toast('✅ تم حفظ التوزيع');
}

function deleteAllocation(id){
  if(!confirm('حذف هذا التوزيع؟'))return;
  DB.allocations=DB.allocations.filter(function(a){return a.id!==id;});
  save();sub('timesheet');
}

function editAllocation(id){
  var a=DB.allocations.find(function(x){return x.id===id;});
  if(!a)return;
  newAllocationModal(null);
  setTimeout(function(){
    var empEl=document.getElementById('al-emp');
    var monEl=document.getElementById('al-month');
    var yrEl=document.getElementById('al-year');
    var salEl=document.getElementById('al-sal');
    if(empEl)empEl.value=a.empId;
    if(monEl)monEl.value=a.month;
    if(yrEl)yrEl.value=a.year;
    if(salEl)salEl.value=a.salary;
  },100);
}

function doGenerateTimesheet(allocId){
  initTimesheet();
  var a=DB.allocations.find(function(x){return x.id===allocId;});
  if(!a)return;
  var cfg=getTsSettings();

  // Get leaves from input
  var leavesInput=(document.getElementById('ts-leaves')||{}).value||'';
  var leaveDates=leavesInput?leavesInput.split(',').map(function(s){return s.trim();}).filter(Boolean):[];

  var workDates=getWorkDaysInMonth(a.year,a.month);
  var rows=distributeHoursSmartly(workDates,leaveDates,a.projects,cfg.dailyHours,cfg.rounding);

  a.tsRows=rows;
  a.tsGenerated=true;
  a.tsGeneratedAt=new Date().toISOString();
  a.leaveDates=leaveDates;
  save();cm();
  // Show preview immediately
  previewTimesheetModal(allocId);
  toast('✅ تم توليد الـ Timesheet');
}

  var container=document.getElementById('ts-hols');

function generateForm41(){
  var q=parseInt((document.getElementById('f41-q')||{}).value)||1;
  var y=parseInt((document.getElementById('f41-y')||{}).value)||new Date().getFullYear();
  var doc=(document.getElementById('f41-doc')||{}).value||'';

  // Date range for quarter
  var qStart=[[1,1],[4,1],[7,1],[10,1]][q-1];
  var qEnd=  [[3,31],[6,30],[9,30],[12,31]][q-1];
  var fromDate=y+'-'+String(qStart[0]).padStart(2,'0')+'-'+String(qStart[1]).padStart(2,'0');
  var toDate  =y+'-'+String(qEnd[0]).padStart(2,'0')  +'-'+String(qEnd[1]).padStart(2,'0');

  // Find all posted entries in this quarter with third party + withholding
  var rows=[];
  var serial=1;
  (DB.entries||[]).filter(function(e){
    return e.status==='posted' && e.date>=fromDate && e.date<=toDate;
  }).forEach(function(entry){
    entry.lines.forEach(function(ln){
      if(!ln.tpId) return;
      var tp=DB.thirdParties.find(function(t){return t.id===ln.tpId;});
      if(!tp||!tp.taxId) return;
      var grossAmt=ln.dr||ln.cr||0;
      if(!grossAmt) return;
      var whtRate=(tp.whtRate||0)/100;
      if(!whtRate) return;
      var netAmt=Math.round(grossAmt/(1+whtRate)*100)/100;
      var whtAmt=Math.round(grossAmt*whtRate/(1+whtRate)*100)/100;

      rows.push({
        serial:serial++,
        taxId:tp.taxId||'',
        fileId:tp.fileId||'-',
        name:tp.name||'',
        address:tp.address||'',
        date:entry.date,
        txType:tp.whtType||'خدمات',
        txTypeCode:'ا.ت',
        grossAmt:grossAmt,
        deductType:tp.whtType||'',
        deductCode:'-',
        netAmt:netAmt,
        whtRate:tp.whtRate||0,
        whtAmt:whtAmt,
        entryId:entry.id,
        desc:entry.desc
      });
    });
  });

  // ── GL balance for verification ──────────────────────────────
  var B=bals();
  var b2114=B['2114']||{cr:0,dr:0};
  var glTotal=Math.round((b2114.cr-b2114.dr)*100)/100;
  var glWHT={'2114':glTotal};

  if(!rows.length && glTotal<=0){
    toast('⚠️ لا توجد معاملات بخصم ضريبي في هذه الفترة\nتأكد من:\n• إضافة الرقم الضريبي للطرف الثالث\n• تحديد نسبة الخصم في بيانات الطرف');
    return;
  }

  var totalWHT=rows.reduce(function(s,r){return s+r.whtAmt;},0);
  var prev=((DB.form41||[]).filter(function(f){
    return (f.quarter<q&&f.year===y)||(f.year<y);
  }).sort(function(a,b){return b.createdAt>a.createdAt?1:-1;})[0]||{}).totalWHT||0;

  if(!DB.form41) DB.form41=[];
  var form={
    id:'F41-'+Date.now(),
    quarter:q, year:y, docNum:doc,
    rows:rows,
    glWHT:glWHT,
    glTotal:Math.round(glTotal*100)/100,
    totalWHT:Math.round(totalWHT*100)/100,
    prevTotal:Math.round(prev*100)/100,
    grandTotal:Math.round((totalWHT+prev)*100)/100,
    createdAt:new Date().toISOString()
  };
  DB.form41.push(form);
  save();
  sub('form41');
  toast('✅ تم توليد النموذج 41 — '+rows.length+' معاملة');
  setTimeout(function(){printForm41(form.id);},300);
}

function deleteForm41(id){
  if(!confirm('حذف هذا النموذج؟'))return;
  DB.form41=(DB.form41||[]).filter(function(f){return f.id!==id;});
  save();sub('form41');
}

// ── SheetJS loader (CDN) ─────────────────────────────────────────
function loadSheetJS(callback){
  if(window.XLSX){ callback(); return; }
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=function(){ callback(); };
  s.onerror=function(){ toast('❌ تعذر تحميل مكتبة Excel'); };
  document.head.appendChild(s);
}

// ── Helper: download workbook ─────────────────────────────────────
function downloadXLSX(wb, filename){
  var wbout=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  var blob=new Blob([wbout],{type:'application/octet-stream'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Helper: style sheet header row ───────────────────────────────
function xlsxHeader(ws, headers, row){
  // headers = array of column titles
  // SheetJS doesn't support rich styles in free version
  // We use column widths instead
  var wscols=headers.map(function(h){return {wch:Math.max(h.length+4,14)};});
  ws['!cols']=wscols;
}

    +'</tr></tfoot></table>';
  // Signatures + QR
  h+='<div style="background:#f0f9ff;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:11px;color:#0D3B6E;font-weight:700;">التفقيط: '+tafqeet(tD)+'</div>';

    +'margin-top:24px;gap:12px;">';
  h+='<div style="flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">';
  ['أعده المحاسب','راجعه','اعتمده'].forEach(function(sig){
    h+='<div style="border-top:1px solid #374151;padding-top:6px;text-align:center;'
      +'font-size:10px;color:#6b7280;">'+sig+'</div>';
  });

  h+='<div style="font-size:8.5px;color:#9ca3af;margin-top:3px;">امسح للأرشفة</div>';
  h+='</div></div>';

  // ── QR: draw directly on canvas in current page, convert to dataURL ──
  var qrCanvas=document.createElement('canvas');
  qrCanvas.width=120; qrCanvas.height=120;
  var qrCtx=qrCanvas.getContext('2d');
  qrCtx.fillStyle='#ffffff'; qrCtx.fillRect(0,0,120,120);
  qrCtx.fillStyle='#0D3B6E';
  // Draw simple grid encoding entry ID
  var qrText=e.id;
  var cellCount=21; var cellPx=Math.floor(120/cellCount);
  // Finder patterns (3 corners)
  [[0,0],[0,cellCount-7],[cellCount-7,0]].forEach(function(p){
    qrCtx.fillStyle='#0D3B6E';
    qrCtx.fillRect(p[1]*cellPx,p[0]*cellPx,7*cellPx,7*cellPx);
    qrCtx.fillStyle='#ffffff';
    qrCtx.fillRect((p[1]+1)*cellPx,(p[0]+1)*cellPx,5*cellPx,5*cellPx);
    qrCtx.fillStyle='#0D3B6E';
    qrCtx.fillRect((p[1]+2)*cellPx,(p[0]+2)*cellPx,3*cellPx,3*cellPx);
  });
  // Data pattern from text
  qrCtx.fillStyle='#0D3B6E';
  for(var qi=0;qi<qrText.length;qi++){
    var code=qrText.charCodeAt(qi);
    for(var bit=0;bit<8;bit++){
      if((code>>bit)&1){
        var qr=qi*8+bit;
        var qrow=8+Math.floor(qr/cellCount);
        var qcol=Math.floor(qr%cellCount);
        if(qrow<cellCount-7) qrCtx.fillRect(qcol*cellPx,qrow*cellPx,cellPx,cellPx);
      }
    }
  }
  // Convert to data URL and embed in HTML
  var qrDataUrl=qrCanvas.toDataURL('image/png');
  var qrImgTag='<img src="'+qrDataUrl+'" width="120" height="120" style="display:block;border:1px solid #e5e7eb;border-radius:4px;">';
  h=h.replace('<div id="__QR__" style="width:120px;height:120px;"></div>', qrImgTag);
  printContent('سند قيد يومية — '+e.id, h);
}

// ── Global Search Engine ──────────────────────────────────────────
function globalSearch(query){
  if(!query||query.trim().length<2) return [];
  var q=query.trim().toLowerCase();
  var results=[];

  // 1. Entries
  (DB.entries||[]).filter(function(e){return e.status==='posted';}).forEach(function(e){
    var score=0; var matches=[];
    if(e.id.toLowerCase().includes(q)){score+=10;matches.push('رقم القيد: '+e.id);}
    if(e.desc&&e.desc.toLowerCase().includes(q)){score+=8;matches.push('البيان: '+e.desc);}
    if(e.date&&e.date.includes(q)){score+=6;matches.push('التاريخ: '+e.date);}
    if(e.ref&&e.ref.toLowerCase().includes(q)){score+=7;matches.push('المرجع: '+e.ref);}
    if(e.proj&&e.proj.toLowerCase().includes(q)){score+=5;matches.push('المشروع: '+e.proj);}
    if(e.contractId&&e.contractId.toLowerCase().includes(q)){score+=6;matches.push('العقد: '+e.contractId);}
    // Search in lines
    (e.lines||[]).forEach(function(l){
      if(l.tpName&&l.tpName.toLowerCase().includes(q)){score+=8;matches.push('الطرف الثالث: '+l.tpName);}
      var acc=DB.accounts.find(function(a){return a.c===l.acc;});
      if(acc&&acc.n.toLowerCase().includes(q)){score+=4;matches.push('الحساب: '+acc.n);}
    });
    if(score>0){
      var totalDr=(e.lines||[]).reduce(function(s,l){return s+(l.dr||0);},0);
      results.push({type:'entry',score:score,matches:matches,
        id:e.id,date:e.date,desc:e.desc,ref:e.ref||'',
        proj:e.proj||'',amount:totalDr,
        docCount:(DB.entryDocs&&DB.entryDocs[e.id])?DB.entryDocs[e.id].length:0,
        status:(DB.archiveLog[e.id]||{}).status||'pending'});
    }
  });

  // 2. Contracts
  (DB.contracts||[]).forEach(function(ct,i){
    var score=0; var matches=[];
    if(ct.name&&ct.name.toLowerCase().includes(q)){score+=10;matches.push('اسم العقد: '+ct.name);}
    if(ct.project&&ct.project.toLowerCase().includes(q)){score+=6;matches.push('المشروع: '+ct.project);}
    var tp=(DB.thirdParties||[]).find(function(t){return t.id===ct.party;});
    if(tp&&tp.name.toLowerCase().includes(q)){score+=8;matches.push('المورد: '+tp.name);}
    if(ct.desc&&ct.desc.toLowerCase().includes(q)){score+=5;matches.push('الوصف: '+ct.desc);}
    if(score>0)results.push({type:'contract',score:score,matches:matches,
      id:'CT-'+i,name:ct.name,party:tp?tp.name:'',
      value:ct.value,project:ct.project||''});
  });

  // 3. Suppliers
  (DB.thirdParties||[]).forEach(function(tp){
    var score=0; var matches=[];
    if(tp.name&&tp.name.toLowerCase().includes(q)){score+=10;matches.push('الاسم: '+tp.name);}
    if(tp.taxId&&tp.taxId.includes(q)){score+=8;matches.push('الرقم الضريبي: '+tp.taxId);}
    if(tp.phone&&tp.phone.includes(q)){score+=6;matches.push('الهاتف: '+tp.phone);}
    if(score>0){
      var tpEntries=(DB.entries||[]).filter(function(e){
        return e.status==='posted'&&(e.lines||[]).some(function(l){return l.tpId===tp.id;});
      });
      results.push({type:'supplier',score:score,matches:matches,
        id:tp.id,name:tp.name,type2:tp.type||'',
        entryCount:tpEntries.length});
    }
  });

  // 4. Projects
  (DB.projects||[]).forEach(function(pr){
    var score=0; var matches=[];
    if(pr.name&&pr.name.toLowerCase().includes(q)){score+=10;matches.push('اسم المشروع: '+pr.name);}
    if(pr.donor&&pr.donor.toLowerCase().includes(q)){score+=8;matches.push('المانح: '+pr.donor);}
    if(pr.code&&pr.code.toLowerCase().includes(q)){score+=7;matches.push('كود: '+pr.code);}
    if(score>0){
      var prEntries=(DB.entries||[]).filter(function(e){return e.status==='posted'&&e.proj===pr.name;});
      results.push({type:'project',score:score,matches:matches,
        id:pr.code||pr.name,name:pr.name,donor:pr.donor||'',
        entryCount:prEntries.length});
    }
  });


  // 5. Navigation / Screens
  var navItems=[
    {q:['قيد','قيود','يومية','ترحيل'],label:'📝 القيود اليومية',action:{type:'nav',pg:'jour'}},
    {q:['مرتب','مرتبات','رواتب','إعداد مرتب'],label:'💳 كشف الرواتب',action:{type:'pg',pg:'pay'}},
    {q:['مشروع','مشروعات','bva','موازنة'],label:'🎯 المشروعات',action:{type:'pg',pg:'proj'}},
    {q:['موظف','موظفين','hr','بشرية'],label:'🏢 الموظفين',action:{type:'sub',pg:'employees'}},
    {q:['مورد','موردين','مشتريات'],label:'🏭 الموردون',action:{type:'sub',pg:'suppliers'}},
    {q:['عقد','عقود'],label:'📋 سجل العقود',action:{type:'sub',pg:'contracts'}},
    {q:['بنك','بنوك','تسوية'],label:'🏦 البنوك والتسوية',action:{type:'sub',pg:'banks'}},
    {q:['ميزان','مراجعة','trial'],label:'⚖️ ميزان المراجعة',action:{type:'sub',pg:'trial'}},
    {q:['ميزانية','balance'],label:'📈 الميزانية العمومية',action:{type:'sub',pg:'balance'}},
    {q:['دخل','income','إيراد','إيرادات'],label:'💰 قائمة الدخل',action:{type:'sub',pg:'income'}},
    {q:['شيك','شيكات','طباعة شيك'],label:'🖊️ طباعة الشيكات',action:{type:'nav',pg:'checks'}},
    {q:['أصول','أصل','ثابتة'],label:'🏢 الأصول الثابتة',action:{type:'sub',pg:'assets'}},
    {q:['مخزن','مخازن','مخزون'],label:'📦 المخازن',action:{type:'sub',pg:'inventory'}},
    {q:['إجازة','إجازات','أجازة'],label:'🌴 الإجازات',action:{type:'sub',pg:'myleaves'}},
    {q:['timesheet','حضور','انصراف','ساعات'],label:'⏱️ Timesheet',action:{type:'sub',pg:'timesheet'}},
    {q:['أرشيف','مستندات','archive'],label:'🗂️ الأرشيف الإلكتروني',action:{type:'sub',pg:'archive'}},
    {q:['امتثال','compliance','مانحين'],label:'✅ الامتثال',action:{type:'sub',pg:'compliance'}},
    {q:['نموذج 41','form41','خصم مصدر'],label:'📋 نموذج 41',action:{type:'sub',pg:'form41'}},
    {q:['أستاذ','ledger','tpledger'],label:'📒 الأستاذ المساعد',action:{type:'sub',pg:'tpledger'}},
    {q:['ذكاء','ai','مساعد'],label:'🤖 المساعد الذكي',action:{type:'sub',pg:'ai'}},
    {q:['إعداد','إعدادات','settings'],label:'⚙️ الإعدادات',action:{type:'sub',pg:'settings'}},
    {q:['تدفق نقدي','cashflow','forecast'],label:'💵 التدفق النقدي',action:{type:'sub',pg:'cashforecast'}},
    {q:['مانح','مانحين','donorledger'],label:'🌍 دفتر المانحين',action:{type:'sub',pg:'donorledger'}},
    {q:['حزمة','مراجعة','audit'],label:'📦 حزمة المراجعة',action:{type:'sub',pg:'audit'}},
    {q:['بحث','search'],label:'🔍 البحث الشامل',action:{type:'sub',pg:'search'}},
  ];
  navItems.forEach(function(item){
    var matched=item.q.some(function(kw){return kw.includes(q)||q.includes(kw);});
    if(matched) results.unshift({type:'nav',score:15,matches:['شاشة: '+item.label],
      id:'nav-'+item.label,label:item.label,action:item.action,desc:'انتقل إلى الشاشة'});
  });

  // Sort by score
  results.sort(function(a,b){return b.score-a.score;});
  return results.slice(0,50);
}

    h+='</div></div>';
    // Right side
    h+='<div style="text-align:left;">';
    if(r.type==='nav'){
      h+='<div style="font-size:20px;">›</div>';
    } else if(r.type==='entry'){
      h+='<div style="font-weight:700;font-size:13px;">'+fmt(r.amount)+'</div>';
      h+='<div style="font-size:10px;background:'+(statusColors[r.status]||'#6b7280')+';color:white;border-radius:4px;padding:1px 6px;">'+
        (statusLabels[r.status]||r.status)+'</div>';
    } else if(r.type==='contract'){
      h+='<div style="font-weight:700;font-size:13px;">'+fmt(r.value)+'</div>';
    } else if(r.type==='supplier'){
      h+='<div style="font-size:11px;color:var(--g4);">'+r.entryCount+' قيد</div>';
    } else {
      h+='<div style="font-size:11px;color:var(--g4);">'+r.entryCount+' قيد</div>';
    }
    h+='</div></div>';
    // Matches
    h+='<div style="display:flex;flex-wrap:wrap;gap:4px;">';

      h+='<span style="background:#dbeafe;color:#1d4ed8;border-radius:4px;padding:2px 6px;font-size:10px;">'+match+'</span>';

function generateمراجعةPackage(){
  var fromDate=(document.getElementById('aud-from')||{}).value||'';
  var toDate=(document.getElementById('aud-to')||{}).value||'9999-12-31';
  var proj=(document.getElementById('aud-proj')||{}).value||'';
  var type=(document.getElementById('aud-type')||{}).value||'all';

  var entries=(DB.entries||[]).filter(function(e){
    if(e.status!=='posted') return false;
    if(fromDate&&e.date<fromDate) return false;
    if(toDate&&e.date>toDate) return false;
    if(proj&&proj!==''){
      var pr=( DB.projects||[]).find(function(p){return p.code===proj||p.name===proj;});
      var match=e.proj===proj||(pr&&(e.proj===pr.code||e.proj===pr.name));
      if(!match) return false;
    }
    var st=(DB.archiveLog[e.id]||{}).status||'pending';
    if(type==='archived'&&st!=='archived') return false;
    if(type==='missing'&&st!=='missing') return false;
    return true;
  }).sort(function(a,b){return a.date>b.date?1:-1;});

  var preview=document.getElementById('audit-preview');
  if(!preview) return;
  if(!entries.length){
    preview.innerHTML='<div style="text-align:center;padding:20px;color:var(--g4);">لا توجد قيود في النطاق المحدد</div>';
    return;
  }

  var totalDr=entries.reduce(function(s,e){return s+(e.lines||[]).reduce(function(ss,l){return ss+(l.dr||0);},0);},0);
  var withDocs=entries.filter(function(e){return (DB.entryDocs&&DB.entryDocs[e.id]||[]).length>0;}).length;
  var missing=entries.filter(function(e){return (DB.archiveLog[e.id]||{}).status==='missing';}).length;

var GRANT_DL_TYPES=[
  {key:'financial',  label:'تقرير مالي',     icon:'💰'},
  {key:'narrative',  label:'تقرير فني/سردي', icon:'📝'},
  {key:'audit',      label:'مراجعة حسابية',  icon:'🔍'},

  {key:'interim',    label:'تقرير مرحلي',    icon:'📊'},
  {key:'final',      label:'تقرير ختامي',    icon:'🏁'},
  {key:'other',      label:'موعد آخر',       icon:'📅'},
];

function gDlTypeInfo(key){
  return GRANT_DL_TYPES.find(function(t){return t.key===key;})||GRANT_DL_TYPES[GRANT_DL_TYPES.length-1];
}

function gDlStatus(dl){
  if(dl.submitted) return 'submitted';
  var todayMs=new Date().setHours(0,0,0,0);
  var dueMs=new Date(dl.dueDate).getTime();
  var diff=Math.round((dueMs-todayMs)/86400000);
  if(diff<0)  return 'overdue';
  if(diff<=14) return 'urgent';
  if(diff<=30) return 'warning';
  return 'upcoming';
}

function gDlDaysLabel(dl){
  if(dl.submitted) return '✅ تم التقديم';
  var todayMs=new Date().setHours(0,0,0,0);
  var diff=Math.round((new Date(dl.dueDate).getTime()-todayMs)/86400000);
  if(diff<0)  return 'متأخر '+Math.abs(diff)+' يوم';
  if(diff===0) return 'اليوم!';
  if(diff===1) return 'غداً!';
  return diff+' يوم';
}

function gDlBadgeStyle(dl){
  var s=gDlStatus(dl);
  if(s==='submitted') return 'background:#D1FAE5;color:#059669;';
  if(s==='overdue'||s==='urgent') return 'background:#FEE2E2;color:#DC2626;';
  if(s==='warning') return 'background:#FEF3C7;color:#92400E;';
  return 'background:#E0F2FE;color:#0369A1;';
}

// Get all deadlines across all grant files
function getAllGrantDeadlines(daysAhead){
  var grantFiles=DB.grantFiles||[];
  var todayMs=new Date().setHours(0,0,0,0);
  var cutoffMs=daysAhead?todayMs+daysAhead*86400000:null;
  var results=[];
  grantFiles.forEach(function(gf,gi){
    (gf.deadlines||[]).forEach(function(dl,di){
      if(!dl.dueDate) return;
      var dueMs=new Date(dl.dueDate).getTime();
      if(dl.submitted) return; // skip submitted
      // Include overdue always + upcoming within cutoff
      var isOverdue=dueMs<todayMs;
      var inWindow=cutoffMs?dueMs<=cutoffMs:true;
      if(isOverdue||inWindow){
        results.push({dl:dl,grantIdx:gi,dlIdx:di,grantName:gf.projName,donor:gf.donor||''});
      }
    });
  });
  results.sort(function(a,b){return new Date(a.dl.dueDate)-new Date(b.dl.dueDate);});
  return results;
}

// ── مراجعة Readiness ───────────────────────────────────────────────
function calcمراجعةReadiness(gf){
  if(!gf) return 0;
  var totalSlots=0,filled=0;
  GRANT_SECTIONS.forEach(function(sec){
    var docs=gf.sections[sec.key]||[];
    sec.docs.forEach(function(docName){
      totalSlots++;
      if(docs.some(function(d){return d.label===docName&&d.file;})) filled++;
    });
  });
  // Extra points for linked entries
  var proj=gf.projCode;
  var linkedEntries=(DB.entries||[]).filter(function(e){
    return e.status==='posted'&&(e.proj===proj);
  }).length;
  if(linkedEntries>0) filled=Math.min(filled+5,totalSlots);
  return Math.round(filled/totalSlots*100);
}

// ── Document Upload ───────────────────────────────────────────────
function getDocIcon(type){
  if(!type) return '📄';
  if(type.includes('pdf')) return '📕';
  if(type.includes('image')||type.includes('jpg')||type.includes('png')) return '🖼️';
  if(type.includes('excel')||type.includes('sheet')||type.includes('xlsx')) return '📊';
  if(type.includes('word')||type.includes('doc')) return '📝';
  return '📎';
}

function previewUploadFile(input){
  var preview=document.getElementById('ud-preview');
  if(!preview||!input.files.length) return;
  var file=input.files[0];
  var sizeMB=(file.size/1024/1024).toFixed(2);
  preview.innerHTML='<div style="background:#f0fdf4;border-radius:7px;padding:8px;font-size:11px;color:#059669;">'
    +'✅ '+file.name+' ('+sizeMB+' MB)</div>';
}

function saveGrantDoc(gfIdx,secKey){
  initGrantFiles();
  var gf=DB.grantFiles[gfIdx];
  if(!gf) return;
  var labelSel=document.getElementById('ud-label');
  var label=labelSel?labelSel.value:'';
  if(label==='__other'){
    label=(document.getElementById('ud-other-name')||{}).value||'مستند';
  }
  if(!label){toast('⚠️ اختر نوع المستند');return;}
  var fileInput=document.getElementById('ud-file');
  var date=(document.getElementById('ud-date')||{}).value||new Date().toISOString().split('T')[0];
  var amount=parseFloat((document.getElementById('ud-amount')||{}).value)||0;
  var entryId=(document.getElementById('ud-entry')||{}).value||'';

  if(fileInput&&fileInput.files.length){
    var file=fileInput.files[0];
    if(file.size>5*1024*1024){toast('⚠️ الملف أكبر من 5MB');return;}
    var reader=new FileReader();
    reader.onload=function(ev){
      if(!gf.sections[secKey]) gf.sections[secKey]=[];
      // Remove existing doc with same label
      gf.sections[secKey]=gf.sections[secKey].filter(function(d){return d.label!==label;});
      gf.sections[secKey].push({
        label:label,file:ev.target.result,
        fileName:file.name,type:file.type,
        date:date,amount:amount,entryId:entryId,
        uploadedAt:new Date().toISOString()
      });
      save(); cm();
      toast('✅ تم رفع المستند: '+label);
      renderGrantFilePage(gfIdx);
    };
    reader.readAsDataURL(file);
  } else {
    // Save without file (just metadata/link)
    if(!gf.sections[secKey]) gf.sections[secKey]=[];
    gf.sections[secKey]=gf.sections[secKey].filter(function(d){return d.label!==label;});
    gf.sections[secKey].push({
      label:label,file:null,
      date:date,amount:amount,entryId:entryId,
      note:'بدون ملف',
      uploadedAt:new Date().toISOString()
    });
    save(); cm();
    toast('✅ تم تسجيل المستند: '+label);
    renderGrantFilePage(gfIdx);
  }
}

function viewGrantDoc(gfIdx,secKey,docName){
  var gf=DB.grantFiles[gfIdx];
  if(!gf) return;
  var doc=(gf.sections[secKey]||[]).find(function(d){return d.label===docName;});
  if(!doc||!doc.file){toast('⚠️ لا يوجد ملف مرفق');return;}
  // Open in new overlay
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:#000;';
  overlay.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#0D3B6E;color:white;">'
    +'<button onclick="this.closest(\'div\').parentElement.remove()" style="background:rgba(255,255,255,.2);border:none;color:white;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:Cairo,sans-serif;">✕ إغلاق</button>'
    +'<span style="font-size:13px;font-weight:700;">'+doc.label+'</span>'

function buildالأرشيفList(entries, filter, search){
  var filtered=entries.filter(function(e){
    var st=(DB.archiveLog[e.id]||{}).status||'pending';
    if(filter!=='all'&&st!==filter) return false;
    if(search){
      var s=search.toLowerCase();
      return e.id.toLowerCase().includes(s)||
             (e.desc||'').toLowerCase().includes(s)||
             (e.date||'').includes(s)||
             (e.ref||'').toLowerCase().includes(s);
    }
    return true;
  });

  if(!filtered.length) return '<div style="text-align:center;padding:20px;color:var(--g4);">لا توجد نتائج</div>';

  var h='';
  filtered.forEach(function(entry){
    var arch=DB.archiveLog[entry.id]||{status:'pending'};
    var totalDr=entry.lines.reduce(function(s,l){return s+(l.dr||0);},0);
    var statusClr=arch.status==='archived'?'#1a7a4a':arch.status==='missing'?'#c0392b':'#d97706';
    var statusLbl=arch.status==='archived'?'✅ مؤرشف':arch.status==='missing'?'❌ ناقص':'⏳ قيد الأرشفة';
    var statusBg=arch.status==='archived'?'#d1fae5':arch.status==='missing'?'#fee2e2':'#fff9c4';

    h+='<div style="background:white;border-radius:11px;padding:11px;margin-bottom:7px;box-shadow:0 1px 5px rgba(0,0,0,.06);border:1px solid #eee;">';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">';
    h+='<div>';
    h+='<div style="display:flex;align-items:center;gap:6px;"><span style="font-weight:800;font-size:12px;color:var(--nd);">'+entry.id+'</span>'+getDocBadge(entry.id)+'</div>';
    h+='<div style="font-size:10.5px;color:var(--g4);">'+entry.date+' · '+entry.desc+'</div>';
    if(arch.boxRef) h+='<div style="font-size:10px;color:#2563eb;">📦 '+arch.boxRef+'</div>';
    h+='</div>';
    h+='<div style="text-align:left;">';
    h+='<div style="font-weight:800;font-size:13px;color:var(--nd);">'+fmt(totalDr)+' ج.م</div>';
    h+='<div style="background:'+statusBg+';color:'+statusClr+';font-size:10px;font-weight:700;border-radius:5px;padding:2px 8px;margin-top:3px;">'+statusLbl+'</div>';
    h+='</div></div>';

    h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;">';
    h+='<button data-eid="'+entry.id+'" onclick="printEntrySheet(this.dataset.eid)" style="background:var(--am);border:none;color:white;border-radius:7px;padding:5px;font-size:9.5px;cursor:pointer;font-family:Cairo,sans-serif;">🖨️ طباعة القيد</button>';
    h+='<button data-eid="'+entry.id+'" onclick="openDocsModal(this.dataset.eid)" style="background:#059669;border:none;color:white;border-radius:7px;padding:5px;font-size:9.5px;cursor:pointer;font-family:Cairo,sans-serif;">📎 '+(DB.entryDocs&&DB.entryDocs[entry.id]?DB.entryDocs[entry.id].length+' مستند':'رفع')+'</button>';
    h+='<button data-eid="'+entry.id+'" onclick="markالأرشيفd(this.dataset.eid)" style="background:#1a7a4a;border:none;color:white;border-radius:7px;padding:5px;font-size:9.5px;cursor:pointer;font-family:Cairo,sans-serif;">✅ مؤرشف</button>';
    h+='<button data-eid="'+entry.id+'" onclick="markMissing(this.dataset.eid)" style="background:#c0392b;border:none;color:white;border-radius:7px;padding:5px;font-size:9.5px;cursor:pointer;font-family:Cairo,sans-serif;">❌ ناقص</button>';
    h+='<button data-eid="'+entry.id+'" onclick="viewE(this.dataset.eid)" style="background:var(--sk);border:none;color:white;border-radius:7px;padding:5px;font-size:9.5px;cursor:pointer;font-family:Cairo,sans-serif;">👁️ القيد</button>';
    h+='</div></div>';
  });
  return h;
}

// ── الأرشيف Excel Report ──────────────────────────────────────────
function exportالأرشيفReport(){
  loadSheetJS(function(){
    initالأرشيف();
    var posted=(DB.entries||[]).filter(function(e){return e.status==='posted';})
      .sort(function(a,b){return b.date>a.date?1:-1;});

    var headers=['رقم القيد','التاريخ','البيان','المرجع','المبلغ (ج.م)','حالة الأرشفة','رقم الدرج/الملف','أُرشف بواسطة','تاريخ الأرشفة','ملاحظات'];
    var rows=posted.map(function(e){
      var arch=DB.archiveLog[e.id]||{};
      var amt=e.lines.reduce(function(s,l){return s+(l.dr||0);},0);
      var stMap={reviewed:'✅ مكتملة',incomplete:'⚠️ مستندات ناقصة',archived:'📦 مؤرشف',pending:'🔵 قيد المراجعة'};
      var st=stMap[arch.status]||'🔵 قيد المراجعة';
      var docCount=(DB.entryDocs&&DB.entryDocs[e.id])?DB.entryDocs[e.id].length:0;
      return [e.id,e.date,e.desc,e.ref||'',amt,st,docCount+' مستند',arch.reviewedBy||arch.archivedBy||'',arch.reviewedAt?arch.reviewedAt.slice(0,10):'',arch.notes||''];
    });

    // Summary
    var archived=rows.filter(function(r){return r[5].includes('✅');}).length;
    var missing=rows.filter(function(r){return r[5].includes('❌');}).length;
    var pending=rows.length-archived-missing;

    rows.push([]);
    rows.push(['','','','الإجمالي:',rows.length-2+'','','','','','']);
    rows.push(['','','','✅ مؤرشف:',archived,'','','','','']);
    rows.push(['','','','❌ ناقص:',missing,'','','','','']);
    rows.push(['','','','⏳ قيد الأرشفة:',pending,'','','','','']);

    var ws=XLSX.utils.aoa_to_sheet([headers].concat(rows));
    ws['!cols']=[{wch:18},{wch:12},{wch:35},{wch:14},{wch:14},{wch:16},{wch:18},{wch:16},{wch:14},{wch:25}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'تقرير الأرشيف');
    downloadXLSX(wb,'تقرير_الأرشيف_'+new Date().toISOString().slice(0,10)+'.xlsx');
    toast('✅ تم تصدير تقرير الأرشيف');
  });
}

function setDocStatus(entryId, status){
  initDocs(); initالأرشيف();
  var cu=getCurrentUser();
  if(!DB.archiveLog[entryId]) DB.archiveLog[entryId]={};
  DB.archiveLog[entryId].status=status;
  DB.archiveLog[entryId].reviewedBy=cu?cu.name:'';
  DB.archiveLog[entryId].reviewedAt=new Date().toISOString();
  save();
  // Refresh modal
  var notes=(document.getElementById('doc-notes')||{}).value||'';
  DB.archiveLog[entryId].notes=notes;
  save();
  openDocsModal(entryId);
}

function saveDocNotes(entryId){
  initالأرشيف();
  var notes=(document.getElementById('doc-notes')||{}).value||'';
  if(!DB.archiveLog[entryId]) DB.archiveLog[entryId]={status:'pending'};
  DB.archiveLog[entryId].notes=notes;
  var cu=getCurrentUser();
  DB.archiveLog[entryId].updatedBy=cu?cu.name:'';
  DB.archiveLog[entryId].updatedAt=new Date().toISOString();
  save();
  cm();
  toast('✅ تم حفظ الملاحظات');

function triggerDocUpload(entryId){
  var inp=document.getElementById('doc-file-'+entryId);
  if(inp) inp.click();
}

function triggerCameraCapture(entryId){
  var inp=document.getElementById('doc-cam-'+entryId);
  if(inp) inp.click();
}

function handleDocUpload(entryId, input){
  initDocs();
  var files=Array.from(input.files||[]);
  if(!files.length) return;
  var cu=getCurrentUser();
  var pending=files.length;
  var MAX_SIZE=5*1024*1024; // 5MB per file

  files.forEach(function(file){
    if(file.size>MAX_SIZE){
      toast('⚠️ الملف '+file.name+' أكبر من 5MB — قم بضغطه أولاً');
      pending--;
      if(!pending) openDocsModal(entryId);
      return;
    }
    var reader=new FileReader();
    reader.onload=function(e){
      if(!DB.entryDocs[entryId]) DB.entryDocs[entryId]=[];
      DB.entryDocs[entryId].push({
        id:'DOC-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
        name:file.name,
        type:file.type,
        size:file.size,
        data:e.target.result, // base64
        uploadedBy:cu?cu.name:'',
        uploadedAt:new Date().toISOString()
      });
      save();
      pending--;
      if(!pending){
        toast('✅ تم رفع '+files.length+' مستند');
        openDocsModal(entryId);
      }
    };
    reader.readAsDataURL(file);
  });
  input.value='';
}

function viewDoc(entryId, idx){
  initDocs();
  var docs=DB.entryDocs[entryId]||[];
  var doc=docs[idx];
  if(!doc){toast('المستند غير موجود');return;}
  // Open in new window
  var w=window.open('','_blank');
  if(doc.type&&doc.type.includes('image')){
    w.document.write('<html><body style="margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;">'
      +'<img src="'+doc.data+'" style="max-width:100%;max-height:100vh;object-fit:contain;">'
      +'</body></html>');
  } else {
    w.document.write('<html><body style="margin:0;height:100vh;">'
      +'<iframe src="'+doc.data+'" style="width:100%;height:100%;border:none;"></iframe>'
      +'</body></html>');
  }

function buildFinancialContext(){
  var org=DB.org||{};
  var B=bals();

  // KPIs
  var cash=0,bank=0,tRev=0,tExp=0;
  DB.accounts.filter(function(a){return a.c.startsWith('111')&&a.nat==='dr';}).forEach(function(a){
    var b=B[a.c]||{dr:0,cr:0};
    var bal=b.dr-b.cr;
    if(a.c==='1111') cash+=bal; else bank+=bal;
  });
  Object.keys(B).forEach(function(acc){
    var b=B[acc];
    if(acc[0]==='4') tRev+=b.cr-b.dr;
    if(acc[0]==='5') tExp+=b.dr-b.cr;
  });

  // Projects summary
  var projSummary=(DB.projects||[]).map(function(p){
    var spent=getProjectSpent(p.code);
    var pct=p.budget>0?Math.round(spent/p.budget*100):0;
    return p.name+': موازنة='+p.budget+' صرف='+Math.round(spent)+' ('+pct+'%) مانح='+p.donor;
  }).join(' | ');

  // Top expenses last 3 months
  var now=new Date();
  var threeMonthsAgo=new Date(now.getFullYear(),now.getMonth()-3,1).toISOString().slice(0,10);
  var recentExp={};
  (DB.entries||[]).filter(function(e){return e.status==='posted'&&e.date>=threeMonthsAgo;}).forEach(function(e){
    e.lines.forEach(function(l){
      if(l.acc&&l.acc[0]==='5'&&l.dr>0){
        var acc=DB.accounts.find(function(a){return a.c===l.acc;});
        var key=l.acc+(acc?' '+acc.n:'');
        recentExp[key]=(recentExp[key]||0)+l.dr;
      }
    });
  });
  var topExp=Object.entries(recentExp).sort(function(a,b){return b[1]-a[1];}).slice(0,8)
    .map(function(e){return e[0]+': '+Math.round(e[1]);}).join(' | ');

  // HR summary
  var activeEmps=(DB.employees||[]).filter(function(e){return e.status==='active';});
  var totالمرتبات=activeEmps.reduce(function(s,e){return s+calcFull(e,{}).cost;},0);

  // WHT balance
  var wht2114=B['2114']||{cr:0,dr:0};
  var whtBal=Math.round((wht2114.cr-wht2114.dr)*100)/100;

  // الأرشيف status
  var posted=(DB.entries||[]).filter(function(e){return e.status==='posted';}).length;
  var archived=Object.values(DB.archiveLog||{}).filter(function(a){return a.status==='reviewed';}).length;

  return {
    orgName: org.name||'الجمعية',
    cash: Math.round(cash),
    bank: Math.round(bank),
    revenue: Math.round(tRev),
    expenses: Math.round(tExp),
    surplus: Math.round(tRev-tExp),
    projects: projSummary||'لا توجد مشروعات',
    topExpenses: topExp||'لا توجد مصروفات',
    employees: activeEmps.length,
    payroll: Math.round(totالمرتبات),
    whtDue: whtBal,
    totalEntries: posted,
    archivedEntries: archived,
    archivePct: posted>0?Math.round(archived/posted*100):0
  };
}

// ── Get compliance rule for entry ────────────────────────────────
function getالامتثالRule(entry){
  var desc=(entry.desc||'').toLowerCase();
  var tp=null;
  (entry.lines||[]).forEach(function(l){if(l.tpId&&!tp)tp=DB.thirdParties.find(function(t){return t.id===l.tpId;});});
  var whtType=tp?tp.whtType:'';

  if(desc.includes('مرتب')||desc.includes('راتب')) return 'رواتب';
  if(whtType==='استشارات'||whtType==='محاسبة'||whtType==='هندسة'||whtType==='تقنية'||whtType==='طبية') return 'استشارات';
  if(whtType==='خدمات'||whtType==='دعاية'||whtType==='تدريب') return 'خدمات';
  if(whtType==='سفريات'||whtType==='ايجار سيارات') return 'سفريات';
  if(whtType==='صيانة') return 'صيانة';
  if(whtType==='توريدات'||whtType==='طباعة'||whtType==='مقاولات') return 'مشتريات';
  return 'default';
}

// ── Get compliance status for entry ──────────────────────────────
function getالامتثالStatus(entryId){
  initDocs(); initالأرشيف();
  var entry=(DB.entries||[]).find(function(e){return e.id===entryId;});
  if(!entry) return null;

  var ruleKey=getالامتثالRule(entry);
  var rules=getالامتثالRules();var rule=rules[ruleKey]||rules['default'];
  var arch=DB.archiveLog[entryId]||{};
  var docs=DB.entryDocs[entryId]||[];
  var docCount=docs.length;

  // Check required docs
  var requiredCount=rule.docs.filter(function(d){return d.required;}).length;
  var pct=requiredCount>0?Math.min(100,Math.round(docCount/requiredCount*100)):100;
  var isComplete=arch.status==='reviewed';
  var hasAnyDocs=docCount>0;

  var status='missing';
  if(isComplete) status='complete';
  else if(hasAnyDocs&&pct>=50) status='partial';
  else if(hasAnyDocs) status='started';

  return {rule:rule,ruleKey:ruleKey,status:status,docCount:docCount,
    requiredCount:requiredCount,pct:pct,archStatus:arch.status||'pending'};
}

// ── الامتثال لوحة التحكم page ─────────────────────────────────────
function rالامتثالPage(){
  initDocs(); initالأرشيف();
  var posted=(DB.entries||[]).filter(function(e){return e.status==='posted';})
    .sort(function(a,b){return b.date>a.date?1:-1;});

  var stats={complete:0,partial:0,started:0,missing:0};
  var highRisk=[];

  posted.forEach(function(e){
    var cs=getالامتثالStatus(e.id);
    if(cs) stats[cs.status]=(stats[cs.status]||0)+1;
    if(cs&&cs.status==='missing'&&e.lines.reduce(function(s,l){return s+(l.dr||0);},0)>10000){
      highRisk.push({entry:e,cs:cs});
    }
  });

  var total=posted.length;
  var score=total>0?Math.round((stats.complete||0)/total*100):0;

  var h='';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
  h+='<div class="ph-t">✅ امتثال المستندات</div>';
  h+='<button onclick="rالامتثالSettings()" class="btn btn-sm" style="font-size:10.5px;background:var(--g3);color:var(--nd);">⚙️ تعديل القواعد</button>';
  h+='<div style="background:linear-gradient(135deg,'+(score>=80?'#1a7a4a':score>=50?'#d97706':'#c0392b')+',#374151);';
  h+='color:white;font-size:13px;font-weight:900;padding:5px 14px;border-radius:20px;">'+score+'%</div>';
  h+='</div>';

  // Stats
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;margin-bottom:14px;">';
  [
    {lbl:'✅ مكتمل',val:stats.complete||0,bg:'#d1fae5',c:'#065f46'},
    {lbl:'⏳ جزئي',val:stats.partial||0,bg:'#fef3c7',c:'#92400e'},
    {lbl:'🔵 بدأ',val:stats.started||0,bg:'#dbeafe',c:'#1d4ed8'},
    {lbl:'❌ ناقص',val:stats.missing||0,bg:'#fee2e2',c:'#c0392b'},
  ].forEach(function(s){
    h+='<div style="background:'+s.bg+';border-radius:10px;padding:9px;text-align:center;">';
    h+='<div style="font-weight:900;font-size:18px;color:'+s.c+';">'+s.val+'</div>';
    h+='<div style="font-size:9.5px;color:'+s.c+';">'+s.lbl+'</div></div>';
  });
  h+='</div>';

  // High risk entries
  if(highRisk.length){
    h+='<div style="background:#fff5f5;border-radius:11px;padding:12px;margin-bottom:12px;">';
    h+='<div style="font-weight:800;color:#c0392b;margin-bottom:8px;">🚨 قيود عالية القيمة بدون مستندات ('+highRisk.length+')</div>';
    highRisk.slice(0,5).forEach(function(item){
      var amt=item.entry.lines.reduce(function(s,l){return s+(l.dr||0);},0);
      h+='<div style="display:flex;justify-content:space-between;align-items:center;background:white;border-radius:8px;padding:8px;margin-bottom:5px;">';
      h+='<div><div style="font-weight:700;font-size:12px;">'+item.entry.id+'</div>';
      h+='<div style="font-size:10.5px;color:var(--g4);">'+item.entry.date+' · '+item.entry.desc+'</div></div>';
      h+='<div style="text-align:left;">';
      h+='<div style="font-weight:800;color:#c0392b;">'+fmt(amt)+' ج.م</div>';
      h+='<button onclick="openالامتثالModal(\''+item.entry.id+'\')" ';
      h+='style="background:#c0392b;border:none;color:white;border-radius:6px;padding:3px 8px;font-size:10px;cursor:pointer;font-family:Cairo,sans-serif;">معالجة</button>';
      h+='</div></div>';
    });
    h+='</div>';
  }

  // All entries list
  h+='<div class="sd" style="margin-bottom:8px;">كل القيود</div>';
  h+='<div style="display:flex;flex-direction:column;gap:6px;">';
  posted.slice(0,30).forEach(function(e){
    var cs=getالامتثالStatus(e.id);
    if(!cs) return;
    var amt=e.lines.reduce(function(s,l){return s+(l.dr||0);},0);
    var statusColors={complete:'#1a7a4a',partial:'#d97706',started:'#2563eb',missing:'#c0392b'};
    var statusLabels={complete:'✅',partial:'⏳',started:'🔵',missing:'❌'};
    h+='<div style="background:white;border-radius:10px;padding:9px 11px;border:1px solid #eee;display:flex;justify-content:space-between;align-items:center;">';
    h+='<div>';
    h+='<div style="font-size:11px;font-weight:700;color:var(--nd);">'+e.id+'</div>';
    h+='<div style="font-size:10px;color:var(--g4);">'+e.date+' · '+(e.desc.substring(0,30))+'</div>';
    h+='<div style="font-size:10px;color:'+statusColors[cs.status]+';font-weight:700;margin-top:2px;">'

    h+='</div></div>';

  h+='</div>';

// ── Find relevant knowledge for question ─────────────────────────
function findRelevantKnowledge(question){
  var q=question.toLowerCase();
  var relevant=[];
  Object.values(NGO_KNOWLEDGE).forEach(function(kb){
    var score=0;
    kb.topics.forEach(function(t){
      if(q.includes(t.toLowerCase())) score+=3;
    });
    if(q.includes(kb.title.toLowerCase())) score+=5;
    // keyword matching
    var words=q.split(/\s+/);
    words.forEach(function(w){
      if(w.length>3&&kb.content.toLowerCase().includes(w)) score+=1;
    });
    if(score>0) relevant.push({score:score,content:kb.content,title:kb.title});
  });
  relevant.sort(function(a,b){return b.score-a.score;});
  return relevant.slice(0,2).map(function(r){return r.title+':\n'+r.content;}).join('\n\n---\n\n');
}

// ── Arabic amount in words (تفقيط) ───────────────────────────────
function tafqeet(n){
  n = Math.round(n * 100) / 100;
  if(isNaN(n) || n < 0) return '';
  if(n === 0) return 'صفر جنيه مصري فقط لا غير';

  var pounds = Math.floor(n);
  var piasters = Math.round((n - pounds) * 100);

  var ones = ['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة',
    'عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر',
    'ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  var tens = ['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  var hundreds = ['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];
  var thousands = ['','ألف','ألفان','ثلاثة آلاف','أربعة آلاف','خمسة آلاف','ستة آلاف','سبعة آلاف','ثمانية آلاف','تسعة آلاف'];
  var millions = ['','مليون','مليونان','ثلاثة ملايين','أربعة ملايين','خمسة ملايين','ستة ملايين','سبعة ملايين','ثمانية ملايين','تسعة ملايين'];

  function readThree(n){
    if(n === 0) return '';
    if(n < 20) return ones[n];
    if(n < 100){
      var t = tens[Math.floor(n/10)];
      var o = n % 10;
      return o > 0 ? ones[o] + ' و' + t : t;
    }
    var h = hundreds[Math.floor(n/100)];
    var rem = n % 100;
    return rem > 0 ? readThree(rem) + ' و' + h : h;
  }

  function readNum(n){
    if(n === 0) return '';
    var result = '';
    var mil = Math.floor(n / 1000000);
    var thou = Math.floor((n % 1000000) / 1000);
    var rem = n % 1000;

    if(mil > 0){
      result += (mil < 10 ? millions[mil] : readThree(mil) + ' مليون');
      result += ' ';
    }
    if(thou > 0){
      result += (thou < 10 ? thousands[thou] : readThree(thou) + ' ألف');
      result += ' ';
    }
    if(rem > 0){
      result += readThree(rem);
    }
    return result.trim();
  }

  var result = readNum(pounds);
  result += (pounds === 1 ? ' جنيه مصري' : ' جنيهاً مصرياً');
  if(piasters > 0){
    result += ' و' + readNum(piasters);
    result += (piasters === 1 ? ' قرش' : ' قرشاً');
  }
  result += ' فقط لا غير';
  return result;
}

// English tafqeet
function tafqeetEn(n){
  n = Math.round(n * 100) / 100;
  if(isNaN(n) || n < 0) return '';
  if(n === 0) return 'Zero Egyptian Pounds Only';
  var pounds = Math.floor(n);
  var piasters = Math.round((n - pounds) * 100);
  var ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine',
    'Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  var tens = ['','Ten','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function readThree(n){
    if(n === 0) return '';
    if(n < 20) return ones[n];
    if(n < 100){
      var t = tens[Math.floor(n/10)];
      var o = n % 10;
      return o > 0 ? t + ' ' + ones[o] : t;
    }
    var h = ones[Math.floor(n/100)] + ' Hundred';
    var rem = n % 100;
    return rem > 0 ? h + ' and ' + readThree(rem) : h;
  }
  function readNum(n){
    if(n === 0) return '';
    var r = '';
    var mil = Math.floor(n/1000000);
    var thou = Math.floor((n%1000000)/1000);
    var rem = n % 1000;
    if(mil > 0) r += readThree(mil) + ' Million ';
    if(thou > 0) r += readThree(thou) + ' Thousand ';
    if(rem > 0) r += readThree(rem);
    return r.trim();
  }
  var result = readNum(pounds) + (pounds === 1 ? ' Egyptian Pound' : ' Egyptian Pounds');
  if(piasters > 0) result += ' and ' + readNum(piasters) + (piasters === 1 ? ' Piaster' : ' Piasters');
  result += ' Only';
  return result;
}

function switchChkTab(tab){
  var manual=document.getElementById('panel-manual');
  var entry=document.getElementById('panel-entry');
  var btnM=document.getElementById('tab-manual');
  var btnE=document.getElementById('tab-entry');
  if(!manual||!entry) return;
  if(tab==='manual'){
    manual.style.display='';entry.style.display='none';
    if(btnM){btnM.style.background='var(--nd)';btnM.style.color='white';btnM.style.border='none';}
    if(btnE){btnE.style.background='#f8f9fa';btnE.style.color='#374151';btnE.style.border='1.5px solid #e5e7eb';}

    manual.style.display='none';entry.style.display='';

    if(btnM){btnM.style.background='#f8f9fa';btnM.style.color='#374151';btnM.style.border='1.5px solid #e5e7eb';}
  }
}

  q = q.toLowerCase();
  var matches = (DB.entries||[]).filter(function(e){
    return e.status==='posted' && (
      e.id.toLowerCase().includes(q) ||
      (e.desc||'').toLowerCase().includes(q) ||
      (e.ref||'').toLowerCase().includes(q)
    );
  }).slice(0,5);

  if(!matches.length){ res.innerHTML='<div style="font-size:11px;color:var(--g4);padding:6px;">لا توجد نتائج</div>'; return; }
  var h = '<div style="display:flex;flex-direction:column;gap:5px;margin-top:8px;">';
  matches.forEach(function(e){
    var amt = e.lines.reduce(function(s,l){return s+(l.cr||0);},0);
    // Get TP name
    var tp = null;
    e.lines.forEach(function(l){if(l.tpId&&!tp)tp=(DB.thirdParties||[]).find(function(t){return t.id===l.tpId;});});
    h += '<div style="background:white;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;">';
    h += '<div><div style="font-size:11.5px;font-weight:700;color:var(--nd);">'+e.id+'</div>'
      +'<div style="font-size:10.5px;color:var(--g4);">'+e.date+' · '+e.desc+'</div>'
      +(tp?'<div style="font-size:10.5px;color:var(--sk);">'+tp.name+'</div>':'')
      +'</div>';
    h += '<div style="text-align:left;">';
    h += '<div style="font-weight:800;color:var(--nd);">'+fmt(amt)+' ج.م</div>';
    h += '<button data-eid="'+e.id+'" onclick="fillCheckFromEntry(this.dataset.eid)" style="background:var(--gr);border:none;color:white;border-radius:6px;padding:3px 8px;font-size:10px;cursor:pointer;font-family:Cairo,sans-serif;">تعبئة</button>';

  if(!entry) return;
  var amt = entry.lines.reduce(function(s,l){return s+(l.cr||0);},0);
  var tp = null;
  entry.lines.forEach(function(l){if(l.tpId&&!tp)tp=(DB.thirdParties||[]).find(function(t){return t.id===l.tpId;});});

  var nameAr = tp ? tp.name : '';
  var nameEn = tp ? (tp.nameEn||tp.name) : '';
  var bankAcc = (DB.masterData&&DB.masterData.bankAccounts&&DB.masterData.bankAccounts[0])||{};

  var setVal = function(id,val){ var el=document.getElementById(id); if(el) el.value=val; };
  setVal('chk-name-ar', nameAr);
  setVal('chk-name-en', nameEn);
  setVal('chk-amount', amt);
  setVal('chk-date', entry.date);
  setVal('chk-bank', bankAcc.name||'');
  setVal('chk-num', entry.ref||'');

  var res = document.getElementById('chk-entry-results');

  toast('✅ تم تعبئة الشيك من '+entryId);
}
