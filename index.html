function showTbBack(target){
  window._backTarget=target;
  var b=document.getElementById('tb-back');
  if(b){ b.innerHTML='🔙 رجوع'; b.style.display='inline-flex'; }
}
function hideTbBack(){ window._backTarget=null; var b=document.getElementById('tb-back'); if(b)b.style.display='none'; }

function openChecks(){
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on');});
  var p=document.getElementById('pg-checks');
  if(p){ p.innerHTML=rCheckPage(); p.classList.add('on'); }
  document.querySelectorAll('.bn').forEach(function(b){b.classList.remove('on');});
  showTbBack({type:'nav',pg:'fin'});
  setTimeout(updateChkPreview,80);
  window.scrollTo(0,0);
}

function switchChkTab(tab){
  var m=document.getElementById('panel-manual'), e=document.getElementById('panel-entry'), bm=document.getElementById('tab-manual'), be=document.getElementById('tab-entry');
  if(!m||!e)return;
  if(tab==='manual'){m.style.display='';e.style.display='none'; if(bm){bm.style.background='#0d3b6e';bm.style.color='white';} if(be){be.style.background='#eef4fa';be.style.color='#0d3b6e';}}
  else{m.style.display='none';e.style.display=''; if(be){be.style.background='#0d3b6e';be.style.color='white';} if(bm){bm.style.background='#eef4fa';bm.style.color='#0d3b6e';}}
}

(function(){
  var oldNav = nav;
  nav = function(pg,btn){
    if(pg==='checks'){ openChecks(); return; }
    oldNav(pg,btn);
  };
})();

function _empOptions(selected){
  var ops='<option value="">— اختر الموظف —</option>';
  (DB.employees||[]).filter(function(e){return e.status==='active'||!e.status;}).forEach(function(e){ops+='<option value="'+e.id+'" '+(selected===e.id?'selected':'')+'>'+e.name+'</option>';});
  return ops;
}
function _empName(id){var e=(DB.employees||[]).find(function(x){return x.id===id;});return e?e.name:(id||'—');}
function _assetMovement(a,type,extra){ if(!a.movements)a.movements=[]; var m=Object.assign({type:type,date:new Date().toISOString().slice(0,10),by:(getCurrentUser()||{}).name||'النظام'},extra||{}); a.movements.push(m); return m; }
function assetHandover(idx){
  var a=(DB.assets||[])[idx]; if(!a)return;
  var h='<div class="asset-permit-card"><b>إذن تسليم أصل</b><br>الأصل: '+a.name+'<br>الرقم التسلسلي: '+(a.serial||'—')+'</div>';
  h+='<div class="fg"><label>يُسلّم إلى / الموظف المستلم *</label><select id="ah-to">'+_empOptions(a.custodianId)+'</select></div>';
  h+='<div class="fg"><label>تاريخ التسليم</label><input type="date" id="ah-date" value="'+new Date().toISOString().slice(0,10)+'"></div>';
  h+='<div class="fg"><label>حالة الأصل عند التسليم</label><select id="ah-cond"><option>جيدة</option><option>تحتاج صيانة</option><option>متضررة</option></select></div>';
  h+='<div class="fg"><label>ملاحظات</label><input id="ah-notes" placeholder="مثال: تم تسليم الشاحن والحقيبة"></div>';
  h+='<button class="btn btn-gr" style="width:100%;margin-top:10px;" onclick="saveAssetHandover('+idx+',true)">✅ حفظ وطباعة إذن التسليم</button>';
  om('📤 إذن تسليم أصل: '+a.name,h);
}
function saveAssetHandover(idx,printIt){
  var a=(DB.assets||[])[idx];if(!a)return;
  var to=(document.getElementById('ah-to')||{}).value||''; if(!to){toast('⚠️ اختر الموظف المستلم');return;}
  var m=_assetMovement(a,'إذن تسليم أصل',{toCustodianId:to,to:_empName(to),date:(document.getElementById('ah-date')||{}).value,condition:(document.getElementById('ah-cond')||{}).value,notes:(document.getElementById('ah-notes')||{}).value});
  a.custodianId=to; a.status='مُسلَّم'; save(); cm(); sub('assets'); toast('✅ تم تسجيل إذن التسليم'); if(printIt) printAssetPermit(a,m);
}

function saveAssetReturn(idx,printIt){
  var a=(DB.assets||[])[idx]; if(!a)return;

function saveAssetTransfer(idx,printIt){

  var m=_assetMovement(a,'إذن تحويل أصل من شخص لشخص',{fromCustodianId:from,from:_empName(from),toCustodianId:to,to:_empName(to),date:(document.getElementById('at-date')||{}).value,notes:(document.getElementById('at-notes')||{}).value});

function printAssetPermit(a,m){

  var html='<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>'+escp(m.type)+'</title><style>'+css+'</style></head><body>'
    +'<div class="head"><div class="brand">أثر للحلول المالية</div><div>تاريخ الطباعة: '+new Date().toLocaleDateString('ar-EG')+'</div></div>'
    +'<div class="title">'+escp(m.type)+'</div>'
    +'<div class="box"><div class="grid">'

      width:4px; height:100%; background:var(--card-color,var(--sk));
    }
    .mod-ic-wrap {
      width:44px; height:44px; border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      font-size:22px; margin-bottom:8px;
    }
    .mod-title { font-weight:800; font-size:13px; color:var(--n); margin-bottom:2px; }
    .mod-desc { font-size:10.5px; color:var(--g4); line-height:1.4; }
    .mod-arrow { font-size:12px; color:var(--g4); margin-top:6px; }


/* ─────────────────────────────────────────────
   ATHAR V6 — Professional Core لوحة التحكم
   Focus: content-first, clean SaaS, microfinance as internal module
───────────────────────────────────────────── */
.athar-v6{padding:14px 14px 86px;background:linear-gradient(180deg,#f6f9fc 0%,#eef4fa 100%);min-height:100vh;}
.v6-hero{background:linear-gradient(135deg,#0b2f57 0%,#123f72 58%,#18a7d8 100%);border-radius:22px;padding:18px;color:white;box-shadow:0 14px 35px rgba(13,59,110,.20);position:relative;overflow:hidden;margin-bottom:14px;}
.v6-hero:after{content:"";position:absolute;left:-55px;top:-55px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.10);}
.v6-hero:before{content:"";position:absolute;right:-45px;bottom:-55px;width:150px;height:150px;border-radius:50%;background:rgba(41,171,226,.23);}
.v6-top{position:relative;z-index:1;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
.v6-eyebrow{font-size:10px;opacity:.72;font-weight:800;letter-spacing:.2px;}
.v6-title{font-family:Tajawal,Cairo,sans-serif;font-size:21px;font-weight:900;margin-top:4px;line-height:1.2;}
.v6-sub{font-size:11px;opacity:.78;margin-top:5px;line-height:1.7;}
.v6-score{position:relative;z-index:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.23);border-radius:16px;padding:10px 12px;min-width:92px;text-align:center;backdrop-filter:blur(8px);}
.v6-score-num{font-family:Tajawal,Cairo,sans-serif;font-size:24px;font-weight:900;line-height:1;color:#fff;}
.v6-score-lbl{font-size:9.5px;opacity:.76;margin-top:3px;}
.v6-pills{position:relative;z-index:1;display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
.v6-pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:800;}
.v6-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.v6-card{background:white;border:1px solid #e8eef5;border-radius:18px;padding:13px;box-shadow:0 8px 22px rgba(13,59,110,.07);}
.v6-kpi{position:relative;overflow:hidden;min-height:116px;}
.v6-kpi:before{content:"";position:absolute;right:0;top:0;width:5px;height:100%;background:var(--accent,#29abe2);}
.v6-kpi-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.v6-ico{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--soft,#e8f6fd);font-size:18px;}
.v6-trend{font-size:9.5px;font-weight:900;color:var(--accent,#29abe2);background:var(--soft,#e8f6fd);padding:3px 7px;border-radius:999px;}
.v6-val{font-family:Tajawal,Cairo,sans-serif;font-size:20px;font-weight:900;color:#102a43;line-height:1.15;}
.v6-lbl{font-size:10.5px;color:#637591;font-weight:800;margin-top:4px;}
.v6-note{font-size:9.5px;color:#94a8c2;margin-top:6px;line-height:1.5;}
.v6-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px;}
.v6-section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.v6-section-title b{font-family:Tajawal,Cairo,sans-serif;font-size:15px;color:#1e3a6e;font-weight:900;}
.v6-section-title span{font-size:10px;color:#94a8c2;font-weight:800;}
.v6-alert{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;margin-bottom:8px;border:1px solid transparent;}
.v6-alert.danger{background:#fff1f2;border-color:#fecdd3;color:#9f1239;}
.v6-alert.warn{background:#fffbeb;border-color:#fde68a;color:#92400e;}
.v6-alert.info{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8;}
.v6-alert.ok{background:#ecfdf5;border-color:#bbf7d0;color:#065f46;}
.v6-alert .ic{font-size:19px;line-height:1;}
.v6-alert .t{font-size:12px;font-weight:900;line-height:1.45;}
.v6-alert .s{font-size:10px;opacity:.78;margin-top:2px;line-height:1.45;}
.v6-chart-row{display:flex;align-items:end;gap:7px;height:124px;padding:6px 2px 0;border-bottom:1px dashed #d8e4f0;}
.v6-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:5px;}
.v6-bar{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#29abe2,#1e3a6e);min-height:8px;box-shadow:0 5px 12px rgba(41,171,226,.22);}
.v6-bar-label{font-size:9px;color:#637591;font-weight:800;}
.v6-progress{height:8px;background:#eef4fa;border-radius:999px;overflow:hidden;margin-top:7px;}
.v6-progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#29abe2,#1e3a6e);}
.v6-modules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.v6-module{background:white;border:1px solid #e8eef5;border-radius:18px;padding:13px;box-shadow:0 8px 22px rgba(13,59,110,.06);cursor:pointer;transition:.15s;min-height:126px;}
.v6-module:active{transform:scale(.98);}
.v6-module .mi{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#e8f6fd;font-size:21px;margin-bottom:9px;}
.v6-module .mt{font-size:13px;font-weight:900;color:#1e3a6e;margin-bottom:4px;}
.v6-module .ms{font-size:10.2px;color:#637591;line-height:1.55;}
.v6-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
.v6-action{border:none;border-radius:16px;padding:13px 10px;background:#1e3a6e;color:white;font-family:Cairo,sans-serif;font-weight:900;font-size:12px;box-shadow:0 8px 18px rgba(30,58,110,.18);cursor:pointer;}
.v6-action.sky{background:#29abe2;}
.v6-action.green{background:#059669;}
.v6-action.amber{background:#d97706;}
.v6-list-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf2f7;}
.v6-list-item:last-child{border-bottom:none;}
.v6-list-title{font-size:12px;font-weight:900;color:#1e3a6e;}
.v6-list-sub{font-size:10px;color:#637591;margin-top:2px;}
.v6-badge{font-size:10px;font-weight:900;border-radius:999px;padding:3px 8px;white-space:nowrap;}
.v6-badge.red{background:#fee2e2;color:#991b1b;}.v6-badge.yellow{background:#fef3c7;color:#92400e;}.v6-badge.green{background:#d1fae5;color:#065f46;}.v6-badge.blue{background:#dbeafe;color:#1e3a6e;}
@media(min-width:720px){.athar-v6{max-width:1100px;margin:auto;padding-bottom:95px}.v6-kpis{grid-template-columns:repeat(4,1fr)}.v6-grid{grid-template-columns:1.3fr .9fr}.v6-modules{grid-template-columns:repeat(4,1fr)}.v6-actions{grid-template-columns:repeat(4,1fr)}}

</style>
</head>

function getOpeningBals(fromDate){
  // Calculate opening balances from entries before fromDate
  var ob={};
  DB.accounts.forEach(function(a){ob[a.c]={dr:0,cr:0};});
  if(fromDate){
    (DB.entries||[]).filter(function(e){
      return e.status==='posted' && e.date < fromDate;
    }).forEach(function(e){
      (e.lines||[]).forEach(function(l){
        if(!ob[l.acc]) ob[l.acc]={dr:0,cr:0};
        ob[l.acc].dr+=(l.dr||0);
        ob[l.acc].cr+=(l.cr||0);
      });
    });
  }
  // Add manual opening balances from DB.openingBals
  if(DB.openingBals){
    Object.keys(DB.openingBals).forEach(function(acc){
      if(!ob[acc]) ob[acc]={dr:0,cr:0};
      var a=DB.accounts.find(function(x){return x.c===acc;});
      if(a){
        if(a.nat==='dr') ob[acc].dr+=DB.openingBals[acc];
        else ob[acc].cr+=DB.openingBals[acc];
      }
    });
  }
  return ob;
}

// PAYROLL CALC
// ============================================================
// SALARY VARIABLE COMPONENTS — المكونات المتغيرة للمرتب
// ============================================================

// ---- EXTENDED CALC — يشمل المكونات المتغيرة ----
function calcFull(e, overrides){
  var o=overrides||{};
  var sal    = o.sal      !==undefined ? o.sal      : (e.sal||0);
  var al     = o.allow    !==undefined ? o.allow    : (e.allow||0);
  var nw     = o.natWork  !==undefined ? o.natWork  : (e.natWork||0);
  var tr     = o.transport!==undefined ? o.transport: (e.transport||0);
  var ot     = o.overtime !==undefined ? o.overtime : (e.overtime||0);
  var bonus  = o.bonus    !==undefined ? o.bonus    : 0;
  var stipend= o.stipend  !==undefined ? o.stipend  : 0;
  var ded    = o.deduct   !==undefined ? o.deduct   : (e.deduct||0);
  var penalty= o.penalty  !==undefined ? o.penalty  : 0;
  var absence= o.absence  !==undefined ? o.absence  : 0;
  var ins    = o.ins      !==undefined ? o.ins      : (e.ins||"full");

  // Gross
  var gross = sal + al + nw + tr + ot + bonus + stipend;

  // ============================================================
  // قراءة الإعدادات من taxConfig (قابلة للتعديل من الأدمن)
  // ============================================================
  var cfg = (DB.taxConfig && DB.taxConfig.brackets) ? DB.taxConfig : {
    personalExemptAnnual:20000, otherExemptAnnual:0,
    insMin:2700, insMax:16700, empInsRate:0.11, emplInsRate:0.1875, martyrsRate:0.0005,
    brackets:[{from:0,to:40000,rate:0},{from:40000,to:55000,rate:0.10},{from:55000,to:70000,rate:0.15},{from:70000,to:200000,rate:0.20},{from:200000,to:400000,rate:0.225},{from:400000,to:1200000,rate:0.25},{from:1200000,to:null,rate:0.275}]
  };

  // 1. التأمينات
  var iBase  = ins==="none" ? 0 : Math.min(Math.max(sal+al, cfg.insMin||2700), cfg.insMax||16700);
  var empI   = ins==="none" ? 0 : Math.round(iBase * (cfg.empInsRate||0.11));
  var emplI  = ins==="full" ? Math.round(iBase * (cfg.emplInsRate||0.1875)) : 0;
  var annualInsurance = empI * 12;

  // 2. الإعفاءات السنوية
  var annualExemptions = (cfg.personalExemptAnnual||20000) + (cfg.otherExemptAnnual||0);

  // 3. الوعاء الضريبي السنوي
  // annualGross - annualInsurance - annualExemptions
  var annualGross = gross * 12;
  var netTaxable  = Math.max(0, annualGross - annualInsurance - annualExemptions);

  // 4. تطبيق الشرائح
  // ============================================================
  // حساب الضريبة — دالة الشرائح التراكمية
  // ============================================================
  // ============================================================
  // نظام الشرائح المتغيرة حسب مستوى الدخل — قانون 7/2024
  // الشريحة المعفاة (0%) تتقلص كلما زاد الدخل الإجمالي
  // ============================================================
  function applyBrackets(amount){
    var tax=0;
    var brackets;

    // هل هناك شرائح مخصصة في الإعدادات؟
    var hasCfgBrackets=(cfg.brackets&&cfg.brackets.length>0&&cfg.taxMode==="custom");

    if(hasCfgBrackets){
      // استخدم الشرائح المخصصة (editable)
      brackets=cfg.brackets;
      for(var i=0;i<brackets.length;i++){
        var b=brackets[i];
        var fr=b.from||0,to2=b.to||Infinity;
        if(amount<=fr) break;
        tax+=(Math.min(amount,to2)-fr)*(b.rate||0);
      }
    } else {
      // قانون 7 لسنة 2024 — شرائح متغيرة حسب مستوى الدخل
      var tiers;
      if(amount<=400000){
        tiers=[[0,40000,0],[40000,55000,0.10],[55000,70000,0.15],[70000,200000,0.20],[200000,400000,0.225]];
      } else if(amount<=700000){
        tiers=[[0,55000,0.10],[55000,70000,0.15],[70000,200000,0.20],[200000,400000,0.225],[400000,700000,0.25]];
      } else if(amount<=800000){
        tiers=[[0,70000,0.15],[70000,200000,0.20],[200000,400000,0.225],[400000,800000,0.25]];
      } else if(amount<=900000){
        tiers=[[0,200000,0.20],[200000,400000,0.225],[400000,900000,0.25]];
      } else if(amount<=1200000){
        tiers=[[0,400000,0.225],[400000,1200000,0.25]];
      } else {
        tiers=[[0,1200000,0.25],[1200000,null,0.275]];
      }
      for(var j=0;j<tiers.length;j++){
        var t2=tiers[j],tfr=t2[0],tto=t2[1]||Infinity;
        if(amount<=tfr) break;
        tax+=(Math.min(amount,tto)-tfr)*t2[2];
      }
    }
    return tax;
  }

  var annualTax = applyBrackets(netTaxable);
  var mode = cfg.taxCalcMode || "monthly_average";
  var tax;

  if(mode === "cumulative" && o.currentMonth && o.taxPaidSoFar !== undefined){
    // ---- وضع التراكمي: فقط لما يُمرَّر الشهر والضريبة المدفوعة فعلاً ----
    // ضريبة الشهر N = (ضريبة سنوية × N/12) − ما دُفع في الشهور السابقة
    var taxUpToNow = annualTax * (o.currentMonth / 12);
    tax = Math.max(0, Math.round(taxUpToNow - o.taxPaidSoFar));
  } else {
    // ---- monthly average (الافتراضي لكل الحالات الأخرى) ----
    tax = Math.round(annualTax / 12);
  }

  // صندوق الشهداء
  var mar = Math.round(gross * (cfg.martyrsRate||0.0005));

  var totalDed = ded + penalty + absence;
  var net = gross - empI - tax - mar - totalDed;

  return {
    sal:sal, al:al, nw:nw, tr:tr,
    ot:ot, bonus:bonus, stipend:stipend,
    gross:gross,
    iBase:iBase, empI:empI, emplI:emplI,
    annualInsurance:annualInsurance,
    annualExemptions:annualExemptions,
    annualGross:annualGross,
    netTaxable:Math.round(netTaxable),
    annualTax:Math.round(annualTax),
    tax:tax, mar:mar,
    ded:ded, penalty:penalty, absence:absence, totalDed:totalDed,
    net:Math.max(0,net), cost:gross+emplI
  };
}

// Storage for monthly variable components
function varKey(empId,monthKey){return "VAR_"+empId+"_"+monthKey;}
function getStoredVar(empId,monthKey){
  if(!DB.payrollVars)DB.payrollVars={};
  return DB.payrollVars[varKey(empId,monthKey)]||null;
}
function saveVarComponents(empId,monthKey){
  if(!DB.payrollVars)DB.payrollVars={};
  var key=varKey(empId,monthKey);
  DB.payrollVars[key]={
    overtime:fv("vc-ot"),bonus:fv("vc-bonus"),stipend:fv("vc-stipend"),
    penalty:fv("vc-penalty"),absence:fv("vc-absence"),
    addNote:sv("vc-add-note"),dedNote:sv("vc-ded-note")
  };
  save();cm();
  toast("✅ تم حفظ المكونات المتغيرة");
  // Refresh preview in payroll modal if open
  if(typeof refreshPayPreview==="function") refreshPayPreview();
}

// Get effective override for an employee in a given month
function getEmpOverride(empId,monthKey){
  return getStoredVar(empId,monthKey)||{};
}



// BALANCES
function bals(){
  var m={};
  DB.accounts.forEach(function(a){m[a.c]={dr:0,cr:0};});
  DB.entries.filter(function(e){return e.status==="posted";}).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(!l.acc) return;
      if(!m[l.acc]) m[l.acc]={dr:0,cr:0}; // include orphan accounts
      m[l.acc].dr+=l.dr||0;
      m[l.acc].cr+=l.cr||0;
    });
  });
  return m;
}

function goBack(){
  if(window._backTarget){
    var t=window._backTarget;window._backTarget=null;hideTbBack();
    if(t.type==="nav") nav(t.pg,null);

      var nm=(t.pg||"").match(/nav\(.(\w+)/);var sm=(t.pg||"").match(/sub\(.(\w+)/);

function nav(pg,btn){
  console.log('[أثر] nav called:', pg);
  // Hide topbar back button on main pages
  if(['dash','jour','fin','ops','more','pay','proj','loans'].indexOf(pg)>-1) hideTbBack();

  // update user badge in topbar
  var tbadge=document.getElementById("tb-user-badge");
  if(tbadge){var cu=getCurrentUser();if(cu){var icons={admin:"🔴",accounts_manager:"🟡",accountant:"🟢"};tbadge.textContent=(icons[cu.role]||"👤")+" "+cu.name;}}
  document.querySelectorAll(".pg").forEach(function(p){p.classList.remove("on");});
  document.querySelectorAll(".bn").forEach(function(b){b.classList.remove("on");});
  var p=document.getElementById("pg-"+pg);
  if(p)p.classList.add("on");
  if(btn)btn.classList.add("on");
  if(pg==="dash")rDash();
  else if(pg==="jour")rJour();
  else if(pg==="proj")rProj();
  else if(pg==="pay")rPay();
  else if(pg==="checks"){var _pgChecks=document.getElementById("pg-checks");if(_pgChecks)_pgChecks.innerHTML=rCheckPage();showTbBack({type:"nav",pg:"fin"});}
  else if(pg==="fin"){var _pgFin=document.getElementById("pg-fin");if(_pgFin)_pgFin.innerHTML=rالماليةHub();}
  else if(pg==="ops"){var _pgOps=document.getElementById("pg-ops");if(_pgOps)_pgOps.innerHTML=rOperationsHub();}
  else if(pg==="more")rMore();
  else if(pg==="loans"){rقروضPage();}
  window.scrollTo(0,0);
  var ct=document.querySelector('.content');if(ct)ct.scrollTop=0;
}

  var exempt1=parseFloat((document.getElementById('tc-exempt')||{}).value)||20000;
  var exempt2=parseFloat((document.getElementById('tc-exempt2')||{}).value)||0;
  var empR=parseFloat((document.getElementById('tc-empR')||{}).value)||11;

  var empI=Math.round(insBase*(empR/100));
  var annualG=sal*12;
  var annualIns=empI*12;
  var annualExempt=exempt1+exempt2;
  var netTaxable=Math.max(0,annualG-annualIns-annualExempt);

  // Read brackets from UI
  var brackets=[];
  var i=0;
  while(document.getElementById('tc-from-'+i)){
    var from=parseFloat((document.getElementById('tc-from-'+i)||{}).value)||0;
    var to=parseFloat((document.getElementById('tc-to-'+i)||{}).value)||null;
    var rate=(parseFloat((document.getElementById('tc-rate-'+i)||{}).value)||0)/100;
    brackets.push({from:from,to:to,rate:rate});
    i++;
  }

  var annualTax=0;
  brackets.forEach(function(b){
    var from=b.from,to=b.to||Infinity;
    if(netTaxable<=from) return;
    annualTax+=(Math.min(netTaxable,to)-from)*b.rate;
  });
  var monthlyTax=Math.round(annualTax/12);
  var martyrsR=parseFloat((document.getElementById('tc-martyrs')||{}).value)||0.05;
  var martyrs=Math.round(sal*(martyrsR/100));
  var net=sal-empI-monthlyTax-martyrs;

  // Update exempt preview
  var ep=document.getElementById('tc-exempt-preview');
  if(ep) ep.textContent=((exempt1+exempt2)/12).toFixed(2);

  var el2=document.getElementById('tc-test-result');
  if(!el2) return;
  var h='<div style="font-size:11.5px;font-weight:800;color:var(--n);margin-bottom:8px;">📋 تفاصيل الحساب:</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px;">';
  h+='<div>الراتب الشهري:</div><div style="font-weight:700;text-align:left;">'+fmt(sal)+'</div>';
  h+='<div>الراتب السنوي:</div><div style="font-weight:700;text-align:left;">'+fmt(annualG)+'</div>';
  h+='<div>التأمين الشهري ('+empR+'%):</div><div style="color:var(--rd);font-weight:700;text-align:left;">−'+fmt(empI)+'</div>';
  h+='<div>التأمين السنوي:</div><div style="color:var(--rd);text-align:left;">−'+fmt(annualIns)+'</div>';
  h+='<div>الإعفاءات السنوية:</div><div style="color:var(--rd);text-align:left;">−'+fmt(annualExempt)+'</div>';
  h+='<div style="font-weight:800;border-top:1px solid var(--g2);padding-top:4px;">الوعاء الضريبي السنوي:</div>';
  h+='<div style="font-weight:800;color:var(--n);text-align:left;border-top:1px solid var(--g2);padding-top:4px;">'+fmt(netTaxable)+'</div>';
  h+='<div>الضريبة السنوية:</div><div style="color:var(--am);text-align:left;">'+fmt(Math.round(annualTax))+'</div>';
  h+='<div style="font-weight:800;">الضريبة الشهرية (÷12):</div><div style="color:var(--am);font-weight:800;text-align:left;">'+fmt(monthlyTax)+'</div>';
  h+='<div>صندوق الشهداء:</div><div style="color:var(--g4);text-align:left;">'+fmt(martyrs)+'</div>';
  h+='</div>';
  h+='<div style="margin-top:10px;background:linear-gradient(135deg,var(--nd),var(--n));border-radius:9px;padding:11px;display:flex;justify-content:space-between;align-items:center;">';
  h+='<span style="color:white;font-size:12px;font-weight:700;">الصافي المستحق</span>';
  h+='<span style="color:white;font-weight:900;font-size:18px;">'+fmt(net)+' ج.م</span></div>';
  el2.innerHTML=h;
}

function setTaxMode(mode){
  if(!DB.taxConfig)DB.taxConfig={};
  DB.taxConfig.taxCalcMode=mode;
  save();rTaxConfig();
  toast("✅ "+(mode==='cumulative'?'وضع التراكمي':'وضع المتوسط الشهري')+" نشط");
}
function addBracket(){
  var cfg=DB.taxConfig||{brackets:[]};
  cfg.brackets=cfg.brackets||[];
  var last=cfg.brackets[cfg.brackets.length-1]||{to:1200000};
  cfg.brackets.push({from:last.to||1200000,to:null,rate:0.30});
  DB.taxConfig=cfg;
  rTaxConfig();
}
function removeBracket(i){
  if((DB.taxConfig.brackets||[]).length<=1){toast("⚠️ يجب إبقاء شريحة واحدة على الأقل");return;}
  DB.taxConfig.brackets.splice(i,1);
  rTaxConfig();
}

function saveTaxConfig(){
  if(!DB.taxConfig) DB.taxConfig={};
  DB.taxConfig.insMin=parseFloat((document.getElementById('tc-insMin')||{}).value)||2700;
  DB.taxConfig.insMax=parseFloat((document.getElementById('tc-insMax')||{}).value)||16700;
  DB.taxConfig.empInsRate=(parseFloat((document.getElementById('tc-empR')||{}).value)||11)/100;
  DB.taxConfig.emplInsRate=(parseFloat((document.getElementById('tc-emplR')||{}).value)||18.75)/100;
  DB.taxConfig.personalExemptAnnual=parseFloat((document.getElementById('tc-exempt')||{}).value)||20000;
  DB.taxConfig.otherExemptAnnual=parseFloat((document.getElementById('tc-exempt2')||{}).value)||0;
  DB.taxConfig.martyrsRate=(parseFloat((document.getElementById('tc-martyrs')||{}).value)||0.05)/100;
  // mode already saved by setTaxMode, but keep in sync
  if(!DB.taxConfig.taxCalcMode)DB.taxConfig.taxCalcMode='cumulative';
  var brackets=[];
  var i=0;
  while(document.getElementById('tc-from-'+i)){
    brackets.push({
      from:parseFloat((document.getElementById('tc-from-'+i)||{}).value)||0,
      to:parseFloat((document.getElementById('tc-to-'+i)||{}).value)||null,
      rate:(parseFloat((document.getElementById('tc-rate-'+i)||{}).value)||0)/100
    });
    i++;
  }
  DB.taxConfig.brackets=brackets.sort(function(a,b){return a.from-b.from;});
  save();
  toast("✅ تم حفظ إعدادات الضريبة — سيتم تطبيقها على كل الحسابات القادمة");
  cm();
}

function resetTaxConfig(){
  if(!confirm("هل تريد استعادة الإعدادات الافتراضية؟")) return;
  DB.taxConfig={
    personalExemptAnnual:20000,otherExemptAnnual:0,
    insMin:2700,insMax:16700,empInsRate:0.11,emplInsRate:0.1875,martyrsRate:0.0005,taxCalcMode:'monthly_average',

      {from:0,to:40000,rate:0},{from:40000,to:55000,rate:0.10},{from:55000,to:70000,rate:0.15},{from:70000,to:200000,rate:0.20},{from:200000,to:400000,rate:0.225},{from:400000,to:1200000,rate:0.25},{from:1200000,to:null,rate:0.275}

// DASHBOARD

function getSmartAlerts(){
  var alerts=[];
  var today=new Date().toISOString().slice(0,10);
  var todayMs=new Date(today).getTime();

  // 1. مستندات العقود المنتهية أو القريبة من الانتهاء
  (DB.contracts||[]).forEach(function(ct,i){
    if(!ct.endDate) return;
    var daysLeft=Math.round((new Date(ct.endDate).getTime()-todayMs)/86400000);
    if(daysLeft<0) alerts.push({level:'danger',icon:'📋',
      msg:'عقد منتهي: '+ct.name,sub:'هنهي '+Math.abs(daysLeft)+' يوم'});
    else if(daysLeft<=30) alerts.push({level:'warning',icon:'📋',
      msg:'عقد ينتهي قريباً: '+ct.name,sub:'متبقي '+daysLeft+' يوم'});
  });

  // 2. مستندات الموردين المنتهية
  (DB.thirdParties||[]).forEach(function(tp){
    var docs=tp.docs||{};
    ['cr','tax','vat','ins'].forEach(function(k){
      if(!docs[k]||!docs[k].exp) return;
      var daysLeft=Math.round((new Date(docs[k].exp).getTime()-todayMs)/86400000);
      var labels={cr:'سجل تجاري',tax:'بطاقة ضريبية',vat:'ض.ق.م',ins:'تأمينات'};
      if(daysLeft<0) alerts.push({level:'danger',icon:'🏭',
        msg:tp.name+' — '+labels[k]+' منتهي',sub:'انتهى منذ '+Math.abs(daysLeft)+' يوم'});
      else if(daysLeft<=60) alerts.push({level:'warning',icon:'🏭',
        msg:tp.name+' — '+labels[k]+' ينتهي',sub:'متبقي '+daysLeft+' يوم'});
    });
  });

  // 3. قيود بمستندات ناقصة (آخر 30 يوم)
  var cutoff=new Date(todayMs-30*86400000).toISOString().split('T')[0];
  var missingDocs=(DB.entries||[]).filter(function(e){
    return e.status==='posted' && e.date>=cutoff &&
      (DB.archiveLog[e.id]||{}).status==='missing';
  });
  if(missingDocs.length) alerts.push({level:'warning',icon:'📎',
    msg:'قيود بمستندات ناقصة: '+missingDocs.length+' قيد',
    sub:'آخر 30 يوم — اضغط للأرشيف',action:"sub('archive')"});

  // 4. إجازات بانتظار الموافقة
  var pendingLeaves=(DB.leaveRequests||[]).filter(function(l){return l.status==='pending';});
  if(pendingLeaves.length) alerts.push({level:'info',icon:'🌴',
    msg:'طلبات إجازة تنتظر الموافقة: '+pendingLeaves.length,
    sub:'اضغط للمراجعة',action:"sub('leaveapproval')"});

  // 5. موازنة مشروع تجاوزت 90%
  (DB.projects||[]).forEach(function(pr){
    if(!pr.budget||pr.budget<=0) return;
    var spent=(DB.entries||[]).filter(function(e){
      return e.status==='posted'&&e.proj===pr.name;
    }).reduce(function(s,e){
      return s+(e.lines||[]).reduce(function(ss,l){
        return ss+(l.acc&&l.acc[0]==='5'?l.dr||0:0);
      },0);
    },0);
    var pct=Math.round(spent/pr.budget*100);
    if(pct>=100) alerts.push({level:'danger',icon:'🎯',
      msg:'تجاوز الموازنة: '+pr.name,sub:'صرف '+pct+'% من الموازنة'});
    else if(pct>=90) alerts.push({level:'warning',icon:'🎯',
      msg:'تحذير موازنة: '+pr.name,sub:'صرف '+pct+'% من الموازنة'});
  });

  // 5b. مواعيد تقارير المنح
  (DB.grantFiles||[]).forEach(function(gf){
    (gf.deadlines||[]).forEach(function(dl){
      if(dl.submitted||!dl.dueDate) return;
      var daysLeft=Math.round((new Date(dl.dueDate).getTime()-todayMs)/86400000);
      if(daysLeft<0) alerts.push({level:'danger',icon:'📅',
        msg:'موعد تقرير متأخر: '+dl.label,
        sub:gf.projName+' — متأخر '+Math.abs(daysLeft)+' يوم',
        action:"sub('grantfiles')"});
      else if(daysLeft<=14) alerts.push({level:'danger',icon:'📋',
        msg:'موعد تقرير عاجل: '+dl.label,
        sub:gf.projName+' — متبقي '+daysLeft+' يوم',
        action:"sub('grantfiles')"});
      else if(daysLeft<=30) alerts.push({level:'warning',icon:'📋',
        msg:'موعد تقرير قادم: '+dl.label,
        sub:gf.projName+' — متبقي '+daysLeft+' يوم',
        action:"sub('grantfiles')"});
    });
  });

  // 6. تسوية بنكية متأخرة (آخر تسوية أكثر من 35 يوم)
  var bankAccs=getBankAccounts();
  bankAccs.forEach(function(acc){
    var lastR=(DB.bankRecons||[]).filter(function(r){return r.accCode===acc.c&&r.closed;})
      .sort(function(a,b){return b.month>a.month?1:-1;})[0];
    if(lastR){
      var lastDate=new Date(lastR.month+'-28').getTime();
      var daysSince=Math.round((todayMs-lastDate)/86400000);
      if(daysSince>35) alerts.push({level:'info',icon:'🏦',
        msg:'تسوية بنكية متأخرة: '+acc.n,
        sub:'آخر تسوية '+lastR.month+' ('+daysSince+' يوم)',
        action:"sub('banks')"});
    }
  });

  return alerts;
}

// ---- init ----
function initTP(){
  if(!DB.thirdParties)DB.thirdParties=[];
  // Auto-seed employees as third parties if not already there
  (DB.employees||[]).forEach(function(e){
    var id="EMP-"+e.id;
    if(!DB.thirdParties.find(function(t){return t.id===id;})){
      DB.thirdParties.push({id:id,name:e.name,type:"employee",ref:e.id,active:true});
    }
  });
  // Auto-seed suppliers
  (DB.suppliers||[]).forEach(function(s){
    var id="SUP-"+s.id;
    if(!DB.thirdParties.find(function(t){return t.id===id;})){
      DB.thirdParties.push({id:id,name:s.name,type:"supplier",ref:s.id,active:true});
    }
  });
}

// ---- collect third-party from lines ----
function collectTP(prefix, lineCount){
  // prefix = "e" for new, "ed" for edit
  var tpField = prefix==="e" ? "etp-" : "etp-";
  var lines=[];
  for(var i=0;i<lineCount;i++){
    var s=el("ea-"+i)||el((prefix==="ed"?"ea-":"")+i);
    var acc = s ? s.value : "";
    var dr=parseFloat((el("edr-"+i)||{}).value)||0;
    var cr=parseFloat((el("ecr-"+i)||{}).value)||0;
    if(!acc||(dr===0&&cr===0)) continue;
    var a=DB.accounts.find(function(x){return x.c===acc;});
    var tpEl=el("etp-"+i);
    var tpId=tpEl?tpEl.value:"";
    var tp=tpId?DB.thirdParties.find(function(t){return t.id===tpId;}):null;
    var ccEl=el("ecc-"+i);
    var ccVal=ccEl?ccEl.value:"";
    lines.push({
      acc:acc, an:a?a.n:"", dr:dr, cr:cr,
      tpId: tp?tp.id:"",
      tpName: tp?tp.name:"",
      tpType: tp?tp.type:"",
      cc: ccVal
    });
  }
  return lines;
}

  var entries=(DB.entries||[]).filter(function(e){return e.status==='posted';});
  var lines=[];

  entries.forEach(function(e){
    e.lines.forEach(function(l){
      var match=false;
      if(opts.customFilter) match=opts.customFilter(e,l);
      else if(opts.accCode)  match=(l.acc===opts.accCode);
      else if(opts.accPrefix) match=(l.acc&&l.acc[0]===opts.accPrefix);
      else if(opts.proj) match=(l.proj===opts.proj||e.proj===opts.proj);
      else match=true;

      if(!match) return;
      if(opts.fromDate&&e.date<opts.fromDate) return;
      if(opts.toDate&&e.date>opts.toDate) return;
      if(opts.side==='dr'&&!(l.dr>0)) return;
      if(opts.side==='cr'&&!(l.cr>0)) return;

      var acc=DB.accounts.find(function(a){return a.c===l.acc;})||{n:l.acc};
      lines.push({
        date:e.date, entryId:e.id, desc:e.desc, ref:e.ref||'',
        acc:l.acc, accName:acc.n,
        dr:l.dr||0, cr:l.cr||0,
        proj:l.proj||e.proj||'',
      });
    });
  });

  // Sort by date
  lines.sort(function(a,b){return a.date>b.date?1:-1;});

  var totDr=lines.reduce(function(s,l){return s+l.dr;},0);
  var totCr=lines.reduce(function(s,l){return s+l.cr;},0);

  var h='';
  // Summary
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;">';
  h+='<div style="background:#f0f9ff;border-radius:9px;padding:10px;text-align:center;">';
  h+='<div style="font-size:10px;color:var(--g4);">عدد الحركات</div>';
  h+='<div style="font-weight:900;font-size:18px;color:var(--nd);">'+lines.length+'</div></div>';
  h+='<div style="background:#f0fdf4;border-radius:9px;padding:10px;text-align:center;">';
  h+='<div style="font-size:10px;color:var(--g4);">إجمالي مدين</div>';
  h+='<div style="font-weight:900;font-size:15px;color:#059669;">'+fmt(totDr)+'</div></div>';
  h+='<div style="background:#fff5f5;border-radius:9px;padding:10px;text-align:center;">';
  h+='<div style="font-size:10px;color:var(--g4);">إجمالي دائن</div>';
  h+='<div style="font-weight:900;font-size:15px;color:#dc2626;">'+fmt(totCr)+'</div></div>';
  h+='</div>';

  if(!lines.length){
    h+='<div style="text-align:center;padding:20px;color:var(--g4);">لا توجد حركات</div>';
    om(opts.title||'تحليل', h); return;
  }

  // Table
  h+='<div style="overflow-x:auto;max-height:65vh;overflow-y:auto;">';
  h+='<table style="width:100%;font-size:11px;border-collapse:collapse;">';
  h+='<thead style="position:sticky;top:0;"><tr style="background:var(--nd);color:white;">'
    +'<th style="padding:7px 6px;text-align:right;white-space:nowrap;">التاريخ</th>'
    +'<th style="text-align:right;">رقم القيد</th>'
    +'<th style="text-align:right;">البيان</th>'
    +'<th style="text-align:right;">الحساب</th>'
    +'<th style="text-align:right;">المشروع</th>'
    +'<th style="text-align:left;">مدين</th>'
    +'<th style="text-align:left;">دائن</th>'
    +'</tr></thead><tbody>';

  lines.forEach(function(l){
    h+='<tr style="border-bottom:1px solid #f1f5f9;cursor:pointer;" '
      +'onmouseover="this.style.background=\'#f0f9ff\'" onmouseout="this.style.background=\'\'" '
      +'data-eid="'+l.entryId+'" onclick="viewE(this.dataset.eid)">'
      +'<td style="padding:5px 6px;white-space:nowrap;">'+l.date+'</td>'
      +'<td style="color:var(--sk);font-weight:700;">'+l.entryId+'</td>'
      +'<td style="color:#475569;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+l.desc+'</td>'
      +'<td style="font-size:10px;color:var(--g4);">'+l.acc+' '+l.accName+'</td>'
      +'<td style="font-size:10px;color:var(--g4);">'+(l.proj||'—')+'</td>'
      +'<td style="text-align:left;font-weight:700;color:#059669;">'+(l.dr>0?fmt(l.dr):'—')+'</td>'
      +'<td style="text-align:left;font-weight:700;color:#dc2626;">'+(l.cr>0?fmt(l.cr):'—')+'</td>'
      +'</tr>';
  });

  // Totals row
  h+='<tr style="background:var(--nd);color:white;font-weight:900;">'
    +'<td colspan="5" style="padding:7px 6px;">الإجمالي ('+lines.length+' حركة)</td>'
    +'<td style="padding:7px;text-align:left;">'+fmt(totDr)+'</td>'
    +'<td style="text-align:left;">'+fmt(totCr)+'</td>'
    +'</tr>';
  h+='</tbody></table></div>';

  om(opts.title||'تحليل', h);
}

// ---- calc TP balance ----
function calcTPBal(tpId){
  var dr=0,cr=0;
  (DB.entries||[]).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.tpId===tpId){dr+=l.dr||0;cr+=l.cr||0;}
    });
  });
  return {dr:dr,cr:cr,net:dr-cr};
}

function buildTPLedgerTable(tpId,fromD,toD){
  var rows=[];
  (DB.entries||[]).forEach(function(e){
    if(fromD&&e.date<fromD)return;
    if(toD&&e.date>toD)return;
    (e.lines||[]).forEach(function(l){
      if(l.tpId!==tpId)return;
      rows.push({date:e.date,ref:e.ref,desc:e.desc,proj:e.proj,acc:l.acc,an:l.an,dr:l.dr||0,cr:l.cr||0,entryId:e.id});
    });
  });

  rows.sort(function(a,b){return a.date<b.date?-1:1;});

  if(!rows.length) return '<div style="text-align:center;color:var(--g4);padding:20px;">لا توجد حركات'+(fromD||toD?" في هذه الفترة":"")+'</div>';

  var tDr=0,tCr=0,runBal=0;
  var h='<div style="overflow-x:auto;"><table><thead><tr>';
  h+='<th>التاريخ</th><th>المرجع</th><th>البيان</th><th>الحساب</th><th>مدين</th><th>دائن</th><th>الرصيد</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    tDr+=r.dr;tCr+=r.cr;
    runBal+=r.dr-r.cr;
    var balAbs=Math.abs(runBal);
    var balDir=runBal===0?"":runBal>0?" م":" د";
    h+='<tr>';
    h+='<td style="font-size:11px;white-space:nowrap;">'+r.date+'</td>';
    h+='<td style="font-size:11px;color:var(--sk);">'+r.ref+'</td>';
    h+='<td style="font-size:11px;">'+r.desc+'</td>';
    h+='<td style="font-size:10.5px;"><code style="background:var(--g1);padding:1px 5px;border-radius:4px;">'+r.acc+'</code><div style="font-size:10px;color:var(--g4);">'+r.an+'</div></td>';
    h+='<td class="tn" style="color:var(--n);font-weight:700;">'+(r.dr>0?fmt(r.dr):"-")+'</td>';
    h+='<td class="tn" style="color:var(--gr);font-weight:700;">'+(r.cr>0?fmt(r.cr):"-")+'</td>';
    h+='<td class="tn" style="font-weight:800;">'+fmt(balAbs)+balDir+'</td>';
    h+='</tr>';
  });
  h+='</tbody><tfoot><tr style="background:var(--n);">';
  h+='<td colspan="4" style="color:white;font-weight:900;padding:9px;">الإجمالي</td>';
  h+='<td class="tn" style="color:white;font-weight:900;padding:9px;">'+fmt(tDr)+'</td>';
  h+='<td class="tn" style="color:white;font-weight:900;padding:9px;">'+fmt(tCr)+'</td>';
  var netAbs=Math.abs(tDr-tCr);
  var netLbl=tDr-tCr===0?"متوازن":tDr-tCr>0?" مدين":" دائن";
  h+='<td class="tn" style="color:white;font-weight:900;padding:9px;">'+fmt(netAbs)+netLbl+'</td>';
  h+='</tr></tfoot></table></div>';
  return h;
}

// ---- Sync employees/suppliers to TP ----
function syncTPFromHR(){
  initTP();
  var added=0;
  (DB.employees||[]).forEach(function(e){
    var id="EMP-"+e.id;
    if(!DB.thirdParties.find(function(t){return t.id===id;})){
      DB.thirdParties.push({id:id,name:e.name,type:"employee",ref:e.id,active:e.status==="active"});
      added++;
    } else {
      // Update name and status
      var tp=DB.thirdParties.find(function(t){return t.id===id;});
      if(tp){tp.name=e.name;tp.active=e.status==="active";}
    }
  });
  (DB.suppliers||[]).forEach(function(s){
    var id="SUP-"+s.id;
    if(!DB.thirdParties.find(function(t){return t.id===id;})){
      DB.thirdParties.push({id:id,name:s.name,type:"supplier",ref:s.id,active:true});
      added++;
    } else {
      var tp=DB.thirdParties.find(function(t){return t.id===id;});
      if(tp) tp.name=s.name;
    }
  });
  save();
  return added;
}

function saveE(){
  if(!requirePerm("canEditEntries","المحاسب لا يمكنه إدخال قيود"))return;
  var dt=sv("e-d")||new Date().toISOString().split("T")[0];
  if(!checkPeriodLock(dt))return;
  var lines=collectTP("e",_eL);
  if(lines.length<2){toast("⚠️ القيد يحتاج سطرين على الأقل");return;}
  var tD=lines.reduce(function(s,l){return s+(l.dr||0);},0);
  var tC=lines.reduce(function(s,l){return s+(l.cr||0);},0);
  if(Math.abs(tD-tC)>0.01){toast("⚠️ القيد غير متوازن — فرق: "+fmt(Math.abs(tD-tC)));return;}

  // ── Auto-generate WHT lines for 3rd parties ─────────────────
  // For each line with a tpId that has a whtRate — add WHT deduction line
  var autoWHTLines=[];
  lines.forEach(function(ln){
    if(!ln.tpId) return;
    var tp=DB.thirdParties.find(function(t){return t.id===ln.tpId;});
    if(!tp||!tp.taxId||!tp.whtRate) return;
    var grossAmt=ln.dr||0;
    if(!grossAmt) return;
    var rate=tp.whtRate/100;
    var whtAmt=Math.round(grossAmt*rate/(1+rate)*100)/100;
    if(!whtAmt) return;
    // Check if WHT line already exists manually (avoid duplicate)
    var exists=lines.some(function(l){
      return (l.acc==='2114'||l.acc.startsWith('2114'))&&Math.abs(l.cr-whtAmt)<0.1;
    });
    if(exists) return;
    var wa=getWHTAccount(tp.whtRate);
    autoWHTLines.push({
      acc:wa.acc,an:wa.name,dr:0,cr:whtAmt,
      proj:ln.proj||'',cc:ln.cc||'',tpId:'',tpName:'',tpType:'',
      autoGenerated:true
    });
    // Also reduce the bank/cash line by whtAmt (adjust last cr line)
    for(var k=lines.length-1;k>=0;k--){
      if((lines[k].acc.startsWith('111')||lines[k].acc.startsWith('112'))&&lines[k].cr>0){
        lines[k].cr=Math.round((lines[k].cr-whtAmt)*100)/100;
        break;
      }
    }
  });
  if(autoWHTLines.length) lines=lines.concat(autoWHTLines);

  // ── Budget enforcement check ─────────────────────────────────
  var cfg=DB.sysSettings||{enforceBudget:true,budgetWarningPct:90};
  if(cfg.enforceBudget!==false){
    var projWarnings=[];
    lines.forEach(function(ln){
      if(!ln.proj) return;
      var proj=DB.projects.find(function(p){return p.code===ln.proj;});
      if(!proj||!proj.budget) return;
      var spent=getProjectSpent(proj.code);
      var newSpent=spent+(ln.dr||0)-(ln.cr||0);
      if(newSpent>proj.budget){
        projWarnings.push('❌ المشروع "'+proj.name+'" — سيتجاوز الموازنة!\n   الموازنة: '+fmt(proj.budget)+' | الصرف الحالي: '+fmt(spent)+' | بعد القيد: '+fmt(newSpent));
      } else if(newSpent>(proj.budget*(cfg.budgetWarningPct||90)/100)){
        projWarnings.push('⚠️ تحذير: المشروع "'+proj.name+'" وصل '+Math.round(newSpent/proj.budget*100)+'% من الموازنة');
      }
    });
    if(projWarnings.length){
      var overBudget=projWarnings.some(function(w){return w.startsWith('❌');});
      if(overBudget){
        toast('❌ رُفض القيد: تجاوز موازنة مشروع\n'+projWarnings.join('\n'));
        return;
      } else {
        if(!confirm(projWarnings.join('\n')+'\n\nهل تريد المتابعة؟')) return;
      }
    }
  }
  var desc=sv("e-ds");if(!desc){toast("⚠️ البيان مطلوب");return;}
  var id="J"+new Date().getFullYear()+"-"+String(Date.now()).slice(-6);
  // Determine primary project from lines
  var primaryProj=(lines.find(function(l){return l.proj;})||{}).proj||"";
  DB.entries.push({
    id:id,date:dt,ref:sv("e-r")||id,desc:sv("e-ds")||"قيد محاسبي",
    proj:primaryProj,costCenter:sv("e-cc"),location:sv("e-loc"),
    activity:sv("e-act"),docType:sv("e-dt"),payMethod:sv("e-pm"),
    lines:lines,status:"posted",contractId:sv('e-contract')||''
  });
  save();cm();rJour();rDash();
  toast("✅ تم ترحيل القيد "+id);
}

function rProj(){
  var h='<div class="ph"><div><div class="ph-t">🎯 المشروعات</div>';

    h+='<div class="st" style="padding:10px;"><div style="font-size:10.5px;color:var(--g4);">الصرف</div><div style="font-weight:800;font-size:14px;color:var(--rd);">'+fmt(spent)+'</div></div>';
    h+='<div class="st" style="padding:10px;"><div style="font-size:10.5px;color:var(--g4);">المتبقي</div><div style="font-weight:800;font-size:14px;color:'+(rem>=0?"var(--gr)":"var(--rd)")+';">'+fmt(Math.abs(rem))+'</div></div>';

function saveNewProj(){
  var code=(document.getElementById('np-code')||{}).value||'';
  var name=(document.getElementById('np-name')||{}).value||'';
  if(!code){toast('⚠️ كود المشروع مطلوب');return;}
  if(!name){toast('⚠️ اسم المشروع مطلوب');return;}
  if(DB.projects.find(function(p){return p.code===code;})){toast('⚠️ كود المشروع موجود بالفعل');return;}
  var proj={
    code:code, name:name,
    donor:(document.getElementById('np-donor')||{}).value||'',
    start:(document.getElementById('np-start')||{}).value||'',
    end:(document.getElementById('np-end')||{}).value||'',
    budget:parseFloat((document.getElementById('np-budget')||{}).value)||0,
    status:(document.getElementById('np-status')||{}).value||'active',
    desc:(document.getElementById('np-desc')||{}).value||'',
    spent:0
  };
  DB.projects.push(proj);
  save();cm();rProj();
  toast('✅ تم حفظ المشروع: '+proj.name);
}

function openPayslipModal(){

    return '<option value="'+e.id+'">'+e.name+' — '+e.pos+'</option>';
  }).join("");

  // Build month options (current month + last 11 months)
  var now=new Date();
  var monthOpts="";
  for(var i=0;i<12;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var key=d.getFullYear()+"-"+(d.getMonth()+1).toString().padStart(2,"0");

function printPayslip(empId, monthKey){
  var e=DB.employees.find(function(x){return x.id===empId;});

var _payScope="all";
function setPayScope(scope){
  _payScope=scope;
  ["all","dept","single"].forEach(function(s){
    var el2=document.getElementById("pay-scope-"+s);
    if(el2){
      el2.style.background=s===scope?"var(--n)":"var(--g1)";
      el2.style.color=s===scope?"white":"var(--n)";
    }
  });
  var deptRow=document.getElementById("pay-dept-row");
  var singleRow=document.getElementById("pay-single-row");
  if(deptRow)deptRow.style.display=scope==="dept"?"block":"none";
  if(singleRow)singleRow.style.display=scope==="single"?"block":"none";
  var varSection=document.getElementById("pay-var-section");
  if(varSection)varSection.style.display=scope==="single"?"block":"none";
  refreshPayPreview();
}

function getالمرتباتEmps(scope,empId,dept){
  var active=DB.employees.filter(function(e){return e.status==="active";});
  if(scope==="single"&&empId) return active.filter(function(e){return e.id===empId;});
  if(scope==="dept"&&dept) return active.filter(function(e){return (e.dept||"غير محدد")===dept;});

}

  // Check period lock
  if(!checkPeriodLock(payDate)) return;

  var monthKey=year+"-"+month;

  // Check duplicate for "all" scope
  if(scope==="all"){
    var dup=(DB.payrollHistory||[]).find(function(p){return p.monthKey===monthKey&&p.scope==="all";});
    if(dup&&!confirm("تم إعداد إعداد المرتبات لشهر "+monthName+" "+year+" بالفعل. هل تريد إعداده مرة أخرى؟"))return;
  }

  // Calculate totals using variable components
  var tot={gross:0,empI:0,emplI:0,tax:0,mar:0,net:0,cost:0,totalDed:0};
  var payMonth=parseInt(month)||1;
  emps.forEach(function(e){
    var ov=getEmpOverride(e.id,monthKey);
    ov.currentMonth=payMonth;
    // Cumulative: calculate tax already paid this year for this employee
    if((DB.taxConfig&&DB.taxConfig.taxCalcMode)==='cumulative'){
      var taxPaid=0;
      (DB.payrollHistory||[]).filter(function(h){
        return h.empId===e.id&&h.monthKey<monthKey;
      }).forEach(function(h){taxPaid+=h.empTax||0;});
      ov.taxPaidSoFar=taxPaid;
    }
    var r=calcFull(e,ov);
    Object.keys(tot).forEach(function(k){if(r[k]!==undefined)tot[k]+=r[k];});
  });

  // Build journal entry
  var entryId="PAY-"+monthKey+(scope==="single"?"-"+empId:scope==="dept"?"-"+dept.substring(0,4):"");
  // Prevent duplicate ID
  if((DB.entries||[]).find(function(e){return e.id===entryId;})){
    entryId=entryId+"-"+Date.now().toString().slice(-4);
  }

  var entryDesc=(scope==="all"?"إعداد مرتب مرتبات ":scope==="dept"?"مرتبات قسم "+dept+" — ":"مرتب "+(emps[0].name)+" — ")+monthName+" "+year+(notes?" — "+notes:"");

  var bankAccObj=DB.accounts.find(function(a){return a.c===bankAcc;})||{n:"البنك"};

  // Build lines - detailed per employee for single, summary for group
  var lines=[];

  if(scope==="single"&&emps.length===1){
    // Detailed single employee
    var e=emps[0];var ov0=getEmpOverride(e.id,monthKey);var r=calcFull(e,ov0);
    lines.push({acc:"5211",an:"رواتب وأجور العاملين",dr:r.gross,cr:0,tpId:"EMP-"+e.id,tpName:e.name,wbsCode:wbsCode});
    if(r.emplI>0) lines.push({acc:"5213",an:"اشتراكات التأمينات الاجتماعية (حصة صاحب العمل)",dr:r.emplI,cr:0,tpId:"EMP-"+e.id,tpName:e.name,wbsCode:wbsCode});
    if(r.empI>0)  lines.push({acc:"2113",an:"مستحقات تأمينات اجتماعية",dr:0,cr:r.empI});
    if(r.tax>0)   lines.push({acc:"2114",an:"ضرائب مستحقة (خصم وتحصيل)",dr:0,cr:r.tax});
    if(r.totalDed>0) lines.push({acc:"2115",an:"خصومات وجزاءات محجوزة"+(ov0.dedNote?" — "+ov0.dedNote:""),dr:0,cr:r.totalDed});
    lines.push({acc:bankAcc,an:bankAccObj.n,dr:0,cr:r.net,tpId:"EMP-"+e.id,tpName:e.name});
  } else {
    // Summary grouped entry + per-employee detail in lines
    emps.forEach(function(e){
      var ovE=getEmpOverride(e.id,monthKey);
      var r=calcFull(e,ovE);
      var varNote="";
      if(ovE.overtime>0||ovE.bonus>0||ovE.stipend>0) varNote=" (يشمل: "+(ovE.overtime>0?"إضافي "+fmt(ovE.overtime):"")+(ovE.bonus>0?" مكافأة "+fmt(ovE.bonus):"")+(ovE.stipend>0?" منحة "+fmt(ovE.stipend):"")+")";
      lines.push({acc:"5211",an:"رواتب وأجور — "+e.name+varNote,dr:r.gross,cr:0,tpId:"EMP-"+e.id,tpName:e.name,wbsCode:wbsCode});
      if(r.emplI>0) lines.push({acc:"5213",an:"تأمين صاحب العمل — "+e.name,dr:r.emplI,cr:0,tpId:"EMP-"+e.id,tpName:e.name,wbsCode:wbsCode});
    });
    // Consolidated credit lines
    if(tot.empI>0)  lines.push({acc:"2113",an:"مستحقات تأمينات اجتماعية (محجوزة من الموظفين)",dr:0,cr:tot.empI});
    if(tot.tax>0)   lines.push({acc:"2114",an:"ضرائب دخل محجوزة من الموظفين",dr:0,cr:tot.tax});
    if(tot.mar>0)   lines.push({acc:"2114",an:"صندوق الشهداء والمصابين",dr:0,cr:tot.mar});
    if(tot.totalDed>0) lines.push({acc:"2115",an:"خصومات وجزاءات محجوزة — "+monthName+" "+year,dr:0,cr:tot.totalDed});
    lines.push({acc:bankAcc,an:"صافي المرتبات المدفوعة — "+monthName+" "+year,dr:0,cr:tot.net});
  }

  var entry={
    id:entryId,date:payDate,ref:entryId,
    desc:entryDesc,proj:projCode,
    costCenter:scope==="dept"?"CC03":"CC02",
    docType:"PV",payMethod:"BANK",
    wbsCode:wbsCode,lines:lines,status:"posted"
  };

  if(!DB.entries)DB.entries=[];
  DB.entries.push(entry);

  // Save to payroll history
  if(!DB.payrollHistory)DB.payrollHistory=[];
  DB.payrollHistory.push({
    id:entryId,date:payDate,monthKey:monthKey,monthName:monthName+" "+year,
    scope:scope,dept:dept,empId:empId,empCount:emps.length,empTax:tot.tax,
    gross:tot.gross,net:tot.net,cost:tot.cost,
    entryId:entryId,
    preparedBy:(getCurrentUser()||{}).name||"النظام"
  });

  save();cm();rPay();rDash();
  toast("✅ تم إنشاء قيد مرتبات "+monthName+" "+year+" ("+emps.length+" موظف — صافي: "+fmt(tot.net)+")");
}

// ── 1. Project Transaction Report ────────────────────────────────
function rProjectTxnReport(){
  var projs=DB.projects||[];
  var h='<div class="ph-t" style="margin-bottom:14px;">📊 تقرير حركات المشروع</div>';

  // Filter form
  h+='<div style="background:white;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #e5e7eb;">';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">';
  // Project select
  h+='<div class="fg" style="margin:0;grid-column:1/-1"><label style="font-size:11px;">المشروع *</label>';
  h+='<select id="rpt-proj" onchange="updateWBSOptions()" style="font-size:12px;">';
  h+='<option value="">-- اختر مشروع --</option>';
  projs.forEach(function(pr){
    h+='<option value="'+pr.code+'">'+pr.name+'</option>';
  });
  h+='</select></div>';
  // WBS
  h+='<div class="fg" style="margin:0;grid-column:1/-1"><label style="font-size:11px;">بند WBS (اختياري)</label>';
  h+='<select id="rpt-wbs" style="font-size:12px;"><option value="">كل البنود</option></select></div>';
  // Date range
  h+='<div class="fg" style="margin:0"><label style="font-size:11px;">من تاريخ</label>';
  h+='<input type="date" id="rpt-from" style="font-size:12px;"></div>';
  h+='<div class="fg" style="margin:0"><label style="font-size:11px;">إلى تاريخ</label>';
  h+='<input type="date" id="rpt-to" style="font-size:12px;"></div>';
  h+='</div>';
  h+='<button onclick="generateProjectTxnReport()" class="btn btn-gr" style="width:100%;">📋 عرض التقرير</button>';
  h+='</div>';
  h+='<div id="proj-txn-result"></div>';
  return h;
}

function updateWBSOptions(){
  var projCode=(document.getElementById('rpt-proj')||{}).value||'';
  var sel=document.getElementById('rpt-wbs');
  if(!sel) return;
  sel.innerHTML='<option value="">كل البنود</option>';
  if(!projCode) return;
  var pr=(DB.projects||[]).find(function(p){return p.code===projCode;});
  if(!pr||!pr.wbs) return;
  (pr.wbs||[]).forEach(function(w){
    sel.innerHTML+='<option value="'+w.code+'">'+w.code+' — '+w.name+'</option>';
  });
}

function generateProjectTxnReport(){
  var projCode=(document.getElementById('rpt-proj')||{}).value||'';
  var wbsCode=(document.getElementById('rpt-wbs')||{}).value||'';
  var fromDate=(document.getElementById('rpt-from')||{}).value||'';
  var toDate=(document.getElementById('rpt-to')||{}).value||'9999-12-31';
  var el=document.getElementById('proj-txn-result');
  if(!el) return;
  if(!projCode){toast('⚠️ اختر مشروعاً');return;}

  var pr=(DB.projects||[]).find(function(p){return p.code===projCode;});
  if(!pr){el.innerHTML='<div style="color:#dc2626;">المشروع غير موجود</div>';return;}

  // Filter entries
  var entries=(DB.entries||[]).filter(function(e){
    if(e.status!=='posted') return false;
    if(e.proj!==projCode) return false;
    if(wbsCode){var hw=(e.wbs===wbsCode)||(e.lines||[]).some(function(l){return l.wbs===wbsCode||l.cc===wbsCode;});if(!hw)return false;}
    if(fromDate&&e.date<fromDate) return false;
    if(toDate&&e.date>toDate) return false;
    return true;
  }).sort(function(a,b){return a.date>b.date?1:-1;});

  // If WBS filter -- filter lines
  if(wbsCode){
    entries=entries.filter(function(e){
      return (e.lines||[]).some(function(l){return l.wbs===wbsCode||l.cc===wbsCode;});
    });
  }

  if(!entries.length){
    el.innerHTML='<div style="text-align:center;padding:30px;color:var(--g4);">لا توجد قيود في النطاق المحدد</div>';
    return;
  }

  // Calculate totals
  var totalDr=0,totalCr=0;
  entries.forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(!wbsCode||l.wbs===wbsCode||l.cc===wbsCode){
        totalDr+=l.dr||0; totalCr+=l.cr||0;
      }
    });
  });

  var wbsLabel=wbsCode?(pr.wbs||[]).find(function(w){return w.code===wbsCode;}):'';
  var h='';

  // Header card
  h+='<div style="background:var(--nd);color:white;border-radius:12px;padding:14px;margin-bottom:12px;">';
  h+='<div style="font-weight:800;font-size:14px;margin-bottom:4px;">'+pr.name+'</div>';
  if(wbsLabel) h+='<div style="font-size:11px;opacity:.8;">📂 '+wbsLabel.code+' — '+wbsLabel.name+'</div>';
  h+='<div style="font-size:11px;opacity:.7;">'+(fromDate||'البداية')+' → '+(toDate==='9999-12-31'?'اليوم':toDate)+'</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;">';
  h+='<div style="text-align:center;"><div style="font-weight:900;font-size:16px;">'+entries.length+'</div><div style="font-size:9px;opacity:.7;">قيد</div></div>';
  h+='<div style="text-align:center;"><div style="font-weight:900;font-size:13px;">'+fmt(totalDr)+'</div><div style="font-size:9px;opacity:.7;">إجمالي مدين</div></div>';
  h+='<div style="text-align:center;"><div style="font-weight:900;font-size:13px;">'+fmt(totalCr)+'</div><div style="font-size:9px;opacity:.7;">إجمالي دائن</div></div>';
  h+='</div></div>';

  // Print button
  h+='<div style="display:flex;gap:8px;margin-bottom:10px;">';
  h+='<button onclick="printProjectTxnReport()" class="btn btn-gr" style="flex:1;font-size:11px;">🖨️ طباعة</button>';
  h+='</div>';

  // Transactions table
  h+='<div style="background:white;border-radius:12px;overflow:hidden;">';
  h+='<table style="width:100%;font-size:11px;border-collapse:collapse;">';
  h+='<thead><tr style="background:var(--nd);color:white;">';
  h+='<th style="padding:8px;text-align:right;">التاريخ</th>';
  h+='<th>رقم القيد</th><th>البيان</th><th>المرجع</th>';
  h+='<th style="text-align:left;">مدين</th>';
  h+='<th style="text-align:left;">دائن</th>';
  h+='</tr></thead><tbody>';

  var runningBal=0;
  entries.forEach(function(e,idx){
    var eDr=0,eCr=0;
    (e.lines||[]).forEach(function(l){
      if(!wbsCode||l.wbs===wbsCode||l.cc===wbsCode){
        eDr+=l.dr||0; eCr+=l.cr||0;
      }
    });
    runningBal+=eDr-eCr;
    var bg=idx%2===0?'white':'#f9fafb';
    h+='<tr style="border-bottom:1px solid #f1f5f9;background:'+bg+';cursor:pointer;" data-eid="'+e.id+'" onclick="viewE(this.dataset.eid)">';
    h+='<td style="padding:7px;white-space:nowrap;">'+e.date+'</td>';
    h+='<td style="color:var(--sk);font-weight:700;">'+e.id+'</td>';
    h+='<td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+e.desc+'</td>';
    h+='<td style="color:var(--g4);font-size:10px;">'+( e.ref||'—')+'</td>';
    h+='<td style="text-align:left;font-weight:700;color:#059669;">'+(eDr>0?fmt(eDr):'—')+'</td>';
    h+='<td style="text-align:left;font-weight:700;color:#dc2626;">'+(eCr>0?fmt(eCr):'—')+'</td>';
    h+='</tr>';
  });

  // Totals row
  h+='<tr style="background:var(--nd);color:white;font-weight:900;">';
  h+='<td colspan="4" style="padding:8px;">الإجمالي</td>';
  h+='<td style="text-align:left;padding:8px;">'+fmt(totalDr)+'</td>';
  h+='<td style="text-align:left;padding:8px;">'+fmt(totalCr)+'</td>';
  h+='</tr>';
  h+='</tbody></table></div>';

  el.innerHTML=h;
  // Store for print
  window._lastProjReport={html:h,name:pr.name,from:fromDate,to:toDate};
}

function printProjectTxnReport(){
  if(!window._lastProjReport){toast('⚠️ أنشئ التقرير أولاً');return;}
  printContent('تقرير حركات المشروع — '+window._lastProjReport.name,
    window._lastProjReport.html, false);
}

// ── 2. Account Ledger with Date Range ────────────────────────────
function rAccLedgerReport(){
  var h='<div class="ph-t" style="margin-bottom:14px;">📒 كشف حساب — دفتر الأستاذ</div>';

  h+='<div style="background:white;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #e5e7eb;">';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">';

  var groups={'1':'أصول','2':'خصوم','3':'حقوق','4':'إيرادات','5':'مصروفات'};
  var prevGroup='';
  (DB.accounts||[]).sort(function(a,b){return a.c>b.c?1:-1;}).forEach(function(acc){

    if(grp!==prevGroup){
      h+='<option disabled style="background:#f1f5f9;font-weight:700;">── '+(groups[grp]||grp)+' ──</option>';
      prevGroup=grp;
    }
    h+='<option value="'+acc.c+'">'+acc.c+' — '+acc.n+'</option>';
  });
  h+='</select></div>';

  // Date range
  h+='<div class="fg" style="margin:0"><label style="font-size:11px;">من تاريخ</label>';

  h+='<button onclick="generateAccLedger()" class="btn btn-gr" style="width:100%;">📒 عرض الكشف</button>';

  h+='<div id="ledger-result"></div>';

}

function filterAccLedgerList(q){
  var sel=document.getElementById('ledger-acc');
  if(!sel) return;
  q=q.toLowerCase().trim();
  Array.from(sel.options).forEach(function(opt){
    if(opt.disabled) return;
    opt.style.display=(!q||opt.value.includes(q)||opt.text.toLowerCase().includes(q))?'':'none';
  });
}

function generateAccLedger(){
  var sel=document.getElementById('ledger-acc');
  var accCode=sel?sel.value:'';
  var fromDate=(document.getElementById('ledger-from')||{}).value||'';
  var toDate=(document.getElementById('ledger-to')||{}).value||'9999-12-31';
  var el=document.getElementById('ledger-result');
  if(!el) return;
  if(!accCode){toast('⚠️ اختر حساباً');return;}

  var acc=(DB.accounts||[]).find(function(a){return a.c===accCode;});
  if(!acc){toast('⚠️ الحساب غير موجود');return;}

  // Opening balance (before fromDate)
  var openDr=0,openCr=0;
  if(fromDate){
    (DB.entries||[]).filter(function(e){return e.status==='posted'&&e.date<fromDate;}).forEach(function(e){
      (e.lines||[]).forEach(function(l){
        if(l.acc===accCode){openDr+=l.dr||0;openCr+=l.cr||0;}
      });
    });
  }
  var openBal=openDr-openCr;

  // Transactions in range
  var txns=[];
  (DB.entries||[]).filter(function(e){
    return e.status==='posted'&&
      (!fromDate||e.date>=fromDate)&&e.date<=toDate;
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.acc!==accCode) return;
      if((l.dr||0)+(l.cr||0)===0) return;
      // Get counterpart accounts
      var contra=(e.lines||[]).filter(function(x){return x.acc!==accCode;})
        .map(function(x){
          var ca=(DB.accounts||[]).find(function(a){return a.c===x.acc;});
          return ca?ca.n:x.acc;
        }).join(' / ');
      txns.push({
        date:e.date,id:e.id,desc:e.desc,ref:e.ref||'',
        dr:l.dr||0,cr:l.cr||0,
        tp:l.tpName||'',contra:contra,proj:e.proj||'',
        entryId:e.id
      });
    });
  });
  txns.sort(function(a,b){return a.date>b.date?1:-1;});

  if(!txns.length&&!fromDate){
    el.innerHTML='<div style="text-align:center;padding:30px;color:var(--g4);">لا توجد حركات لهذا الحساب</div>';
    return;
  }

  var totalDr=txns.reduce(function(s,t){return s+t.dr;},0);
  var totalCr=txns.reduce(function(s,t){return s+t.cr;},0);
  var closingBal=openBal+totalDr-totalCr;

  var h='';

  // Header
  h+='<div style="background:var(--nd);color:white;border-radius:12px;padding:14px;margin-bottom:12px;">';
  h+='<div style="font-weight:900;font-size:15px;">'+acc.c+' — '+acc.n+'</div>';
  h+='<div style="font-size:11px;opacity:.7;margin-top:2px;">'+(fromDate||'البداية')+' → '+(toDate==='9999-12-31'?'اليوم':toDate)+'</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;">';
  h+='<div style="text-align:center;background:rgba(255,255,255,.1);border-radius:7px;padding:7px;">';
  h+='<div style="font-size:9px;opacity:.7;">رصيد أول المدة</div>';
  h+='<div style="font-weight:900;font-size:13px;">'+fmt(openBal)+'</div></div>';
  h+='<div style="text-align:center;background:rgba(255,255,255,.1);border-radius:7px;padding:7px;">';
  h+='<div style="font-size:9px;opacity:.7;">صافي الحركة</div>';
  h+='<div style="font-weight:900;font-size:13px;">'+fmt(totalDr-totalCr)+'</div></div>';
  h+='<div style="text-align:center;background:rgba(255,255,255,.1);border-radius:7px;padding:7px;">';
  h+='<div style="font-size:9px;opacity:.7;">رصيد آخر المدة</div>';
  h+='<div style="font-weight:900;font-size:14px;">'+fmt(closingBal)+'</div></div>';
  h+='</div></div>';

  // Print button
  h+='<button onclick="printAccLedger()" class="btn btn-gr" style="width:100%;margin-bottom:10px;font-size:11px;">🖨️ طباعة الكشف</button>';

  // Ledger table
  h+='<div style="background:white;border-radius:12px;overflow:hidden;">';
  h+='<table style="width:100%;font-size:10.5px;border-collapse:collapse;">';
  h+='<thead><tr style="background:var(--nd);color:white;">';
  h+='<th style="padding:7px;text-align:right;">التاريخ</th>';
  h+='<th>رقم القيد</th><th>البيان</th>';
  h+='<th>الحسابات المقابلة</th>';
  h+='<th style="text-align:left;">مدين</th>';
  h+='<th style="text-align:left;">دائن</th>';
  h+='<th style="text-align:left;">الرصيد</th>';
  h+='</tr></thead><tbody>';

  // Opening balance row
  if(fromDate&&openBal!==0){
    h+='<tr style="background:#f0f9ff;font-weight:700;">';
    h+='<td style="padding:6px;">'+fromDate+'</td>';
    h+='<td colspan="3" style="color:var(--sk);">رصيد أول المدة</td>';
    h+='<td style="text-align:left;">'+( openBal>0?fmt(openBal):'—')+'</td>';
    h+='<td style="text-align:left;">'+( openBal<0?fmt(Math.abs(openBal)):'—')+'</td>';
    h+='<td style="text-align:left;font-weight:900;">'+fmt(openBal)+'</td>';
    h+='</tr>';
  }

  var runBal=openBal;
  txns.forEach(function(t,i){
    runBal+=t.dr-t.cr;
    var bg=i%2===0?'white':'#f9fafb';
    var balColor=runBal<0?'#dc2626':runBal>0?'#059669':'#6b7280';
    h+='<tr style="border-bottom:1px solid #f1f5f9;background:'+bg+';cursor:pointer;" data-eid="'+t.entryId+'" onclick="viewE(this.dataset.eid)">';
    h+='<td style="padding:6px;white-space:nowrap;">'+t.date+'</td>';
    h+='<td style="color:var(--sk);font-weight:700;">'+t.id+'</td>';
    h+='<td style="max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+(t.tp||t.desc)+'</td>';
    h+='<td style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g4);font-size:10px;">'+t.contra+'</td>';
    h+='<td style="text-align:left;color:#059669;">'+(t.dr>0?fmt(t.dr):'—')+'</td>';
    h+='<td style="text-align:left;color:#dc2626;">'+(t.cr>0?fmt(t.cr):'—')+'</td>';
    h+='<td style="text-align:left;font-weight:700;color:'+balColor+';">'+fmt(runBal)+'</td>';
    h+='</tr>';
  });

  // Closing balance row
  h+='<tr style="background:var(--nd);color:white;font-weight:900;">';
  h+='<td colspan="4" style="padding:8px;">رصيد آخر المدة</td>';
  h+='<td style="text-align:left;padding:8px;">'+fmt(totalDr)+'</td>';
  h+='<td style="text-align:left;padding:8px;">'+fmt(totalCr)+'</td>';
  h+='<td style="text-align:left;padding:8px;">'+fmt(closingBal)+'</td>';
  h+='</tr>';
  h+='</tbody></table></div>';

  el.innerHTML=h;
  window._lastLedger={html:h,name:acc.c+' — '+acc.n};
}

function printAccLedger(){
  if(!window._lastLedger){toast('⚠️ أنشئ الكشف أولاً');return;}
  printContent('كشف حساب — '+window._lastLedger.name, window._lastLedger.html, false);
}

function renderAccGroup(grp,groups,accounts,depth){
  // accounts belonging to this group: code starts with grp.code and is length grp.code.length+1 more
  var directAccs=accounts.filter(function(a){
    return a.c.startsWith(grp.code) && a.c.length===grp.code.length+1;
  });
  // subgroups of this group
  var subGroups=groups.filter(function(g){return g.parent===grp.code;});
  if(!directAccs.length&&!subGroups.length) return "";

  var bgColors=["var(--n)","var(--nd)","var(--sk)","var(--g2)","white"];
  var txtColors=["white","white","white","var(--n)","var(--n)"];
  var paddings=[12,10,9,8,7];
  var depth2=Math.min(depth,4);

  var h='<div style="margin-bottom:8px;">';
  // Group header
  h+='<div style="background:'+bgColors[depth2]+';color:'+txtColors[depth2]+';border-radius:9px;padding:'+paddings[depth2]+'px 14px;font-weight:800;font-size:'+(depth===0?14:depth===1?13:12)+'px;margin-bottom:'+(depth<2?6:4)+'px;display:flex;justify-content:space-between;align-items:center;">';
  h+='<span>'+(grp.icon||"")+" "+grp.label+'</span>';
  h+='<code style="font-size:10px;opacity:.65;font-weight:400;">'+grp.code+'</code>';
  h+='</div>';

  // Render sub-groups recursively
  if(subGroups.length){
    h+='<div style="padding-right:'+(depth*8+8)+'px;">';
    subGroups.forEach(function(sg){
      h+=renderAccGroup(sg,groups,accounts,depth+1);
    });
    h+='</div>';
  }

  // Render direct accounts
  if(directAccs.length){
    h+='<div style="padding-right:'+(depth*8+12)+'px;">';
    directAccs.forEach(function(a){
      h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:white;border:1px solid var(--g2);border-radius:8px;margin-bottom:4px;font-size:12px;">';
      h+='<div style="display:flex;align-items:center;gap:8px;">';
      h+='<code style="font-size:10.5px;background:var(--g1);padding:2px 7px;border-radius:5px;color:var(--n);">'+a.c+'</code>';
      h+='<span style="font-weight:600;">'+a.n+'</span>';
      h+='</div>';
      h+='<div style="display:flex;align-items:center;gap:6px;">';
      h+='<span class="badge '+(a.nat==="dr"?"bb":"bg")+'" style="font-size:9.5px;">'+(a.nat==="dr"?"مدين":"دائن")+'</span>';
      h+='</div>';
      h+='</div>';
    });
    h+='</div>';
  }

  h+='</div>';
  return h;
}

// ── Opening balances (from DB or period) ─────────────────────────
function getOpeningBals(fromDate){
  // Opening balance = balances of entries BEFORE fromDate
  var ob={};
  DB.accounts.forEach(function(a){ob[a.c]={dr:0,cr:0};});
  if(!fromDate) return ob;
  (DB.entries||[]).filter(function(e){
    return e.status==='posted' && e.date < fromDate;
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(!ob[l.acc]) ob[l.acc]={dr:0,cr:0};
      ob[l.acc].dr+=(l.dr||0);
      ob[l.acc].cr+=(l.cr||0);
    });
  });
  return ob;
}

function getPeriodBals(fromDate, toDate){
  var pb={};
  DB.accounts.forEach(function(a){pb[a.c]={dr:0,cr:0};});
  (DB.entries||[]).filter(function(e){
    if(e.status!=='posted') return false;
    if(fromDate && e.date < fromDate) return false;
    if(toDate   && e.date > toDate)   return false;
    return true;
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(!pb[l.acc]) pb[l.acc]={dr:0,cr:0};
      pb[l.acc].dr+=(l.dr||0);
      pb[l.acc].cr+=(l.cr||0);
    });
  });
  return pb;
}

function netBal(acc, b){
  var nat=acc.nat||'dr';
  var dr=b.dr||0, cr=b.cr||0;
  return nat==='dr' ? dr-cr : cr-dr;
}

  var sur=tRev-tExp;
  h+='<div style="background:'+(sur>=0?'linear-gradient(135deg,#059669,#047857)':'linear-gradient(135deg,#dc2626,#b91c1c)')+';border-radius:14px;padding:16px;color:white;display:flex;justify-content:space-between;align-items:center;">';

    h+='<div style="background:var(--rbg);border-radius:7px;padding:7px;"><div style="color:var(--g4);font-size:9.5px;">الصرف الفعلي</div><div style="font-weight:800;color:var(--rd);">'+fmt(spent)+'</div></div>';

function initApprovals(){if(!DB.approvals)DB.approvals=[];}

function initRecon(){
  if(!DB.bankRecons)DB.bankRecons=[];
  // Migrate old format: add month+closed fields
  DB.bankRecons.forEach(function(r){
    if(!r.month&&r.date) r.month=r.date.slice(0,7);
    if(r.closed===undefined) r.closed=true;
    if(!r.clearedIds) r.clearedIds=[];
    if(!r.manualItems) r.manualItems=[];
    if(!r.pendingItems) r.pendingItems=[];
  });
}

// Get all bank/cash accounts from COA (1111-1113 range + any account starting with 111x or 1112-1113)
function getBankAccounts(){
  return DB.accounts.filter(function(a){
    return a.c.startsWith('111') && a.nat==='dr';
  });
}

// Get all journal movements for a specific account
function getAccMovements(accCode, fromDate, toDate){
  var rows=[];
  (DB.entries||[]).filter(function(e){
    return e.status==='posted'
      &&(!fromDate||e.date>=fromDate)
      &&(!toDate||e.date<=toDate);
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.acc===accCode){
        rows.push({
          entryId:e.id, date:e.date, ref:e.ref, desc:e.desc,
          dr:l.dr||0, cr:l.cr||0,
          tpName:l.tpName||l.tpId||'', proj:e.proj||''
        });
      }
    });
  });
  rows.sort(function(a,b){return a.date<b.date?-1:1;});
  return rows;
}

// Calculate running balance for account up to a date
function getAccBalAtDate(accCode, upToDate){
  var dr=0,cr=0;
  (DB.entries||[]).filter(function(e){
    return e.status==='posted' && (!upToDate||e.date<=upToDate);
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.acc===accCode){dr+=l.dr||0;cr+=l.cr||0;}
    });
  });
  return {dr:dr, cr:cr, net:dr-cr}; // net = book balance (debit-natured account)
}

// ── Open Reconciliation ───────────────────────────────────────────
function openRecon(accCode){
  var acc=DB.accounts.find(function(a){return a.c===accCode;})||{c:accCode,n:accCode};
  var today=new Date().toISOString().slice(0,7); // YYYY-MM
  // Find last closed recon month
  var lastRecon=(DB.bankRecons||[]).filter(function(r){
    return r.accCode===accCode&&(r.closed||r.month);
  }).map(function(r){
    if(!r.month&&r.date) r.month=r.date.slice(0,7);
    return r;
  }).sort(function(a,b){return b.month>a.month?1:-1;})[0];
  var defaultMonth=lastRecon
    ? (function(){var d=new Date(lastRecon.month+'-01');d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,7);}())
    : today;

  var h='';
  h+='<div class="fg"><label>الحساب</label>'
    +'<div style="font-weight:800;font-size:14px;color:var(--nd);">'+acc.c+' — '+acc.n+'</div></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
  h+='<div class="fg"><label>شهر التسوية *</label>'
    +'<input type="month" id="rc-month" value="'+defaultMonth+'"></div>';
  h+='<div class="fg"><label>رصيد كشف حساب البنك *</label>'
    +'<input type="number" id="rc-bank-bal" step="0.01" placeholder="0.00"></div>';
  h+='</div>';
  h+='<button onclick="loadReconData(\''+accCode+'\')" class="btn btn-gr" style="width:100%;">📂 تحميل بيانات الشهر</button>';
  om('🔄 تسوية بنكية — '+acc.n, h);
}

// ── Load Month Data ───────────────────────────────────────────────
function loadReconData(accCode){
  var month=(document.getElementById('rc-month')||{}).value||'';
  var bankBalInput=parseFloat((document.getElementById('rc-bank-bal')||{}).value)||0;
  if(!month){toast('⚠️ اختر الشهر أولاً');return;}
  cm();
  setTimeout(function(){
    renderReconPage(accCode,month,bankBalInput);
  },50);
}

function renderReconPage(accCode,month,bankBal){
  var acc=DB.accounts.find(function(a){return a.c===accCode;})||{c:accCode,n:accCode};
  var monthStart=month+'-01';
  var monthEnd=month+'-31'; // safe upper bound

  // ── Get book balance at start of month (opening) ──────────────
  var openBal=0;
  (DB.entries||[]).filter(function(e){
    return e.status==='posted'&&e.date<monthStart;
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.acc===accCode){openBal+=(l.dr||0)-(l.cr||0);}
    });
  });

  // ── Get this month's transactions ─────────────────────────────
  var txns=[];
  (DB.entries||[]).filter(function(e){
    return e.status==='posted'&&e.date>=monthStart&&e.date<=monthEnd;
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.acc!==accCode) return;
      if((l.dr||0)+(l.cr||0)===0) return;
      txns.push({
        entryId:e.id, date:e.date, desc:e.desc,
        dr:l.dr||0, cr:l.cr||0,
        cleared:false, // will be set from saved state
      });
    });
  });
  txns.sort(function(a,b){return a.date>b.date?1:-1;});

  // ── Get pending items from previous months ────────────────────
  var prevPending=[];
  var allPrevRecons=(DB.bankRecons||[]).filter(function(r){
    return r.accCode===accCode&&r.closed&&r.month<month;
  }).sort(function(a,b){return b.month>a.month?1:-1;});

  if(allPrevRecons.length){
    // Get uncleared items from last closed recon
    var lastR=allPrevRecons[0];
    (lastR.pendingItems||[]).forEach(function(item){
      prevPending.push(item);
    });
  }

  // ── Get saved recon state for this month ─────────────────────
  var savedRecon=(DB.bankRecons||[]).find(function(r){
    return r.accCode===accCode&&r.month===month&&!r.closed;
  });
  var clearedIds=savedRecon?(savedRecon.clearedIds||[]):[];
  var manualItems=savedRecon?(savedRecon.manualItems||[]):[];
  if(bankBal===0&&savedRecon) bankBal=savedRecon.bankBal||0;

  // Apply saved cleared state
  txns.forEach(function(t){t.cleared=clearedIds.indexOf(t.entryId+t.date)>-1;});
  prevPending.forEach(function(t){t.cleared=clearedIds.indexOf('P_'+t.entryId)>-1;});

  // ── Render ────────────────────────────────────────────────────
  var pg=document.getElementById('pg-more');
  if(!pg) return;

  var h='<div style="padding:14px 14px 80px;">';
  // Header
  h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">';
  h+='<button onclick="sub(\'banks\')" style="background:var(--g1);border:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-family:Cairo,sans-serif;font-size:13px;">‹ رجوع</button>';
  h+='<div><div style="font-weight:800;font-size:15px;color:var(--nd);">🔄 تسوية — '+acc.n+'</div>';
  h+='<div style="font-size:11px;color:var(--g4);">'+month+'</div></div></div>';

  // Bank balance input
  h+='<div style="background:white;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #e5e7eb;">';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
  h+='<div class="fg" style="margin-bottom:0;"><label style="font-size:11px;">رصيد كشف حساب البنك</label>';
  h+='<input type="number" id="recon-bank-bal" value="'+bankBal+'" step="0.01" onchange="updateReconCalc()" style="font-weight:700;font-size:15px;direction:ltr;text-align:left;"></div>';
  h+='<div style="background:#f8f9fa;border-radius:8px;padding:10px;">';
  h+='<div style="font-size:10px;color:var(--g4);">الرصيد الدفتري (أول الشهر)</div>';
  h+='<div style="font-weight:800;font-size:14px;color:var(--nd);">'+fmt(openBal)+'</div></div>';
  h+='</div></div>';

  // ── Previous pending items ─────────────────────────────────────
  if(prevPending.length){
    h+='<div class="sd" style="margin-bottom:8px;">⏳ مبالغ معلقة من شهور سابقة ('+prevPending.length+')</div>';
    h+='<div style="background:white;border-radius:12px;overflow:hidden;margin-bottom:12px;border:1px solid #fde68a;">';
    h+='<table style="width:100%;font-size:11px;border-collapse:collapse;">';
    h+='<thead><tr style="background:#92400e;color:white;">';
    h+='<th style="padding:7px;width:32px;"></th>';
    h+='<th style="text-align:right;padding:7px;">التاريخ</th>';
    h+='<th style="text-align:right;">رقم القيد</th>';
    h+='<th style="text-align:right;">البيان</th>';
    h+='<th style="text-align:left;">مدين</th>';
    h+='<th style="text-align:left;">دائن</th>';
    h+='</tr></thead><tbody>';
    prevPending.forEach(function(t){
      var cid='P_'+t.entryId;
      var checked=clearedIds.indexOf(cid)>-1;
      h+='<tr style="border-bottom:1px solid #fef3c7;background:'+(checked?'#f0fdf4':'white')+'" id="row-'+cid+'">';
      h+='<td style="padding:6px;text-align:center;"><input type="checkbox" data-cid="'+cid+'" '+(checked?'checked':'')+' onchange="toggleCleared(this)" style="width:16px;height:16px;cursor:pointer;"></td>';
      h+='<td style="padding:6px;">'+t.date+'</td>';
      h+='<td style="color:var(--sk);font-weight:700;" data-eid="'+t.entryId+'" onclick="viewE(this.dataset.eid)">'+t.entryId+'</td>';
      h+='<td style="color:#475569;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+t.desc+'</td>';
      h+='<td style="text-align:left;font-weight:700;color:#059669;">'+(t.dr>0?fmt(t.dr):'—')+'</td>';
      h+='<td style="text-align:left;font-weight:700;color:#dc2626;">'+(t.cr>0?fmt(t.cr):'—')+'</td>';
      h+='</tr>';
    });
    h+='</tbody></table></div>';
  }

  // ── This month's transactions ─────────────────────────────────
  h+='<div class="sd" style="margin-bottom:8px;">📋 حركات الشهر — '+month+' ('+txns.length+' حركة)</div>';
  h+='<div style="background:white;border-radius:12px;overflow:hidden;margin-bottom:12px;border:1px solid #e5e7eb;">';
  if(!txns.length){
    h+='<div style="padding:20px;text-align:center;color:var(--g4);">لا توجد حركات هذا الشهر</div>';
  } else {
    h+='<table style="width:100%;font-size:11px;border-collapse:collapse;">';
    h+='<thead><tr style="background:var(--nd);color:white;">';
    h+='<th style="padding:7px;width:32px;"><input type="checkbox" id="chk-all" onchange="toggleAllCleared(this)" style="width:16px;height:16px;cursor:pointer;"></th>';

    txns.forEach(function(t){

      h+='<tr style="border-bottom:1px solid #f1f5f9;background:'+(t.cleared?'#f0fdf4':'white')+'" id="row-'+cid+'">';
      h+='<td style="padding:6px;text-align:center;"><input type="checkbox" data-cid="'+cid+'" '+(t.cleared?'checked':'')+' onchange="toggleCleared(this)" style="width:16px;height:16px;cursor:pointer;"></td>';

      h+='<td style="color:#475569;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+t.desc+'</td>';
      h+='<td style="text-align:left;font-weight:700;color:#059669;">'+(t.dr>0?fmt(t.dr):'—')+'</td>';
      h+='<td style="text-align:left;font-weight:700;color:#dc2626;">'+(t.cr>0?fmt(t.cr):'—')+'</td>';
      h+='</tr>';
    });
    h+='</tbody></table>';
  }
