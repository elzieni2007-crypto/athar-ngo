// ── 1. Project Transaction Report ────────────────────────────────
function rProjectTxnReport(){
  var projs=DB.projects||[];
  var h='<div class="ph-t" style="margin-bottom:14px;">📊 تقرير حركات المشروع</div>';

  // Filter form
  h+='<div style="background:white;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #e5e7eb;">';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">';
  // Project select
  h+='<div class="fg" style="margin:0;grid-column:1/-1"><label style="font-size:11px;">المشروع *</label>';
  h+='<select id="rpt-proj" onchange="updateWBSOptions()" style="font-size:12px;">';
  h+='<option value="">-- اختر مشروع --</option>';
  projs.forEach(function(pr){
    h+='<option value="'+pr.code+'">'+pr.name+'</option>';
  });
  h+='</select></div>';
  // WBS
  h+='<div class="fg" style="margin:0;grid-column:1/-1"><label style="font-size:11px;">بند WBS (اختياري)</label>';
  h+='<select id="rpt-wbs" style="font-size:12px;"><option value="">كل البنود</option></select></div>';
  // Date range
  h+='<div class="fg" style="margin:0"><label style="font-size:11px;">من تاريخ</label>';
  h+='<input type="date" id="rpt-from" style="font-size:12px;"></div>';
  h+='<div class="fg" style="margin:0"><label style="font-size:11px;">إلى تاريخ</label>';
  h+='<input type="date" id="rpt-to" style="font-size:12px;"></div>';
  h+='</div>';
  h+='<button onclick="generateProjectTxnReport()" class="btn btn-gr" style="width:100%;">📋 عرض التقرير</button>';
  h+='</div>';
  h+='<div id="proj-txn-result"></div>';
  return h;
}

function updateWBSOptions(){
  var projCode=(document.getElementById('rpt-proj')||{}).value||'';
  var sel=document.getElementById('rpt-wbs');
  if(!sel) return;
  sel.innerHTML='<option value="">كل البنود</option>';
  if(!projCode) return;
  var pr=(DB.projects||[]).find(function(p){return p.code===projCode;});
  if(!pr||!pr.wbs) return;
  (pr.wbs||[]).forEach(function(w){
    sel.innerHTML+='<option value="'+w.code+'">'+w.code+' — '+w.name+'</option>';
  });
}

function generateProjectTxnReport(){
  var projCode=(document.getElementById('rpt-proj')||{}).value||'';
  var wbsCode=(document.getElementById('rpt-wbs')||{}).value||'';
  var fromDate=(document.getElementById('rpt-from')||{}).value||'';
  var toDate=(document.getElementById('rpt-to')||{}).value||'9999-12-31';
  var el=document.getElementById('proj-txn-result');
  if(!el) return;
  if(!projCode){toast('⚠️ اختر مشروعاً');return;}

  var pr=(DB.projects||[]).find(function(p){return p.code===projCode;});
  if(!pr){el.innerHTML='<div style="color:#dc2626;">المشروع غير موجود</div>';return;}

  // Filter entries
  var entries=(DB.entries||[]).filter(function(e){
    if(e.status!=='posted') return false;
    if(e.proj!==projCode) return false;
    if(wbsCode){var hw=(e.wbs===wbsCode)||(e.lines||[]).some(function(l){return l.wbs===wbsCode||l.cc===wbsCode;});if(!hw)return false;}
    if(fromDate&&e.date<fromDate) return false;
    if(toDate&&e.date>toDate) return false;
    return true;
  }).sort(function(a,b){return a.date>b.date?1:-1;});

  // If WBS filter -- filter lines
  if(wbsCode){
    entries=entries.filter(function(e){
      return (e.lines||[]).some(function(l){return l.wbs===wbsCode||l.cc===wbsCode;});
    });
  }

  if(!entries.length){
    el.innerHTML='<div style="text-align:center;padding:30px;color:var(--g4);">لا توجد قيود في النطاق المحدد</div>';
    return;
  }

  // Calculate totals
  var totalDr=0,totalCr=0;
  entries.forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(!wbsCode||l.wbs===wbsCode||l.cc===wbsCode){
        totalDr+=l.dr||0; totalCr+=l.cr||0;
      }
    });
  });

  var wbsLabel=wbsCode?(pr.wbs||[]).find(function(w){return w.code===wbsCode;}):'';
  var h='';

  // Header card
  h+='<div style="background:var(--nd);color:white;border-radius:12px;padding:14px;margin-bottom:12px;">';
  h+='<div style="font-weight:800;font-size:14px;margin-bottom:4px;">'+pr.name+'</div>';
  if(wbsLabel) h+='<div style="font-size:11px;opacity:.8;">📂 '+wbsLabel.code+' — '+wbsLabel.name+'</div>';
  h+='<div style="font-size:11px;opacity:.7;">'+(fromDate||'البداية')+' → '+(toDate==='9999-12-31'?'اليوم':toDate)+'</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;">';
  h+='<div style="text-align:center;"><div style="font-weight:900;font-size:16px;">'+entries.length+'</div><div style="font-size:9px;opacity:.7;">قيد</div></div>';
  h+='<div style="text-align:center;"><div style="font-weight:900;font-size:13px;">'+fmt(totalDr)+'</div><div style="font-size:9px;opacity:.7;">إجمالي مدين</div></div>';
  h+='<div style="text-align:center;"><div style="font-weight:900;font-size:13px;">'+fmt(totalCr)+'</div><div style="font-size:9px;opacity:.7;">إجمالي دائن</div></div>';
  h+='</div></div>';

  // Print button
  h+='<div style="display:flex;gap:8px;margin-bottom:10px;">';
  h+='<button onclick="printProjectTxnReport()" class="btn btn-gr" style="flex:1;font-size:11px;">🖨️ طباعة</button>';
  h+='</div>';

  // Transactions table
  h+='<div style="background:white;border-radius:12px;overflow:hidden;">';
  h+='<table style="width:100%;font-size:11px;border-collapse:collapse;">';
  h+='<thead><tr style="background:var(--nd);color:white;">';
  h+='<th style="padding:8px;text-align:right;">التاريخ</th>';
  h+='<th>رقم القيد</th><th>البيان</th><th>المرجع</th>';
  h+='<th style="text-align:left;">مدين</th>';
  h+='<th style="text-align:left;">دائن</th>';
  h+='</tr></thead><tbody>';

  var runningBal=0;
  entries.forEach(function(e,idx){
    var eDr=0,eCr=0;
    (e.lines||[]).forEach(function(l){
      if(!wbsCode||l.wbs===wbsCode||l.cc===wbsCode){
        eDr+=l.dr||0; eCr+=l.cr||0;
      }
    });
    runningBal+=eDr-eCr;
    var bg=idx%2===0?'white':'#f9fafb';
    h+='<tr style="border-bottom:1px solid #f1f5f9;background:'+bg+';cursor:pointer;" data-eid="'+e.id+'" onclick="viewE(this.dataset.eid)">';
    h+='<td style="padding:7px;white-space:nowrap;">'+e.date+'</td>';
    h+='<td style="color:var(--sk);font-weight:700;">'+e.id+'</td>';
    h+='<td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+e.desc+'</td>';
    h+='<td style="color:var(--g4);font-size:10px;">'+( e.ref||'—')+'</td>';
    h+='<td style="text-align:left;font-weight:700;color:#059669;">'+(eDr>0?fmt(eDr):'—')+'</td>';
    h+='<td style="text-align:left;font-weight:700;color:#dc2626;">'+(eCr>0?fmt(eCr):'—')+'</td>';
    h+='</tr>';
  });

  // Totals row
  h+='<tr style="background:var(--nd);color:white;font-weight:900;">';
  h+='<td colspan="4" style="padding:8px;">الإجمالي</td>';
  h+='<td style="text-align:left;padding:8px;">'+fmt(totalDr)+'</td>';
  h+='<td style="text-align:left;padding:8px;">'+fmt(totalCr)+'</td>';
  h+='</tr>';
  h+='</tbody></table></div>';

  el.innerHTML=h;
  // Store for print
  window._lastProjReport={html:h,name:pr.name,from:fromDate,to:toDate};
}

function printProjectTxnReport(){
  if(!window._lastProjReport){toast('⚠️ أنشئ التقرير أولاً');return;}
  printContent('تقرير حركات المشروع — '+window._lastProjReport.name,
    window._lastProjReport.html, false);
}

// ── 2. Account Ledger with Date Range ────────────────────────────
function rAccLedgerReport(){
  var h='<div class="ph-t" style="margin-bottom:14px;">📒 كشف حساب — دفتر الأستاذ</div>';

  h+='<div style="background:white;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #e5e7eb;">';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">';

  // Account selector with search
  h+='<div class="fg" style="margin:0;grid-column:1/-1"><label style="font-size:11px;">الحساب *</label>';
  h+='<input id="ledger-acc-search" placeholder="🔍 ابحث بالكود أو الاسم..." oninput="filterAccLedgerList(this.value)" style="font-size:12px;margin-bottom:4px;">';
  h+='<select id="ledger-acc" size="4" style="font-size:12px;height:80px;width:100%;">';
  // Group by type
  var groups={'1':'أصول','2':'خصوم','3':'حقوق','4':'إيرادات','5':'مصروفات'};
  var prevGroup='';
  (DB.accounts||[]).sort(function(a,b){return a.c>b.c?1:-1;}).forEach(function(acc){
    var grp=acc.c[0];
    if(grp!==prevGroup){
      h+='<option disabled style="background:#f1f5f9;font-weight:700;">── '+(groups[grp]||grp)+' ──</option>';
      prevGroup=grp;
    }
    h+='<option value="'+acc.c+'">'+acc.c+' — '+acc.n+'</option>';
  });
  h+='</select></div>';

  // Date range
  h+='<div class="fg" style="margin:0"><label style="font-size:11px;">من تاريخ</label>';
  h+='<input type="date" id="ledger-from" style="font-size:12px;"></div>';
  h+='<div class="fg" style="margin:0"><label style="font-size:11px;">إلى تاريخ</label>';
  h+='<input type="date" id="ledger-to" style="font-size:12px;"></div>';
  h+='</div>';

  h+='<button onclick="generateAccLedger()" class="btn btn-gr" style="width:100%;">📒 عرض الكشف</button>';
  h+='</div>';
  h+='<div id="ledger-result"></div>';
  return h;
}

function filterAccLedgerList(q){
  var sel=document.getElementById('ledger-acc');
  if(!sel) return;
  q=q.toLowerCase().trim();
  Array.from(sel.options).forEach(function(opt){
    if(opt.disabled) return;
    opt.style.display=(!q||opt.value.includes(q)||opt.text.toLowerCase().includes(q))?'':'none';
  });
}

function generateAccLedger(){
  var sel=document.getElementById('ledger-acc');
  var accCode=sel?sel.value:'';
  var fromDate=(document.getElementById('ledger-from')||{}).value||'';
  var toDate=(document.getElementById('ledger-to')||{}).value||'9999-12-31';
  var el=document.getElementById('ledger-result');
  if(!el) return;
  if(!accCode){toast('⚠️ اختر حساباً');return;}

  var acc=(DB.accounts||[]).find(function(a){return a.c===accCode;});
  if(!acc){toast('⚠️ الحساب غير موجود');return;}

  // Opening balance (before fromDate)
  var openDr=0,openCr=0;
  if(fromDate){
    (DB.entries||[]).filter(function(e){return e.status==='posted'&&e.date<fromDate;}).forEach(function(e){
      (e.lines||[]).forEach(function(l){
        if(l.acc===accCode){openDr+=l.dr||0;openCr+=l.cr||0;}
      });
    });
  }
  var openBal=openDr-openCr;

  // Transactions in range
  var txns=[];
  (DB.entries||[]).filter(function(e){
    return e.status==='posted'&&
      (!fromDate||e.date>=fromDate)&&e.date<=toDate;
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.acc!==accCode) return;
      if((l.dr||0)+(l.cr||0)===0) return;
      // Get counterpart accounts
      var contra=(e.lines||[]).filter(function(x){return x.acc!==accCode;})
        .map(function(x){
          var ca=(DB.accounts||[]).find(function(a){return a.c===x.acc;});
          return ca?ca.n:x.acc;
        }).join(' / ');
      txns.push({
        date:e.date,id:e.id,desc:e.desc,ref:e.ref||'',
        dr:l.dr||0,cr:l.cr||0,
        tp:l.tpName||'',contra:contra,proj:e.proj||'',
        entryId:e.id
      });
    });
  });
  txns.sort(function(a,b){return a.date>b.date?1:-1;});

  if(!txns.length&&!fromDate){
    el.innerHTML='<div style="text-align:center;padding:30px;color:var(--g4);">لا توجد حركات لهذا الحساب</div>';
    return;
  }

  var totalDr=txns.reduce(function(s,t){return s+t.dr;},0);
  var totalCr=txns.reduce(function(s,t){return s+t.cr;},0);
  var closingBal=openBal+totalDr-totalCr;

  var h='';

  // Header
  h+='<div style="background:var(--nd);color:white;border-radius:12px;padding:14px;margin-bottom:12px;">';
  h+='<div style="font-weight:900;font-size:15px;">'+acc.c+' — '+acc.n+'</div>';
  h+='<div style="font-size:11px;opacity:.7;margin-top:2px;">'+(fromDate||'البداية')+' → '+(toDate==='9999-12-31'?'اليوم':toDate)+'</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;">';
  h+='<div style="text-align:center;background:rgba(255,255,255,.1);border-radius:7px;padding:7px;">';
  h+='<div style="font-size:9px;opacity:.7;">رصيد أول المدة</div>';
  h+='<div style="font-weight:900;font-size:13px;">'+fmt(openBal)+'</div></div>';
  h+='<div style="text-align:center;background:rgba(255,255,255,.1);border-radius:7px;padding:7px;">';
  h+='<div style="font-size:9px;opacity:.7;">صافي الحركة</div>';
  h+='<div style="font-weight:900;font-size:13px;">'+fmt(totalDr-totalCr)+'</div></div>';
  h+='<div style="text-align:center;background:rgba(255,255,255,.1);border-radius:7px;padding:7px;">';
  h+='<div style="font-size:9px;opacity:.7;">رصيد آخر المدة</div>';
  h+='<div style="font-weight:900;font-size:14px;">'+fmt(closingBal)+'</div></div>';
  h+='</div></div>';

  // Print button
  h+='<button onclick="printAccLedger()" class="btn btn-gr" style="width:100%;margin-bottom:10px;font-size:11px;">🖨️ طباعة الكشف</button>';

  // Ledger table
  h+='<div style="background:white;border-radius:12px;overflow:hidden;">';
  h+='<table style="width:100%;font-size:10.5px;border-collapse:collapse;">';
  h+='<thead><tr style="background:var(--nd);color:white;">';
  h+='<th style="padding:7px;text-align:right;">التاريخ</th>';
  h+='<th>رقم القيد</th><th>البيان</th>';
  h+='<th>الحسابات المقابلة</th>';
  h+='<th style="text-align:left;">مدين</th>';
  h+='<th style="text-align:left;">دائن</th>';
  h+='<th style="text-align:left;">الرصيد</th>';
  h+='</tr></thead><tbody>';

  // Opening balance row
  if(fromDate&&openBal!==0){
    h+='<tr style="background:#f0f9ff;font-weight:700;">';
    h+='<td style="padding:6px;">'+fromDate+'</td>';
    h+='<td colspan="3" style="color:var(--sk);">رصيد أول المدة</td>';
    h+='<td style="text-align:left;">'+( openBal>0?fmt(openBal):'—')+'</td>';
    h+='<td style="text-align:left;">'+( openBal<0?fmt(Math.abs(openBal)):'—')+'</td>';
    h+='<td style="text-align:left;font-weight:900;">'+fmt(openBal)+'</td>';
    h+='</tr>';
  }

  var runBal=openBal;
  txns.forEach(function(t,i){
    runBal+=t.dr-t.cr;
    var bg=i%2===0?'white':'#f9fafb';
    var balColor=runBal<0?'#dc2626':runBal>0?'#059669':'#6b7280';
    h+='<tr style="border-bottom:1px solid #f1f5f9;background:'+bg+';cursor:pointer;" data-eid="'+t.entryId+'" onclick="viewE(this.dataset.eid)">';
    h+='<td style="padding:6px;white-space:nowrap;">'+t.date+'</td>';
    h+='<td style="color:var(--sk);font-weight:700;">'+t.id+'</td>';
    h+='<td style="max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+(t.tp||t.desc)+'</td>';
    h+='<td style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g4);font-size:10px;">'+t.contra+'</td>';
    h+='<td style="text-align:left;color:#059669;">'+(t.dr>0?fmt(t.dr):'—')+'</td>';
    h+='<td style="text-align:left;color:#dc2626;">'+(t.cr>0?fmt(t.cr):'—')+'</td>';
    h+='<td style="text-align:left;font-weight:700;color:'+balColor+';">'+fmt(runBal)+'</td>';
    h+='</tr>';
  });

  // Closing balance row
  h+='<tr style="background:var(--nd);color:white;font-weight:900;">';
  h+='<td colspan="4" style="padding:8px;">رصيد آخر المدة</td>';
  h+='<td style="text-align:left;padding:8px;">'+fmt(totalDr)+'</td>';
  h+='<td style="text-align:left;padding:8px;">'+fmt(totalCr)+'</td>';
  h+='<td style="text-align:left;padding:8px;">'+fmt(closingBal)+'</td>';
  h+='</tr>';
  h+='</tbody></table></div>';

  el.innerHTML=h;
  window._lastLedger={html:h,name:acc.c+' — '+acc.n};
}

function printAccLedger(){
  if(!window._lastLedger){toast('⚠️ أنشئ الكشف أولاً');return;}
  printContent('كشف حساب — '+window._lastLedger.name, window._lastLedger.html, false);
}

  // COA hierarchy definitions
  var groups=[
    {code:"1",  label:"الأصول",                         icon:"🏦"},

function renderAccGroup(grp,groups,accounts,depth){
  // accounts belonging to this group: code starts with grp.code and is length grp.code.length+1 more
  var directAccs=accounts.filter(function(a){
    return a.c.startsWith(grp.code) && a.c.length===grp.code.length+1;
  });
  // subgroups of this group
  var subGroups=groups.filter(function(g){return g.parent===grp.code;});
  if(!directAccs.length&&!subGroups.length) return "";

  var bgColors=["var(--n)","var(--nd)","var(--sk)","var(--g2)","white"];
  var txtColors=["white","white","white","var(--n)","var(--n)"];
  var paddings=[12,10,9,8,7];
  var depth2=Math.min(depth,4);

  var h='<div style="margin-bottom:8px;">';
  // Group header
  h+='<div style="background:'+bgColors[depth2]+';color:'+txtColors[depth2]+';border-radius:9px;padding:'+paddings[depth2]+'px 14px;font-weight:800;font-size:'+(depth===0?14:depth===1?13:12)+'px;margin-bottom:'+(depth<2?6:4)+'px;display:flex;justify-content:space-between;align-items:center;">';
  h+='<span>'+(grp.icon||"")+" "+grp.label+'</span>';
  h+='<code style="font-size:10px;opacity:.65;font-weight:400;">'+grp.code+'</code>';
  h+='</div>';

  // Render sub-groups recursively
  if(subGroups.length){
    h+='<div style="padding-right:'+(depth*8+8)+'px;">';
    subGroups.forEach(function(sg){
      h+=renderAccGroup(sg,groups,accounts,depth+1);
    });
    h+='</div>';
  }

  // Render direct accounts
  if(directAccs.length){
    h+='<div style="padding-right:'+(depth*8+12)+'px;">';
    directAccs.forEach(function(a){
      h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:white;border:1px solid var(--g2);border-radius:8px;margin-bottom:4px;font-size:12px;">';
      h+='<div style="display:flex;align-items:center;gap:8px;">';
      h+='<code style="font-size:10.5px;background:var(--g1);padding:2px 7px;border-radius:5px;color:var(--n);">'+a.c+'</code>';
      h+='<span style="font-weight:600;">'+a.n+'</span>';
      h+='</div>';
      h+='<div style="display:flex;align-items:center;gap:6px;">';
      h+='<span class="badge '+(a.nat==="dr"?"bb":"bg")+'" style="font-size:9.5px;">'+(a.nat==="dr"?"مدين":"دائن")+'</span>';
      h+='</div>';
      h+='</div>';
    });
    h+='</div>';
  }

  h+='</div>';
  return h;
}

function saveAcc(){

  if(!c||!n){alert("الكود والاسم مطلوبان");return;}
  if(DB.accounts.find(function(a){return a.c===c;})){alert("الكود موجود بالفعل!");return;}
  DB.accounts.push({c:c,n:n,nat:sv("ac-nat")||"dr"});

}

// ── Opening balances (from DB or period) ─────────────────────────


function getPeriodBals(fromDate, toDate){
  var pb={};
  DB.accounts.forEach(function(a){pb[a.c]={dr:0,cr:0};});
  (DB.entries||[]).filter(function(e){
    if(e.status!=='posted') return false;
    if(fromDate && e.date < fromDate) return false;
    if(toDate   && e.date > toDate)   return false;
    return true;
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(!pb[l.acc]) pb[l.acc]={dr:0,cr:0};
      pb[l.acc].dr+=(l.dr||0);
      pb[l.acc].cr+=(l.cr||0);
    });
  });
  return pb;
}

function netBal(acc, b){
  var nat=acc.nat||'dr';
  var dr=b.dr||0, cr=b.cr||0;
  return nat==='dr' ? dr-cr : cr-dr;
}

// Get all bank/cash accounts from COA (1111-1113 range + any account starting with 111x or 1112-1113)
function getBankAccounts(){
  return DB.accounts.filter(function(a){
    return a.c.startsWith('111') && a.nat==='dr';
  });
}

// Get all journal movements for a specific account
function getAccMovements(accCode, fromDate, toDate){
  var rows=[];
  (DB.entries||[]).filter(function(e){
    return e.status==='posted'
      &&(!fromDate||e.date>=fromDate)
      &&(!toDate||e.date<=toDate);
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.acc===accCode){
        rows.push({
          entryId:e.id, date:e.date, ref:e.ref, desc:e.desc,
          dr:l.dr||0, cr:l.cr||0,
          tpName:l.tpName||l.tpId||'', proj:e.proj||''
        });
      }
    });
  });
  rows.sort(function(a,b){return a.date<b.date?-1:1;});
  return rows;
}

// Calculate running balance for account up to a date
function getAccBalAtDate(accCode, upToDate){
  var dr=0,cr=0;
  (DB.entries||[]).filter(function(e){
    return e.status==='posted' && (!upToDate||e.date<=upToDate);
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.acc===accCode){dr+=l.dr||0;cr+=l.cr||0;}
    });
  });
  return {dr:dr, cr:cr, net:dr-cr}; // net = book balance (debit-natured account)
}

// ── Open Reconciliation ───────────────────────────────────────────
function openRecon(accCode){
  var acc=DB.accounts.find(function(a){return a.c===accCode;})||{c:accCode,n:accCode};
  var today=new Date().toISOString().slice(0,7); // YYYY-MM
  // Find last closed recon month
  var lastRecon=(DB.bankRecons||[]).filter(function(r){
    return r.accCode===accCode&&(r.closed||r.month);
  }).map(function(r){
    if(!r.month&&r.date) r.month=r.date.slice(0,7);
    return r;
  }).sort(function(a,b){return b.month>a.month?1:-1;})[0];
  var defaultMonth=lastRecon
    ? (function(){var d=new Date(lastRecon.month+'-01');d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,7);}())
    : today;

  var h='';
  h+='<div class="fg"><label>الحساب</label>'
    +'<div style="font-weight:800;font-size:14px;color:var(--nd);">'+acc.c+' — '+acc.n+'</div></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
  h+='<div class="fg"><label>شهر التسوية *</label>'
    +'<input type="month" id="rc-month" value="'+defaultMonth+'"></div>';
  h+='<div class="fg"><label>رصيد كشف حساب البنك *</label>'
    +'<input type="number" id="rc-bank-bal" step="0.01" placeholder="0.00"></div>';
  h+='</div>';
  h+='<button onclick="loadReconData(\''+accCode+'\')" class="btn btn-gr" style="width:100%;">📂 تحميل بيانات الشهر</button>';
  om('🔄 تسوية بنكية — '+acc.n, h);
}

// ── Load Month Data ───────────────────────────────────────────────
function loadReconData(accCode){
  var month=(document.getElementById('rc-month')||{}).value||'';
  var bankBalInput=parseFloat((document.getElementById('rc-bank-bal')||{}).value)||0;
  if(!month){toast('⚠️ اختر الشهر أولاً');return;}
  cm();
  setTimeout(function(){
    renderReconPage(accCode,month,bankBalInput);
  },50);
}

function renderReconPage(accCode,month,bankBal){
  var acc=DB.accounts.find(function(a){return a.c===accCode;})||{c:accCode,n:accCode};
  var monthStart=month+'-01';
  var monthEnd=month+'-31'; // safe upper bound

  // ── Get book balance at start of month (opening) ──────────────
  var openBal=0;
  (DB.entries||[]).filter(function(e){
    return e.status==='posted'&&e.date<monthStart;
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.acc===accCode){openBal+=(l.dr||0)-(l.cr||0);}
    });
  });

  // ── Get this month's transactions ─────────────────────────────
  var txns=[];
  (DB.entries||[]).filter(function(e){
    return e.status==='posted'&&e.date>=monthStart&&e.date<=monthEnd;
  }).forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.acc!==accCode) return;
      if((l.dr||0)+(l.cr||0)===0) return;
      txns.push({
        entryId:e.id, date:e.date, desc:e.desc,
        dr:l.dr||0, cr:l.cr||0,
        cleared:false, // will be set from saved state
      });
    });
  });
  txns.sort(function(a,b){return a.date>b.date?1:-1;});

  // ── Get pending items from previous months ────────────────────
  var prevPending=[];
  var allPrevRecons=(DB.bankRecons||[]).filter(function(r){
    return r.accCode===accCode&&r.closed&&r.month<month;
  }).sort(function(a,b){return b.month>a.month?1:-1;});

  if(allPrevRecons.length){
    // Get uncleared items from last closed recon
    var lastR=allPrevRecons[0];
    (lastR.pendingItems||[]).forEach(function(item){
      prevPending.push(item);
    });
  }

  // ── Get saved recon state for this month ─────────────────────
  var savedRecon=(DB.bankRecons||[]).find(function(r){
    return r.accCode===accCode&&r.month===month&&!r.closed;
  });
  var clearedIds=savedRecon?(savedRecon.clearedIds||[]):[];
  var manualItems=savedRecon?(savedRecon.manualItems||[]):[];
  if(bankBal===0&&savedRecon) bankBal=savedRecon.bankBal||0;

  // Apply saved cleared state
  txns.forEach(function(t){t.cleared=clearedIds.indexOf(t.entryId+t.date)>-1;});
  prevPending.forEach(function(t){t.cleared=clearedIds.indexOf('P_'+t.entryId)>-1;});

  // ── Render ────────────────────────────────────────────────────
  var pg=document.getElementById('pg-more');
  if(!pg) return;

  var h='<div style="padding:14px 14px 80px;">';
  // Header
  h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">';
  h+='<button onclick="sub(\'banks\')" style="background:var(--g1);border:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-family:Cairo,sans-serif;font-size:13px;">‹ رجوع</button>';
  h+='<div><div style="font-weight:800;font-size:15px;color:var(--nd);">🔄 تسوية — '+acc.n+'</div>';
  h+='<div style="font-size:11px;color:var(--g4);">'+month+'</div></div></div>';

  // Bank balance input
  h+='<div style="background:white;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #e5e7eb;">';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
  h+='<div class="fg" style="margin-bottom:0;"><label style="font-size:11px;">رصيد كشف حساب البنك</label>';
  h+='<input type="number" id="recon-bank-bal" value="'+bankBal+'" step="0.01" onchange="updateReconCalc()" style="font-weight:700;font-size:15px;direction:ltr;text-align:left;"></div>';
  h+='<div style="background:#f8f9fa;border-radius:8px;padding:10px;">';
  h+='<div style="font-size:10px;color:var(--g4);">الرصيد الدفتري (أول الشهر)</div>';
  h+='<div style="font-weight:800;font-size:14px;color:var(--nd);">'+fmt(openBal)+'</div></div>';
  h+='</div></div>';

  // ── Previous pending items ─────────────────────────────────────
  if(prevPending.length){
    h+='<div class="sd" style="margin-bottom:8px;">⏳ مبالغ معلقة من شهور سابقة ('+prevPending.length+')</div>';
    h+='<div style="background:white;border-radius:12px;overflow:hidden;margin-bottom:12px;border:1px solid #fde68a;">';
    h+='<table style="width:100%;font-size:11px;border-collapse:collapse;">';
    h+='<thead><tr style="background:#92400e;color:white;">';
    h+='<th style="padding:7px;width:32px;"></th>';
    h+='<th style="text-align:right;padding:7px;">التاريخ</th>';
    h+='<th style="text-align:right;">رقم القيد</th>';
    h+='<th style="text-align:right;">البيان</th>';
    h+='<th style="text-align:left;">مدين</th>';
    h+='<th style="text-align:left;">دائن</th>';
    h+='</tr></thead><tbody>';
    prevPending.forEach(function(t){
      var cid='P_'+t.entryId;
      var checked=clearedIds.indexOf(cid)>-1;
      h+='<tr style="border-bottom:1px solid #fef3c7;background:'+(checked?'#f0fdf4':'white')+'" id="row-'+cid+'">';
      h+='<td style="padding:6px;text-align:center;"><input type="checkbox" data-cid="'+cid+'" '+(checked?'checked':'')+' onchange="toggleCleared(this)" style="width:16px;height:16px;cursor:pointer;"></td>';
      h+='<td style="padding:6px;">'+t.date+'</td>';
      h+='<td style="color:var(--sk);font-weight:700;" data-eid="'+t.entryId+'" onclick="viewE(this.dataset.eid)">'+t.entryId+'</td>';
      h+='<td style="color:#475569;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+t.desc+'</td>';
      h+='<td style="text-align:left;font-weight:700;color:#059669;">'+(t.dr>0?fmt(t.dr):'—')+'</td>';
      h+='<td style="text-align:left;font-weight:700;color:#dc2626;">'+(t.cr>0?fmt(t.cr):'—')+'</td>';
      h+='</tr>';
    });
    h+='</tbody></table></div>';
  }

  // ── This month's transactions ─────────────────────────────────
  h+='<div class="sd" style="margin-bottom:8px;">📋 حركات الشهر — '+month+' ('+txns.length+' حركة)</div>';
  h+='<div style="background:white;border-radius:12px;overflow:hidden;margin-bottom:12px;border:1px solid #e5e7eb;">';
  if(!txns.length){
    h+='<div style="padding:20px;text-align:center;color:var(--g4);">لا توجد حركات هذا الشهر</div>';
  } else {
    h+='<table style="width:100%;font-size:11px;border-collapse:collapse;">';
    h+='<thead><tr style="background:var(--nd);color:white;">';
    h+='<th style="padding:7px;width:32px;"><input type="checkbox" id="chk-all" onchange="toggleAllCleared(this)" style="width:16px;height:16px;cursor:pointer;"></th>';
    h+='<th style="text-align:right;padding:7px;">التاريخ</th>';
    h+='<th style="text-align:right;">رقم القيد</th>';
    h+='<th style="text-align:right;">البيان</th>';
    h+='<th style="text-align:left;">مدين</th>';
    h+='<th style="text-align:left;">دائن</th>';
    h+='</tr></thead><tbody id="recon-txns">';
    txns.forEach(function(t){
      var cid=t.entryId+t.date;
      h+='<tr style="border-bottom:1px solid #f1f5f9;background:'+(t.cleared?'#f0fdf4':'white')+'" id="row-'+cid+'">';
      h+='<td style="padding:6px;text-align:center;"><input type="checkbox" data-cid="'+cid+'" '+(t.cleared?'checked':'')+' onchange="toggleCleared(this)" style="width:16px;height:16px;cursor:pointer;"></td>';
      h+='<td style="padding:6px;">'+t.date+'</td>';
      h+='<td style="color:var(--sk);font-weight:700;cursor:pointer;" data-eid="'+t.entryId+'" onclick="viewE(this.dataset.eid)">'+t.entryId+'</td>';
      h+='<td style="color:#475569;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+t.desc+'</td>';
      h+='<td style="text-align:left;font-weight:700;color:#059669;">'+(t.dr>0?fmt(t.dr):'—')+'</td>';
      h+='<td style="text-align:left;font-weight:700;color:#dc2626;">'+(t.cr>0?fmt(t.cr):'—')+'</td>';
      h+='</tr>';
    });
    h+='</tbody></table>';
  }
  h+='</div>';

  // ── Manual Adjustments ─────────────────────────────────────────
  h+='<div class="sd" style="margin-bottom:8px;">✏️ تسويات يدوية (م. بنكية / حركات خاطئة)</div>';
  h+='<div style="background:white;border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid #e5e7eb;">';
  h+='<div id="manual-items">';
  if(manualItems.length){
    manualItems.forEach(function(mi,i){
      h+=buildManualItemRow(mi,i);
    });
  }
  h+='</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px;">';
  h+='<input id="mi-desc" placeholder="البيان (م. بنكية، مصروفات إدارية...)" style="padding:8px;border-radius:7px;border:1px solid #e5e7eb;font-family:Cairo,sans-serif;">';
  h+='<input id="mi-amt" type="number" placeholder="0.00" step="0.01" style="padding:8px;border-radius:7px;border:1px solid #e5e7eb;direction:ltr;">';
  h+='<div style="display:flex;gap:4px;">';
  h+='<button onclick="addManualItem(1)" style="background:#059669;border:none;color:white;border-radius:7px;padding:8px 10px;cursor:pointer;font-size:12px;">+ إضافة</button>';
  h+='<button onclick="addManualItem(-1)" style="background:#dc2626;border:none;color:white;border-radius:7px;padding:8px 10px;cursor:pointer;font-size:12px;">− خصم</button>';
  h+='</div></div></div>';

  // ── Summary & Balance ─────────────────────────────────────────
  h+='<div id="recon-summary" style="background:white;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #e5e7eb;">';
  h+=buildReconSummary(openBal,txns,prevPending,manualItems,bankBal);
  h+='</div>';

  // Save buttons
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
  h+='<button onclick="saveReconDraft(\''+accCode+'\',\''+month+'\')" class="btn btn-gy" style="font-size:12px;">💾 حفظ مسودة</button>';
  h+='<button onclick="closeRecon(\''+accCode+'\',\''+month+'\')" class="btn btn-gr" style="font-size:12px;">✅ إقفال التسوية</button>';
  h+='</div>';
  h+='</div>';

  // Store state in window
  window._recon={accCode:accCode,month:month,openBal:openBal,txns:txns,prevPending:prevPending,manualItems:manualItems,bankBal:bankBal};
  try{sessionStorage.setItem('_reconState',JSON.stringify({accCode:accCode,month:month,bankBal:bankBal}));}catch(e){}
  // Show pg-recon — create it if missing, always show it independently
  var pgRecon=document.getElementById('pg-recon');
  if(!pgRecon){
    pgRecon=document.createElement('div');
    pgRecon.id='pg-recon';
    pgRecon.className='pg';
    var ct=document.querySelector('.content');
    if(ct)ct.appendChild(pgRecon);
  }
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on');});
  document.querySelectorAll('.bn').forEach(function(b){b.classList.remove('on');});
  pgRecon.innerHTML=h;
  pgRecon.classList.add('on');
  showTbBack({type:'sub',pg:'grantfiles'});
  window.scrollTo(0,0);
}

function buildManualItemRow(mi,idx){
  return '<div style="display:flex;justify-content:space-between;align-items:center;'
    +'background:'+(mi.type>0?'#f0fdf4':'#fff5f5')+';border-radius:7px;padding:7px 10px;margin-bottom:5px;">'
    +'<span style="font-size:12px;">'+mi.desc+'</span>'
    +'<div style="display:flex;align-items:center;gap:8px;">'
    +'<span style="font-weight:700;color:'+(mi.type>0?'#059669':'#dc2626')+';">'
    +(mi.type>0?'+':'-')+fmt(Math.abs(mi.amt))+'</span>'
    +'<button data-idx="'+idx+'" onclick="removeManualItem(this.dataset.idx)" '
    +'style="background:#fee2e2;border:none;border-radius:5px;padding:3px 7px;cursor:pointer;color:#dc2626;font-size:11px;">✕</button>'
    +'</div></div>';
}

function buildReconSummary(openBal,txns,prevPending,manualItems,bankBal){
  var bankInput=document.getElementById?document.getElementById('recon-bank-bal'):null;
  var stmtBal=bankInput?parseFloat(bankInput.value)||bankBal:bankBal||0;
  if(isNaN(stmtBal))stmtBal=bankBal||0;

  var clearedIds=[];
  if(document.querySelectorAll){
    document.querySelectorAll('[data-cid]').forEach(function(cb){
      if(cb.checked)clearedIds.push(cb.dataset.cid);
    });
  }

  var allTxns=(txns||[]).concat(prevPending||[]);
  var unclearedItems=[];
  allTxns.forEach(function(t){
    var cid=t.entryId+t.date;
    var cleared=clearedIds.indexOf(cid)>-1||clearedIds.indexOf('P_'+t.entryId)>-1;
    if(!cleared)unclearedItems.push(t);
  });

  var deposits=unclearedItems.filter(function(t){return (t.dr||0)>0;});
  var totalDeposits=deposits.reduce(function(s,t){return s+(t.dr||0);},0);
  var checks=unclearedItems.filter(function(t){return (t.cr||0)>0;});
  var totalChecks=checks.reduce(function(s,t){return s+(t.cr||0);},0);
  var manualAdj=(manualItems||[]).reduce(function(s,mi){return s+mi.type*mi.amt;},0);

  var monthDr=(txns||[]).reduce(function(s,t){return s+(t.dr||0);},0);
  var monthCr=(txns||[]).reduce(function(s,t){return s+(t.cr||0);},0);
  var bookBal=(openBal||0)+monthDr-monthCr;

  // المعادلة الصحيحة للتسوية البنكية:
  // الرصيد البنكي المعدّل = رصيد كشف الحساب + إيداعات لم تظهر − شيكات لم تُصرف ± تسويات يدوية
  // ثم يتم مقارنته بالرصيد الدفتري.
  var adjustedBank=stmtBal+totalDeposits-totalChecks+manualAdj;
  var diff=bookBal-adjustedBank;
  var balanced=Math.abs(diff)<0.01;

  var h='<div style="font-weight:800;color:var(--nd);margin-bottom:10px;font-size:13px;">📊 ملخص التسوية</div>';
  h+='<div style="display:flex;flex-direction:column;gap:8px;">';

  // ── الرصيد الدفتري ────────────────────────────────────────────
  h+='<div style="background:#f8f9fa;border-radius:8px;padding:10px;">';
  h+='<div style="font-weight:700;font-size:12px;margin-bottom:6px;color:var(--nd);">الرصيد الدفتري</div>';
  [{lbl:'رصيد أول الشهر',val:openBal||0,style:''},
   {lbl:'+ حركات مدينة',val:monthDr,style:'color:#059669'},
   {lbl:'− حركات دائنة',val:monthCr,style:'color:#dc2626'},
   {lbl:'الرصيد الدفتري',val:bookBal,style:'font-weight:900;border-top:1px solid #e5e7eb;padding-top:4px;margin-top:4px;'},
  ].forEach(function(row){
    h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;'+row.style+';">';
    h+='<span>'+row.lbl+'</span><span>'+fmt(row.val)+'</span></div>';
  });
  h+='</div>';

  // ── إيداعات لم تظهر (بالتفاصيل) ─────────────────────────────
  if(deposits.length){
    h+='<div style="background:#fff5f5;border-radius:8px;padding:10px;border:1px solid #fca5a5;">';
    h+='<div style="font-weight:700;font-size:12px;margin-bottom:6px;color:#dc2626;">− إيداعات لم تظهر في كشف الحساب</div>';
    deposits.forEach(function(t){
      h+='<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:#475569;">';
      h+='<span>'+t.date+' · '+t.desc+'</span><span style="color:#dc2626;">'+fmt(t.dr)+'</span></div>';
    });
    h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;padding-top:4px;margin-top:4px;border-top:1px solid #fca5a5;color:#dc2626;">';
    h+='<span>الإجمالي</span><span>'+fmt(totalDeposits)+'</span></div>';
    h+='</div>';
  }

  // ── شيكات لم تُصرف (بالتفاصيل) ──────────────────────────────
  if(checks.length){
    h+='<div style="background:#f0fdf4;border-radius:8px;padding:10px;border:1px solid #86efac;">';
    h+='<div style="font-weight:700;font-size:12px;margin-bottom:6px;color:#059669;">+ شيكات لم تُصرف من كشف الحساب</div>';
    checks.forEach(function(t){
      h+='<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:#475569;">';
      h+='<span>'+t.date+' · '+t.desc+'</span><span style="color:#059669;">'+fmt(t.cr)+'</span></div>';
    });
    h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;padding-top:4px;margin-top:4px;border-top:1px solid #86efac;color:#059669;">';
    h+='<span>الإجمالي</span><span>'+fmt(totalChecks)+'</span></div>';
    h+='</div>';
  }

  // ── تسويات يدوية ──────────────────────────────────────────────
  if((manualItems||[]).length){
    h+='<div style="background:#fffbeb;border-radius:8px;padding:10px;border:1px solid #fde68a;">';
    h+='<div style="font-weight:700;font-size:12px;margin-bottom:6px;color:#d97706;">± تسويات يدوية</div>';
    manualItems.forEach(function(mi){
      h+='<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;">';
      h+='<span>'+(mi.type>0?'+ ':' − ')+mi.desc+'</span>';
      h+='<span style="color:'+(mi.type>0?'#059669':'#dc2626')+';">'+fmt(mi.amt)+'</span></div>';
    });
    h+='</div>';
  }

  // ── الرصيد البنكي المعدّل ──────────────────────────────────
  h+='<div style="background:#f8f9fa;border-radius:8px;padding:10px;">';
  h+='<div style="font-weight:700;font-size:12px;margin-bottom:6px;color:var(--nd);">الرصيد البنكي المعدّل</div>';
  h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;">';
  h+='<span>رصيد كشف الحساب</span><span>'+fmt(stmtBal)+'</span></div>';
  if(totalDeposits>0){
    h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;color:#059669;">';
    h+='<span>+ إيداعات لم تظهر</span><span>'+fmt(totalDeposits)+'</span></div>';
  }
  if(totalChecks>0){
    h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;color:#dc2626;">';
    h+='<span>− شيكات لم تُصرف</span><span>'+fmt(totalChecks)+'</span></div>';
  }
  if(manualAdj!==0){
    h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;color:#d97706;">';
    h+='<span>± تسويات يدوية</span><span>'+fmt(manualAdj)+'</span></div>';
  }
  h+='<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:900;padding-top:4px;margin-top:4px;border-top:2px solid #e5e7eb;">';
  h+='<span>الرصيد البنكي المعدّل</span><span>'+fmt(adjustedBank)+'</span></div>';
  h+='</div>';

  // ── النتيجة: الرصيد البنكي المعدّل vs الرصيد الدفتري ───────────────────────────
  h+='<div style="background:'+(balanced?'#059669':'#dc2626')+';border-radius:10px;padding:12px;color:white;">';
  h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;opacity:.85;margin-bottom:3px;">';
  h+='<span>الرصيد البنكي المعدّل</span><span>'+fmt(adjustedBank)+'</span></div>';
  h+='<div style="display:flex;justify-content:space-between;font-size:11.5px;opacity:.85;margin-bottom:6px;">';
  h+='<span>الرصيد الدفتري</span><span>'+fmt(bookBal)+'</span></div>';
  h+='<div style="font-weight:900;font-size:15px;text-align:center;border-top:1px solid rgba(255,255,255,.3);padding-top:8px;">';
  h+=(balanced?'✅ التسوية متطابقة':'⚠️ الفرق: '+fmt(Math.abs(diff))+' ج.م');
  h+='</div></div>';

  h+='</div>';
  return h;
}

function toggleCleared(cb){
  var cid=cb.dataset.cid;
  var row=document.getElementById('row-'+cid);
  if(row) row.style.background=cb.checked?'#f0fdf4':'white';
  updateReconCalc();
}

function toggleAllCleared(masterCb){
  document.querySelectorAll('#recon-txns input[type="checkbox"]').forEach(function(cb){
    cb.checked=masterCb.checked;
    var row=document.getElementById('row-'+cb.dataset.cid);
    if(row) row.style.background=masterCb.checked?'#f0fdf4':'white';
  });
  updateReconCalc();
}

function updateReconCalc(){
  if(!window._recon) return;
  var r=window._recon;
  var bankInput=document.getElementById('recon-bank-bal');
  var currentBankBal=bankInput?parseFloat(bankInput.value)||r.bankBal:r.bankBal;
  var summary=document.getElementById('recon-summary');
  if(summary) summary.innerHTML=buildReconSummary(r.openBal,r.txns,r.prevPending,r.manualItems,currentBankBal);
}

function addManualItem(type){
  var desc=(document.getElementById('mi-desc')||{}).value||'';
  var amt=parseFloat((document.getElementById('mi-amt')||{}).value)||0;
  if(!desc||!amt){toast('⚠️ أدخل البيان والمبلغ');return;}
  if(!window._recon) return;
  window._recon.manualItems.push({desc:desc,amt:Math.abs(amt),type:type});
  var container=document.getElementById('manual-items');
  if(container) container.innerHTML=window._recon.manualItems.map(buildManualItemRow).join('');
  if(document.getElementById('mi-desc')) document.getElementById('mi-desc').value='';
  if(document.getElementById('mi-amt')) document.getElementById('mi-amt').value='';
  updateReconCalc();
}

function removeManualItem(idx){
  if(!window._recon) return;
  window._recon.manualItems.splice(parseInt(idx),1);
  var container=document.getElementById('manual-items');
  if(container) container.innerHTML=window._recon.manualItems.map(buildManualItemRow).join('');
  updateReconCalc();
}

function getReconState(){
  if(!window._recon) return null;
  var r=window._recon;
  var clearedIds=[];
  document.querySelectorAll('[data-cid]').forEach(function(cb){
    if(cb.checked) clearedIds.push(cb.dataset.cid);
  });
  var bankBal=parseFloat((document.getElementById('recon-bank-bal')||{}).value)||r.bankBal;
  // Pending items = unchecked items from this month + prev pending
  var allTxns=r.txns.concat(r.prevPending);
  var pendingItems=allTxns.filter(function(t){
    var cid=t.entryId+t.date;
    return clearedIds.indexOf(cid)<0&&clearedIds.indexOf('P_'+t.entryId)<0;
  });
  return {
    accCode:r.accCode,month:r.month,bankBal:bankBal,
    clearedIds:clearedIds,manualItems:r.manualItems,
    pendingItems:pendingItems,
  };
}

function closeRecon(accCode,month){
  if(!window._recon){
    toast('⚠️ البيانات غير محملة — أعد تحميل شهر التسوية');return;
  }
  var state=getReconState();
  if(!state){toast('⚠️ لا توجد بيانات');return;}
  var r=window._recon;
  var bankBal=parseFloat((document.getElementById('recon-bank-bal')||{}).value)||0;
  var monthDr=r.txns.reduce(function(s,t){return s+t.dr;},0);
  var monthCr=r.txns.reduce(function(s,t){return s+t.cr;},0);
  var bookBal=r.openBal+monthDr-monthCr;
  // Quick balance check
  var uncleared=r.txns.concat(r.prevPending).filter(function(t){
    return state.clearedIds.indexOf(t.entryId+t.date)<0&&
           state.clearedIds.indexOf('P_'+t.entryId)<0;
  });
  var totalDeposits=uncleared.reduce(function(s,t){return s+(t.dr||0);},0);
  var totalChecks=uncleared.reduce(function(s,t){return s+(t.cr||0);},0);
  var manAdj=state.manualItems.reduce(function(s,mi){return s+mi.type*mi.amt;},0);
  var adjustedBank=bankBal+totalDeposits-totalChecks+manAdj;
  var diff=Math.abs(bookBal-adjustedBank);

  if(diff>0.01){
    if(!confirm('التسوية غير متطابقة — الفرق '+fmt(diff)+' ج.م\nالرصيد الدفتري: '+fmt(bookBal)+'\nالرصيد البنكي المعدّل: '+fmt(adjustedBank)+'\nهل تريد الإقفال على أي حال؟')) return;
  }
  initRecon();
  DB.bankRecons=DB.bankRecons.filter(function(r){
    return !(r.accCode===accCode&&r.month===month);
  });
  DB.bankRecons.push({
    id:'RC'+Date.now(),accCode:accCode,month:month,
    bankBal:bankBal,bookBal:bookBal,adjustedBank:adjustedBank,diff:bookBal-adjustedBank,
    clearedIds:state.clearedIds,manualItems:state.manualItems,
    pendingItems:state.pendingItems,
    closed:true,closedAt:new Date().toISOString(),
    closedBy:(getCurrentUser()||{}).name||'النظام',
  });
  save();
  toast('✅ تم إقفال تسوية '+month+(diff<0.01?' — متطابقة ✅':' — فرق '+fmt(diff)));
  sub('banks');
}


// اختبار داخلي سريع لمعادلة التسوية البنكية بدون التأثير على بيانات المستخدم
function testBankReconFormula(){
  // الرصيد الدفتري = 1,300، كشف البنك = 1,000، إيداع لم يظهر = 500، شيك لم يصرف = 200
  // الرصيد البنكي المعدل = 1,000 + 500 - 200 = 1,300 => الفرق صفر
  var bookBal=1300, stmtBal=1000, deposits=500, checks=200, manualAdj=0;
  var adjustedBank=stmtBal+deposits-checks+manualAdj;
  var diff=Math.abs(bookBal-adjustedBank);
  return diff<0.01;
}

// ── Calculate depreciation for one asset ────────────────────────
function calcAssetDepr(asset){
  // القسط الثابت: (التكلفة - القيمة المتبقية) / العمر الإنتاجي بالأشهر
  var cost   = asset.cost || 0;
  var resVal = asset.residualValue || 0;
  var lifeM  = (asset.lifeYears || 1) * 12;
  var monthly = Math.round((cost - resVal) / lifeM * 100) / 100;

  // حساب المدة المنقضية
  var start  = new Date(asset.startDate || asset.purchaseDate);
  var today  = new Date();
  var elapsed= (today.getFullYear()-start.getFullYear())*12 + (today.getMonth()-start.getMonth());
  var accDepr= Math.min(monthly * elapsed, cost - resVal);
  var bookVal= Math.max(cost - accDepr, resVal);
  var remainM= Math.max(0, lifeM - elapsed);

  return {monthly:monthly, accumulated:Math.round(accDepr), bookValue:Math.round(bookVal), elapsedMonths:elapsed, remainingMonths:remainM, fullyDepreciated:remainM===0};
}

function updateAssetRate(){
  var catCode=(document.getElementById('ast-cat')||{}).value;
  var cat=ASSET_CATS.find(function(c){return c.code===catCode;});
  if(cat){
    var lifeEl=document.getElementById('ast-life');
    if(lifeEl&&lifeEl.value==='5') lifeEl.value=Math.round(1/cat.rate);
  }
  previewAssetCalc();
}

function previewAssetCalc(){
  var cost=parseFloat((document.getElementById('ast-cost')||{}).value)||0;
  var resid=parseFloat((document.getElementById('ast-resid')||{}).value)||0;
  var life=parseInt((document.getElementById('ast-life')||{}).value)||5;
  var prev=document.getElementById('ast-preview');
  var prevC=document.getElementById('ast-preview-content');
  if(!prev||!prevC||cost<=0) return;
  var monthly=Math.round((cost-resid)/life/12*100)/100;
  var annual=Math.round((cost-resid)/life*100)/100;
  prev.style.display='block';
  prevC.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">'
    +'<div><div style="color:var(--g4);font-size:9.5px;">إهلاك شهري</div><div style="font-weight:700;color:var(--rd);">'+fmt(monthly)+' ج.م</div></div>'
    +'<div><div style="color:var(--g4);font-size:9.5px;">إهلاك سنوي</div><div style="font-weight:700;color:var(--am);">'+fmt(annual)+' ج.م</div></div>'
    +'<div><div style="color:var(--g4);font-size:9.5px;">القيمة التخريدية</div><div style="font-weight:700;color:var(--gr);">'+fmt(resid)+' ج.م</div></div>'
    +'</div>';
}

  var today=new Date();
  var monthKey=today.getFullYear()+'-'+(today.getMonth()+1).toString().padStart(2,'0');

    rows+='<td style="padding:5px;border-bottom:1px solid #eee;text-align:left;font-weight:700;color:var(--rd);">'+fmt(g.total)+' ج.م</td></tr>';
  });
  rows+='<tr style="background:#fff8e1;"><td colspan="2" style="padding:7px;font-weight:800;">إجمالي الإهلاك الشهري</td>';
  rows+='<td style="padding:7px;text-align:left;font-weight:900;color:var(--nd);font-size:13px;">'+fmt(totalDepr)+' ج.م</td></tr>';

function postDeprEntry(byCategory){
  var today=new Date().toISOString().split('T')[0];
  var id='J'+new Date().getFullYear()+'-DEP-'+String(Date.now()).slice(-5);
  var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var d=new Date();
  var mName=MONTHS[d.getMonth()]+' '+d.getFullYear();
  var lines=[];

  Object.values(byCategory).forEach(function(g){
    if(g.total<=0)return;
    lines.push({acc:g.cat.expAcc, an:'إهلاك '+g.cat.name, dr:Math.round(g.total), cr:0});
    lines.push({acc:g.cat.deprAcc, an:'مجمع إهلاك '+g.cat.name, dr:0, cr:Math.round(g.total)});
  });

  if(!lines.length){toast('لا توجد مبالغ إهلاك');return;}

  var entry={
    id:id, date:today, desc:'قيد إهلاك شهر '+mName+' — تلقائي',
    ref:'DEP-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),
    lines:lines, status:'posted', autoDepr:true
  };
  if(!DB.entries) DB.entries=[];
  DB.entries.push(entry);
  save();
  cm();
  sub('assets');
  toast('✅ تم ترحيل قيد الإهلاك — '+mName);
}

function getLeaveDatesForTs(empId, year, month){
  initLeaves();
  return DB.leaveRequests.filter(function(r){
    return r.empId===empId && r.status==='approved';
  }).reduce(function(dates,req){
    // expand date range
    var d=new Date(req.fromDate);
    var end=new Date(req.toDate);
    while(d<=end){
      var ds=d.toISOString().split('T')[0];
      var dy=parseInt(ds.split('-')[0]);
      var dm=parseInt(ds.split('-')[1]);
      if(dy===year&&dm===month&&dates.indexOf(ds)<0) dates.push(ds);
      d.setDate(d.getDate()+1);
    }
    return dates;
  },[]);
}

  if(!DB.tsSettings)   DB.tsSettings={

  };
}

// ── Helpers ─────────────────────────────────────────────────────
function getTsSettings(){ initTimesheet(); return DB.tsSettings; }

function getWorkDaysInMonth(year, month){ // month 1-based
  var cfg=getTsSettings();
  var days=[], d=new Date(year,month-1,1);
  while(d.getMonth()===month-1){
    if(cfg.workDays.indexOf(d.getDay())>-1){
      var ds=d.toISOString().split('T')[0];
      var isHol=cfg.holidays.some(function(h){return h.date===ds;});
      if(!isHol) days.push(ds);
    }
    d.setDate(d.getDate()+1);
  }
  return days;
}

  // Returns approved leave dates from leaveRequests
  initLeaves();
  return getLeaveDatesForTs(empId, year, month);
}

function roundHours(h, rounding){
  if(rounding==='whole')  return Math.round(h);
  if(rounding==='half')   return Math.round(h*2)/2;
  return Math.round(h*100)/100;
}

// ── Smart daily distribution ─────────────────────────────────────
// Distributes monthly hours across days in a natural, audit-friendly way
function distributeHoursSmartly(workDates, leaveDates, allocs, totalDailyHours, rounding){
  var activeDates=workDates.filter(function(d){return leaveDates.indexOf(d)<0;});
  var n=activeDates.length;
  if(!n) return [];

  // ── Step 1: Calculate exact total hours per project ──────────
  // Use floor to avoid over-allocation, then distribute remainder
  var projTotals=allocs.map(function(a){
    return {
      proj:a.proj, projName:a.projName, pct:a.pct,
      total: Math.floor(n * totalDailyHours * a.pct / 100),
      remaining: 0
    };
  });

  // Distribute any lost hours from rounding to projects in order
  var allocSum=projTotals.reduce(function(s,p){return s+p.total;},0);
  var totalExpected=n*totalDailyHours;
  var lost=totalExpected-allocSum;
  for(var pi=0;pi<projTotals.length&&lost>0;pi++){
    projTotals[pi].total+=1; lost--;
  }
  projTotals.forEach(function(p){p.remaining=p.total;});

  // ── Step 2: Day-by-day distribution ─────────────────────────
  var rows=[];
  activeDates.forEach(function(date,di){
    var daysLeft=n-di;
    var dayAllocs=[];
    var daySum=0;

    projTotals.forEach(function(p,pi){
      if(p.remaining<=0) return;
      var isLastProj=(pi===projTotals.length-1);

      var h;
      if(isLastProj){
        // Last project fills remainder of the day exactly
        h=totalDailyHours-daySum;
        h=Math.max(0,Math.min(h,p.remaining));
      } else {
        // Spread remaining hours evenly across remaining days
        var raw=p.remaining/daysLeft;
        h=roundHours(raw,rounding);
        // Never exceed remaining budget OR leave no room for day total
        h=Math.max(0,Math.min(h,p.remaining));
        // Don't let partial projects overflow the day
        h=Math.min(h,totalDailyHours-daySum);
      }

      if(h>0){
        dayAllocs.push({proj:p.proj,projName:p.projName,hours:h});
        p.remaining-=h;
        daySum+=h;
      }
    });

    // Safety: if daySum != totalDailyHours (due to rounding), adjust last alloc
    var diff=totalDailyHours-daySum;
    if(Math.abs(diff)>=0.5 && dayAllocs.length>0){
      // Find last project with remaining budget
      for(var k=dayAllocs.length-1;k>=0;k--){
        var adj=dayAllocs[k].hours+diff;
        if(adj>0 && adj<=totalDailyHours){
          // Undo previous remaining deduction and redo with correction
          var pObj=projTotals.find(function(p){return p.proj===dayAllocs[k].proj;});
          if(pObj) pObj.remaining-=diff;
          dayAllocs[k].hours=adj;
          daySum=totalDailyHours;
          break;
        }
      }
    }

    var d=new Date(date);
    var dayNames=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    rows.push({
      date:date, dayName:dayNames[d.getDay()],
      type:'work', allocs:dayAllocs, totalHours:totalDailyHours
    });
  });

  // ── Step 3: Add non-work days ────────────────────────────────
  var cfg=getTsSettings();
  var firstDate=new Date(workDates[0]);
  var yr=firstDate.getFullYear(), mo=firstDate.getMonth();
  var dd=new Date(yr,mo,1);
  var dayNames2=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  while(dd.getMonth()===mo){
    var ds=dd.toISOString().split('T')[0];
    if(workDates.indexOf(ds)<0){
      var isHol=cfg.holidays.some(function(h){return h.date===ds;});
      var isLeave=leaveDates.indexOf(ds)>-1;
      rows.push({
        date:ds, dayName:dayNames2[dd.getDay()],
        type:isLeave?'leave':isHol?'holiday':'weekend',
        allocs:[], totalHours:0
      });
    }
    dd.setDate(dd.getDate()+1);
  }

  rows.sort(function(a,b){return a.date<b.date?-1:1;});
  return rows;
}

function buildProjRow(i,projs,selCode,pct){
  var opts=projs.map(function(p){
    return '<option value="'+p.code+'"'+(p.code===selCode?' selected':'')+'>'+p.name+'</option>';
  }).join('');
  return '<div id="pr-row-'+i+'" style="display:grid;grid-template-columns:1fr 80px 32px;gap:6px;margin-bottom:6px;">'
    +'<select id="pr-proj-'+i+'" class="pr-proj" onchange="calcPctTotal()"><option value="">— اختر مشروع —</option>'+opts+'</select>'
    +'<div style="position:relative;">'
    +'<input id="pr-pct-'+i+'" class="pr-pct" type="number" value="'+(pct||0)+'" min="0" max="100" step="5" oninput="calcPctTotal()" '
    +'style="width:100%;text-align:center;padding-left:18px;">'
    +'<span style="position:absolute;left:6px;top:50%;transform:translateY(-50%);color:var(--g4);font-size:11px;">%</span>'
    +'</div>'
    +'<button onclick="removeProjRow('+i+')" style="background:#fee2e2;border:none;border-radius:7px;color:#c0392b;cursor:pointer;font-size:14px;">×</button>'
    +'</div>';
}

var _alProjCount=1;
function addProjRow(){
  var container=document.getElementById('al-projs');
  if(!container)return;
  var activeProjs=DB.projects.filter(function(p){return p.status==='active';});
  var div=document.createElement('div');
  div.innerHTML=buildProjRow(_alProjCount++,activeProjs,'',0);
  container.appendChild(div.firstChild);
  calcPctTotal();
}

function removeProjRow(i){
  var row=document.getElementById('pr-row-'+i);
  if(row)row.remove();
  calcPctTotal();
}

function calcPctTotal(){
  var total=0;
  document.querySelectorAll('.pr-pct').forEach(function(inp){total+=parseFloat(inp.value)||0;});
  var el=document.getElementById('al-pct-total');
  var box=document.getElementById('al-pct-check');
  if(el) el.textContent=total;
  if(box){
    box.style.background=Math.abs(total-100)<0.01?'#d1fae5':'#fee2e2';
    box.style.color=Math.abs(total-100)<0.01?'#065f46':'#c0392b';
  }
}

function updateAllocSalary(){
  var empId=(document.getElementById('al-emp')||{}).value;
  if(!empId)return;
  var emp=DB.employees.find(function(e){return e.id===empId;});
  if(!emp)return;
  var r=calcFull(emp,{});
  var salEl=document.getElementById('al-sal');
  if(salEl) salEl.value=r.gross||emp.sal||0;
}

function saveAllocation(){
  initTimesheet();
  var empId=(document.getElementById('al-emp')||{}).value;
  var month=parseInt((document.getElementById('al-month')||{}).value);
  var year=parseInt((document.getElementById('al-year')||{}).value);
  var sal=parseFloat((document.getElementById('al-sal')||{}).value)||0;
  if(!empId||!month||!year){toast('⚠️ بيانات غير مكتملة');return;}

  // Collect projects
  var projs=[];
  document.querySelectorAll('.pr-proj').forEach(function(sel,i){
    var code=sel.value;
    if(!code)return;
    var pct=parseFloat(document.querySelectorAll('.pr-pct')[i].value)||0;
    var proj=DB.projects.find(function(p){return p.code===code;});
    if(proj) projs.push({projCode:code,proj:code,projName:proj.name,pct:pct});
  });

  var total=projs.reduce(function(s,p){return s+p.pct;},0);
  if(Math.abs(total-100)>0.01){toast('⚠️ إجمالي النسب يجب أن يساوي 100% — الحالي: '+total+'%');return;}

  var alloc={
    id:'AL-'+Date.now(),empId:empId,month:month,year:year,salary:sal,
    projects:projs,status:'saved',tsGenerated:false,
    createdAt:new Date().toISOString()
  };
  DB.allocations.push(alloc);
  save();cm();
  sub('timesheet');
  toast('✅ تم حفظ التوزيع');
}

function deleteAllocation(id){
  if(!confirm('حذف هذا التوزيع؟'))return;
  DB.allocations=DB.allocations.filter(function(a){return a.id!==id;});
  save();sub('timesheet');
}

function editAllocation(id){
  var a=DB.allocations.find(function(x){return x.id===id;});

  newAllocationModal(null);

function doGenerateTimesheet(allocId){
  initTimesheet();
  var a=DB.allocations.find(function(x){return x.id===allocId;});
  if(!a)return;
  var cfg=getTsSettings();

  // Get leaves from input
  var leavesInput=(document.getElementById('ts-leaves')||{}).value||'';
  var leaveDates=leavesInput?leavesInput.split(',').map(function(s){return s.trim();}).filter(Boolean):[];

  var workDates=getWorkDaysInMonth(a.year,a.month);
  var rows=distributeHoursSmartly(workDates,leaveDates,a.projects,cfg.dailyHours,cfg.rounding);

  a.tsRows=rows;
  a.tsGenerated=true;
  a.tsGeneratedAt=new Date().toISOString();
  a.leaveDates=leaveDates;
  save();cm();
  // Show preview immediately
  previewTimesheetModal(allocId);
  toast('✅ تم توليد الـ Timesheet');
}

// ── Print Timesheet PDF ──────────────────────────────────────────
function printTimesheetPDF(allocId){
  initTimesheet();
  var a=DB.allocations.find(function(x){return x.id===allocId;});
  if(!a||!a.tsRows){toast('الـ Timesheet لم يُولَّد بعد');return;}
  var emp=DB.employees.find(function(e){return e.id===a.empId;})||{name:a.empId,pos:'',nameEn:''};
  var org=DB.org||{};
  var mName=MONTHS[a.month-1]+' '+a.year;
  var totalWorkHrs=a.tsRows.filter(function(r){return r.type==='work';}).reduce(function(s,r){return s+r.totalHours;},0);

  var projHeaders=a.projects.map(function(p){return '<th style="padding:6px;border:1px solid #ccc;background:#1e3a5f;color:white;font-size:10px;">'+p.projName.substring(0,14)+'</th>';}).join('');
  var projTotals=a.projects.map(function(p){
    var hrs=a.tsRows.filter(function(r){return r.type==='work';}).reduce(function(s,r){var pa=r.allocs.find(function(x){return x.proj===p.proj;});return s+(pa?pa.hours:0);},0);
    return '<td style="padding:6px;border:1px solid #ccc;text-align:center;font-weight:900;background:#1e3a5f;color:white;">'+hrs+'</td>';
  }).join('');

  var dataRows=a.tsRows.map(function(row,ri){
    var isWork=row.type==='work';
    var bg=ri%2===0?'#f8f9fa':'white';
    if(row.type==='leave') bg='#fff9c4';
    if(row.type==='weekend'||row.type==='holiday') bg='#f0f0f0';
    var typeLabel=isWork?'Work':row.type==='leave'?'Leave':row.type==='holiday'?'Holiday':'Weekend';
    var cells=a.projects.map(function(p){
      var pa=isWork?row.allocs.find(function(x){return x.proj===p.proj;}):null;
      var hrs=pa?pa.hours:'';
      return '<td style="padding:5px;border:1px solid #eee;text-align:center;font-size:10px;">'+(hrs||'')+'</td>';
    }).join('');
    return '<tr style="background:'+bg+';">'
      +'<td style="padding:5px;border:1px solid #eee;font-size:10px;">'+row.date+'</td>'
      +'<td style="padding:5px;border:1px solid #eee;font-size:10px;">'+row.dayName+'</td>'
      +'<td style="padding:5px;border:1px solid #eee;font-size:10px;font-weight:600;">'+typeLabel+'</td>'
      +cells
      +'<td style="padding:5px;border:1px solid #eee;text-align:center;font-weight:800;font-size:10px;">'+(isWork?row.totalHours:'')+'</td>'
      +'</tr>';
  }).join('');

  // Cost allocation table
  var costRows=a.projects.map(function(p){
    var hrs=a.tsRows.filter(function(r){return r.type==='work';}).reduce(function(s,r){var pa=r.allocs.find(function(x){return x.proj===p.proj;});return s+(pa?pa.hours:0);},0);
    var cost=Math.round(a.salary*p.pct/100);
    return '<tr><td style="padding:6px 10px;border-bottom:1px solid #eee;">'+p.projName+'</td>'
      +'<td style="padding:6px 10px;border-bottom:1px solid #eee;text-align:center;">'+p.pct+'%</td>'
      +'<td style="padding:6px 10px;border-bottom:1px solid #eee;text-align:center;">'+hrs+'</td>'
      +'<td style="padding:6px 10px;border-bottom:1px solid #eee;text-align:left;font-weight:700;">'+cost.toLocaleString()+' ج.م</td></tr>';
  }).join('');

  var html='<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8">'
    +'<style>body{font-family:Cairo,Arial,sans-serif;font-size:11px;margin:0;padding:20px;color:#222;}'
    +'table{border-collapse:collapse;width:100%;}th,td{vertical-align:middle;}'
    +'.header{background:#1e3a5f;color:white;padding:16px 20px;border-radius:10px;margin-bottom:16px;}'
    +'@media print{.no-print{display:none;}}</style></head><body>'
    +'<div class="header">'
    +'<div style="font-size:18px;font-weight:900;">⏱️ Timesheet — '+mName+'</div>'
    +'<div style="font-size:12px;opacity:.8;">'+(org.name||'الجمعية')+'</div></div>'

    +'<table style="margin-bottom:16px;font-size:11px;"><tr>'
    +'<td width="50%"><strong>اسم الموظف:</strong> '+emp.name+'</td>'
    +'<td width="50%"><strong>المسمى الوظيفي:</strong> '+(emp.pos||'—')+'</td></tr><tr>'
    +'<td><strong>الشهر:</strong> '+mName+'</td>'
    +'<td><strong>إجمالي الساعات:</strong> '+totalWorkHrs+' ساعة</td></tr></table>'

    +'<table style="margin-bottom:20px;">'
    +'<tr style="background:#1e3a5f;color:white;">'
    +'<th style="padding:6px;border:1px solid #ccc;font-size:10px;">التاريخ</th>'
    +'<th style="padding:6px;border:1px solid #ccc;font-size:10px;">اليوم</th>'
    +'<th style="padding:6px;border:1px solid #ccc;font-size:10px;">النوع</th>'
    +projHeaders
    +'<th style="padding:6px;border:1px solid #ccc;background:#1e3a5f;color:white;font-size:10px;">الإجمالي</th></tr>'
    +dataRows
    +'<tr style="background:#1e3a5f;"><td colspan="3" style="padding:6px;border:1px solid #ccc;color:white;font-weight:800;">الإجمالي الكلي</td>'
    +projTotals
    +'<td style="padding:6px;border:1px solid #ccc;text-align:center;font-weight:900;background:#1e3a5f;color:white;">'+totalWorkHrs+'</td></tr></table>'

    +'<div style="font-size:13px;font-weight:800;color:#1e3a5f;margin-bottom:8px;">توزيع التكلفة (Cost Allocation)</div>'
    +'<table style="margin-bottom:20px;">'
    +'<tr style="background:#f0f9ff;"><th style="padding:6px 10px;text-align:right;">المشروع</th>'
    +'<th style="padding:6px 10px;">النسبة</th><th style="padding:6px 10px;">الساعات</th>'
    +'<th style="padding:6px 10px;">التكلفة</th></tr>'+costRows
    +'<tr style="background:#1e3a5f;color:white;"><td style="padding:7px 10px;font-weight:800;">الإجمالي</td>'
    +'<td style="padding:7px 10px;text-align:center;font-weight:800;">100%</td>'
    +'<td style="padding:7px 10px;text-align:center;font-weight:800;">'+totalWorkHrs+'</td>'
    +'<td style="padding:7px 10px;text-align:left;font-weight:800;">'+a.salary.toLocaleString()+' ج.م</td></tr></table>'

    +'<table style="margin-top:30px;"><tr>'
    +'<td style="text-align:center;width:33%;padding-top:40px;border-top:1px solid #333;">توقيع الموظف</td>'
    +'<td style="width:4%;"></td>'
    +'<td style="text-align:center;width:33%;padding-top:40px;border-top:1px solid #333;">توقيع المدير المباشر</td>'
    +'<td style="width:4%;"></td>'
    +'<td style="text-align:center;width:33%;padding-top:40px;border-top:1px solid #333;">توقيع المدير المالي</td>'
    +'</tr></table>'
    +'</body></html>';

  printContent('Timesheet — '+emp.name+' — '+mName, html);
}

var _holCount=0;
function addHoliday(){
  var container=document.getElementById('ts-hols');
  if(!container)return;
  var i=_holCount++;
  var div=document.createElement('div');
  div.id='hol-row-'+i;
  div.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr 28px;gap:6px;margin-bottom:5px;">'
    +'<input id="hol-date-'+i+'" type="date" class="hol-date">'
    +'<input id="hol-name-'+i+'" placeholder="اسم العطلة" class="hol-name">'
    +'<button onclick="removeHoliday('+i+')" style="background:#fee2e2;border:none;border-radius:7px;color:#c0392b;cursor:pointer;">×</button>'
    +'</div>';
  container.appendChild(div);
}

function removeHoliday(i){
  var row=document.getElementById('hol-row-'+i)||document.getElementById('hol-date-'+i);
  if(row&&row.parentElement) row.parentElement.parentElement.remove();
  else if(row) row.parentElement.remove();
}

function saveTsSettings(){
  initTimesheet();
  var hrs=parseInt((document.getElementById('ts-hrs')||{}).value)||8;
  var rounding=(document.getElementById('ts-rounding')||{}).value||'whole';
  var wds=[];
  for(var i=0;i<7;i++){var cb=document.getElementById('ts-wd-'+i);if(cb&&cb.checked)wds.push(i);}
  var hols=[];
  document.querySelectorAll('.hol-date').forEach(function(inp,i){
    var nameInp=document.querySelectorAll('.hol-name')[i];
    if(inp.value&&nameInp) hols.push({date:inp.value,name:nameInp.value||inp.value});
  });
  DB.tsSettings={dailyHours:hrs,workDays:wds,holidays:hols,rounding:rounding,allowEdit:true};
  save();cm();
  toast('✅ تم حفظ إعدادات الـ Timesheet');
}

function generateForm41(){
  var q=parseInt((document.getElementById('f41-q')||{}).value)||1;
  var y=parseInt((document.getElementById('f41-y')||{}).value)||new Date().getFullYear();
  var doc=(document.getElementById('f41-doc')||{}).value||'';

  // Date range for quarter
  var qStart=[[1,1],[4,1],[7,1],[10,1]][q-1];
  var qEnd=  [[3,31],[6,30],[9,30],[12,31]][q-1];
  var fromDate=y+'-'+String(qStart[0]).padStart(2,'0')+'-'+String(qStart[1]).padStart(2,'0');
  var toDate  =y+'-'+String(qEnd[0]).padStart(2,'0')  +'-'+String(qEnd[1]).padStart(2,'0');

  // Find all posted entries in this quarter with third party + withholding
  var rows=[];
  var serial=1;
  (DB.entries||[]).filter(function(e){
    return e.status==='posted' && e.date>=fromDate && e.date<=toDate;
  }).forEach(function(entry){
    entry.lines.forEach(function(ln){
      if(!ln.tpId) return;
      var tp=DB.thirdParties.find(function(t){return t.id===ln.tpId;});
      if(!tp||!tp.taxId) return;
      var grossAmt=ln.dr||ln.cr||0;
      if(!grossAmt) return;
      var whtRate=(tp.whtRate||0)/100;
      if(!whtRate) return;
      var netAmt=Math.round(grossAmt/(1+whtRate)*100)/100;
      var whtAmt=Math.round(grossAmt*whtRate/(1+whtRate)*100)/100;

      rows.push({
        serial:serial++,
        taxId:tp.taxId||'',
        fileId:tp.fileId||'-',
        name:tp.name||'',
        address:tp.address||'',
        date:entry.date,
        txType:tp.whtType||'خدمات',
        txTypeCode:'ا.ت',
        grossAmt:grossAmt,
        deductType:tp.whtType||'',
        deductCode:'-',
        netAmt:netAmt,
        whtRate:tp.whtRate||0,
        whtAmt:whtAmt,
        entryId:entry.id,
        desc:entry.desc
      });
    });
  });

  // ── GL balance for verification ──────────────────────────────
  var B=bals();
  var b2114=B['2114']||{cr:0,dr:0};
  var glTotal=Math.round((b2114.cr-b2114.dr)*100)/100;
  var glWHT={'2114':glTotal};

  if(!rows.length && glTotal<=0){
    toast('⚠️ لا توجد معاملات بخصم ضريبي في هذه الفترة\nتأكد من:\n• إضافة الرقم الضريبي للطرف الثالث\n• تحديد نسبة الخصم في بيانات الطرف');
    return;
  }

  var totalWHT=rows.reduce(function(s,r){return s+r.whtAmt;},0);
  var prev=((DB.form41||[]).filter(function(f){
    return (f.quarter<q&&f.year===y)||(f.year<y);
  }).sort(function(a,b){return b.createdAt>a.createdAt?1:-1;})[0]||{}).totalWHT||0;

  if(!DB.form41) DB.form41=[];
  var form={
    id:'F41-'+Date.now(),
    quarter:q, year:y, docNum:doc,
    rows:rows,
    glWHT:glWHT,
    glTotal:Math.round(glTotal*100)/100,
    totalWHT:Math.round(totalWHT*100)/100,
    prevTotal:Math.round(prev*100)/100,
    grandTotal:Math.round((totalWHT+prev)*100)/100,
    createdAt:new Date().toISOString()
  };
  DB.form41.push(form);
  save();
  sub('form41');
  toast('✅ تم توليد النموذج 41 — '+rows.length+' معاملة');
  setTimeout(function(){printForm41(form.id);},300);
}

function deleteForm41(id){
  if(!confirm('حذف هذا النموذج؟'))return;
  DB.form41=(DB.form41||[]).filter(function(f){return f.id!==id;});
  save();sub('form41');
}

// ── SheetJS loader (CDN) ─────────────────────────────────────────
function loadSheetJS(callback){
  if(window.XLSX){ callback(); return; }
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=function(){ callback(); };
  s.onerror=function(){ toast('❌ تعذر تحميل مكتبة Excel'); };
  document.head.appendChild(s);
}

// ── Helper: download workbook ─────────────────────────────────────
function downloadXLSX(wb, filename){
  var wbout=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  var blob=new Blob([wbout],{type:'application/octet-stream'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Helper: style sheet header row ───────────────────────────────
function xlsxHeader(ws, headers, row){
  // headers = array of column titles
  // SheetJS doesn't support rich styles in free version
  // We use column widths instead
  var wscols=headers.map(function(h){return {wch:Math.max(h.length+4,14)};});
  ws['!cols']=wscols;
}

  h+='<div style="font-weight:900;color:#0D3B6E;font-size:13px;">'+e.id+'</div>';
  h+='</div></div>';
  // Meta grid
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;">';
  h+='<div><div style="font-size:10px;color:#6b7280;">التاريخ</div><strong>'+e.date+'</strong></div>';
  h+='<div><div style="font-size:10px;color:#6b7280;">المرجع</div><strong>'+(e.ref||'—')+'</strong></div>';
  h+='<div><div style="font-size:10px;color:#6b7280;">الإجمالي</div><strong>'+fmt(tD)+' ج.م</strong></div>';
  h+='</div>';
  h+='<div style="margin-bottom:10px;"><div style="font-size:10px;color:#6b7280;">البيان</div>'
    +'<strong style="font-size:13px;">'+e.desc+'</strong></div>';
  if(proj.name)h+='<div style="margin-bottom:8px;"><div style="font-size:10px;color:#6b7280;">المشروع</div>'
    +'<strong>'+proj.name+'</strong></div>';
  h+='</div>';
  // Lines table
  h+='<table><thead><tr>'
    +'<th>الحساب</th><th>الاسم</th><th>الطرف الثالث</th><th>WBS</th>'
    +'<th class="tn">مدين</th><th class="tn">دائن</th>'
    +'</tr></thead><tbody>'+linesHtml+'</tbody>'
    +'<tfoot><tr><td colspan="4" style="font-weight:900;">الإجمالي</td>'
    +'<td class="tn">'+fmt(tD)+'</td><td class="tn">'+fmt(tD)+'</td>'
    +'</tr></tfoot></table>';
  // Signatures + QR
  h+='<div style="background:#f0f9ff;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:11px;color:#0D3B6E;font-weight:700;">التفقيط: '+tafqeet(tD)+'</div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-end;'
    +'margin-top:24px;gap:12px;">';
  h+='<div style="flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">';
  ['أعده المحاسب','راجعه','اعتمده'].forEach(function(sig){
    h+='<div style="border-top:1px solid #374151;padding-top:6px;text-align:center;'
      +'font-size:10px;color:#6b7280;">'+sig+'</div>';
  });
  h+='</div>';

  h+='<div id="__QR__" style="width:120px;height:120px;"></div>';



  h+='<div style="font-size:8.5px;color:#9ca3af;margin-top:3px;">امسح للأرشفة</div>';
  h+='</div></div>';

  // ── QR: draw directly on canvas in current page, convert to dataURL ──
  var qrCanvas=document.createElement('canvas');
  qrCanvas.width=120; qrCanvas.height=120;
  var qrCtx=qrCanvas.getContext('2d');
  qrCtx.fillStyle='#ffffff'; qrCtx.fillRect(0,0,120,120);
  qrCtx.fillStyle='#0D3B6E';
  // Draw simple grid encoding entry ID
  var qrText=e.id;
  var cellCount=21; var cellPx=Math.floor(120/cellCount);
  // Finder patterns (3 corners)
  [[0,0],[0,cellCount-7],[cellCount-7,0]].forEach(function(p){
    qrCtx.fillStyle='#0D3B6E';
    qrCtx.fillRect(p[1]*cellPx,p[0]*cellPx,7*cellPx,7*cellPx);
    qrCtx.fillStyle='#ffffff';
    qrCtx.fillRect((p[1]+1)*cellPx,(p[0]+1)*cellPx,5*cellPx,5*cellPx);
    qrCtx.fillStyle='#0D3B6E';
    qrCtx.fillRect((p[1]+2)*cellPx,(p[0]+2)*cellPx,3*cellPx,3*cellPx);
  });
  // Data pattern from text
  qrCtx.fillStyle='#0D3B6E';
  for(var qi=0;qi<qrText.length;qi++){
    var code=qrText.charCodeAt(qi);
    for(var bit=0;bit<8;bit++){
      if((code>>bit)&1){
        var qr=qi*8+bit;
        var qrow=8+Math.floor(qr/cellCount);
        var qcol=Math.floor(qr%cellCount);
        if(qrow<cellCount-7) qrCtx.fillRect(qcol*cellPx,qrow*cellPx,cellPx,cellPx);
      }
    }
  }
  // Convert to data URL and embed in HTML
  var qrDataUrl=qrCanvas.toDataURL('image/png');
  var qrImgTag='<img src="'+qrDataUrl+'" width="120" height="120" style="display:block;border:1px solid #e5e7eb;border-radius:4px;">';
  h=h.replace('<div id="__QR__" style="width:120px;height:120px;"></div>', qrImgTag);
  printContent('سند قيد يومية — '+e.id, h);
}

// ── Global Search Engine ──────────────────────────────────────────
function globalSearch(query){
  if(!query||query.trim().length<2) return [];
  var q=query.trim().toLowerCase();
  var results=[];

  // 1. Entries
  (DB.entries||[]).filter(function(e){return e.status==='posted';}).forEach(function(e){
    var score=0; var matches=[];
    if(e.id.toLowerCase().includes(q)){score+=10;matches.push('رقم القيد: '+e.id);}
    if(e.desc&&e.desc.toLowerCase().includes(q)){score+=8;matches.push('البيان: '+e.desc);}
    if(e.date&&e.date.includes(q)){score+=6;matches.push('التاريخ: '+e.date);}
    if(e.ref&&e.ref.toLowerCase().includes(q)){score+=7;matches.push('المرجع: '+e.ref);}
    if(e.proj&&e.proj.toLowerCase().includes(q)){score+=5;matches.push('المشروع: '+e.proj);}
    if(e.contractId&&e.contractId.toLowerCase().includes(q)){score+=6;matches.push('العقد: '+e.contractId);}
    // Search in lines
    (e.lines||[]).forEach(function(l){
      if(l.tpName&&l.tpName.toLowerCase().includes(q)){score+=8;matches.push('الطرف الثالث: '+l.tpName);}
      var acc=DB.accounts.find(function(a){return a.c===l.acc;});
      if(acc&&acc.n.toLowerCase().includes(q)){score+=4;matches.push('الحساب: '+acc.n);}
    });
    if(score>0){
      var totalDr=(e.lines||[]).reduce(function(s,l){return s+(l.dr||0);},0);
      results.push({type:'entry',score:score,matches:matches,
        id:e.id,date:e.date,desc:e.desc,ref:e.ref||'',
        proj:e.proj||'',amount:totalDr,
        docCount:(DB.entryDocs&&DB.entryDocs[e.id])?DB.entryDocs[e.id].length:0,
        status:(DB.archiveLog[e.id]||{}).status||'pending'});
    }
  });

  // 2. Contracts
  (DB.contracts||[]).forEach(function(ct,i){
    var score=0; var matches=[];
    if(ct.name&&ct.name.toLowerCase().includes(q)){score+=10;matches.push('اسم العقد: '+ct.name);}
    if(ct.project&&ct.project.toLowerCase().includes(q)){score+=6;matches.push('المشروع: '+ct.project);}
    var tp=(DB.thirdParties||[]).find(function(t){return t.id===ct.party;});
    if(tp&&tp.name.toLowerCase().includes(q)){score+=8;matches.push('المورد: '+tp.name);}
    if(ct.desc&&ct.desc.toLowerCase().includes(q)){score+=5;matches.push('الوصف: '+ct.desc);}
    if(score>0)results.push({type:'contract',score:score,matches:matches,
      id:'CT-'+i,name:ct.name,party:tp?tp.name:'',
      value:ct.value,project:ct.project||''});
  });

  // 3. Suppliers
  (DB.thirdParties||[]).forEach(function(tp){
    var score=0; var matches=[];
    if(tp.name&&tp.name.toLowerCase().includes(q)){score+=10;matches.push('الاسم: '+tp.name);}
    if(tp.taxId&&tp.taxId.includes(q)){score+=8;matches.push('الرقم الضريبي: '+tp.taxId);}
    if(tp.phone&&tp.phone.includes(q)){score+=6;matches.push('الهاتف: '+tp.phone);}
    if(score>0){
      var tpEntries=(DB.entries||[]).filter(function(e){
        return e.status==='posted'&&(e.lines||[]).some(function(l){return l.tpId===tp.id;});
      });
      results.push({type:'supplier',score:score,matches:matches,
        id:tp.id,name:tp.name,type2:tp.type||'',
        entryCount:tpEntries.length});
    }
  });

  // 4. Projects
  (DB.projects||[]).forEach(function(pr){
    var score=0; var matches=[];
    if(pr.name&&pr.name.toLowerCase().includes(q)){score+=10;matches.push('اسم المشروع: '+pr.name);}
    if(pr.donor&&pr.donor.toLowerCase().includes(q)){score+=8;matches.push('المانح: '+pr.donor);}
    if(pr.code&&pr.code.toLowerCase().includes(q)){score+=7;matches.push('كود: '+pr.code);}
    if(score>0){
      var prEntries=(DB.entries||[]).filter(function(e){return e.status==='posted'&&e.proj===pr.name;});
      results.push({type:'project',score:score,matches:matches,
        id:pr.code||pr.name,name:pr.name,donor:pr.donor||'',
        entryCount:prEntries.length});
    }
  });


  // 5. Navigation / Screens
  var navItems=[
    {q:['قيد','قيود','يومية','ترحيل'],label:'📝 القيود اليومية',action:{type:'nav',pg:'jour'}},
    {q:['مرتب','مرتبات','رواتب','إعداد مرتب'],label:'💳 كشف الرواتب',action:{type:'pg',pg:'pay'}},

    {q:['ميزان','مراجعة','trial'],label:'⚖️ ميزان المراجعة',action:{type:'sub',pg:'trial'}},
    {q:['ميزانية','balance'],label:'📈 الميزانية العمومية',action:{type:'sub',pg:'balance'}},

    {q:['نموذج 41','form41','خصم مصدر'],label:'📋 نموذج 41',action:{type:'sub',pg:'form41'}},
    {q:['أستاذ','ledger','tpledger'],label:'📒 الأستاذ المساعد',action:{type:'sub',pg:'tpledger'}},
    {q:['ذكاء','ai','مساعد'],label:'🤖 المساعد الذكي',action:{type:'sub',pg:'ai'}},
    {q:['إعداد','إعدادات','settings'],label:'⚙️ الإعدادات',action:{type:'sub',pg:'settings'}},
    {q:['تدفق نقدي','cashflow','forecast'],label:'💵 التدفق النقدي',action:{type:'sub',pg:'cashforecast'}},
    {q:['مانح','مانحين','donorledger'],label:'🌍 دفتر المانحين',action:{type:'sub',pg:'donorledger'}},
    {q:['حزمة','مراجعة','audit'],label:'📦 حزمة المراجعة',action:{type:'sub',pg:'audit'}},
    {q:['بحث','search'],label:'🔍 البحث الشامل',action:{type:'sub',pg:'search'}},
  ];
  navItems.forEach(function(item){
    var matched=item.q.some(function(kw){return kw.includes(q)||q.includes(kw);});
    if(matched) results.unshift({type:'nav',score:15,matches:['شاشة: '+item.label],
      id:'nav-'+item.label,label:item.label,action:item.action,desc:'انتقل إلى الشاشة'});
  });

  // Sort by score
  results.sort(function(a,b){return b.score-a.score;});
  return results.slice(0,50);
}

function rSearchResults(query){

  var entries=(DB.entries||[]).filter(function(e){
    if(e.status!=='posted') return false;
    if(fromDate&&e.date<fromDate) return false;
    if(toDate&&e.date>toDate) return false;
    if(proj&&proj!==''){
      var pr=( DB.projects||[]).find(function(p){return p.code===proj||p.name===proj;});
      var match=e.proj===proj||(pr&&(e.proj===pr.code||e.proj===pr.name));
      if(!match) return false;
    }
