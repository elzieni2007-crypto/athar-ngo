<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أثر | للحلول المالية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--n:#1e3a6e;--nd:#152a52;--sk:#29abe2;--skp:#e8f6fd;--gr:#059669;--gbg:#d1fae5;--rd:#dc2626;--rbg:#fee2e2;--am:#d97706;--abg:#fef3c7;--g1:#f0f5fa;--g2:#e2eaf3;--g4:#94a8c2;--g5:#637591;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Cairo",sans-serif;background:var(--g1);direction:rtl;}
.topbar{background:linear-gradient(135deg,var(--nd),var(--n));color:white;padding:0 14px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.tb-brand{display:flex;align-items:center;gap:9px;}
.tb-logo{width:34px;height:34px;border-radius:7px;background:white;padding:3px;}
.tb-name{font-family:"Tajawal",sans-serif;font-size:16px;font-weight:900;}
.tb-sub{font-size:10px;opacity:.7;margin-top:1px;}
.tb-org{font-size:11px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.content{padding:14px;padding-bottom:72px;}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--nd);display:flex;justify-content:space-around;padding:6px 0 8px;z-index:50;border-top:1px solid rgba(255,255,255,.1);}
.bn{display:flex;flex-direction:column;align-items:center;color:rgba(255,255,255,.55);font-size:9.5px;cursor:pointer;padding:5px 10px;border-radius:8px;font-family:"Cairo",sans-serif;}
.bn.on,.bn:hover{color:white;background:rgba(41,171,226,.2);}
.bn-i{font-size:19px;margin-bottom:2px;}
.pg{display:none;} .pg.on{display:block;}
.card{background:white;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(30,58,110,.08);border:1px solid var(--g2);}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.ct{font-family:"Tajawal",sans-serif;font-size:15px;font-weight:800;color:var(--n);}
.hero{background:linear-gradient(135deg,var(--nd),var(--n) 55%,var(--sk));border-radius:14px;padding:18px;margin-bottom:14px;color:white;}
.hero-logo{width:42px;height:42px;border-radius:9px;background:white;padding:3px;margin-bottom:10px;}
.hero-t{font-family:"Tajawal",sans-serif;font-size:20px;font-weight:900;}
.hero-s{font-size:11.5px;opacity:.8;margin-top:4px;}
.hero-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.htag{background:rgba(255,255,255,.15);color:white;font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.st{background:white;border-radius:12px;padding:13px 10px;text-align:center;box-shadow:0 2px 10px rgba(30,58,110,.08);border:1px solid var(--g2);}
.sv{font-family:"Tajawal",sans-serif;font-size:16px;font-weight:900;color:var(--n);line-height:1;}
.sl{font-size:10.5px;color:var(--g4);margin-top:4px;}
.si{font-size:22px;margin-bottom:5px;}
.btn{background:var(--n);color:white;border:none;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:700;font-family:"Cairo",sans-serif;cursor:pointer;}
.btn-sky{background:var(--sk);}
.btn-gr{background:var(--gr);}
.btn-rd{background:var(--rd);}
.btn-gy{background:var(--g5);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-bl{width:100%;display:block;margin-bottom:8px;text-align:center;}
.pw{height:7px;background:var(--g1);border-radius:4px;overflow:hidden;}
.pb{height:100%;border-radius:4px;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;}
.bg{background:var(--gbg);color:#065f46;}
.br{background:var(--rbg);color:#991b1b;}
.bb{background:#dbeafe;color:var(--n);}
.ba{background:var(--abg);color:#92400e;}
.bgy{background:var(--g1);color:var(--g5);}
.fg{margin-bottom:11px;}
label{font-size:11px;font-weight:700;color:var(--g5);display:block;margin-bottom:4px;}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--g2);border-radius:9px;font-size:13px;font-family:"Cairo",sans-serif;box-sizing:border-box;color:#0f1e35;background:white;outline:none;}
input:focus,select:focus{border-color:var(--sk);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:var(--g1);padding:9px 10px;text-align:right;color:var(--g5);font-size:11px;font-weight:700;border-bottom:2px solid var(--g2);}
tbody td{padding:9px 10px;border-bottom:1px solid var(--g1);vertical-align:middle;}
tbody tr:hover td{background:var(--skp);}
.tn{text-align:left;font-weight:600;}
.td{color:var(--rd);} .tc{color:var(--gr);}
.mo{display:none;position:fixed;inset:0;background:rgba(15,30,53,.6);z-index:200;align-items:center;justify-content:center;}
.mo.on{display:flex;}
.mb{background:white;border-radius:16px;width:95%;max-width:520px;max-height:92vh;overflow-y:auto;}
.mh{background:linear-gradient(135deg,var(--nd),var(--n));color:white;padding:15px 18px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center;}
.mt{font-family:"Tajawal",sans-serif;font-size:15px;font-weight:800;}
.mx{background:rgba(255,255,255,.15);border:none;color:white;border-radius:7px;padding:4px 10px;font-size:16px;cursor:pointer;}
.mbdy{padding:18px;}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.ph-t{font-family:"Tajawal",sans-serif;font-size:19px;font-weight:900;color:var(--n);}
.ph-s{font-size:11px;color:var(--g4);margin-top:2px;}
.ec{background:white;border-radius:12px;border:1px solid var(--g2);padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(30,58,110,.06);}
.sb{border-radius:8px;padding:9px 11px;text-align:center;}
.ps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.pb2{border-radius:10px;padding:12px;text-align:center;}
.pv{font-family:"Tajawal",sans-serif;font-size:16px;font-weight:900;}
.pl{font-size:10px;color:var(--g5);margin-top:3px;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--n);color:white;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.on{opacity:1;}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mi{background:white;border-radius:12px;border:1px solid var(--g2);padding:16px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(30,58,110,.06);}
.mi-i{font-size:28px;margin-bottom:7px;}
.mi-t{font-weight:700;font-size:13px;color:var(--n);}
.sd{display:flex;align-items:center;gap:8px;margin:14px 0 10px;color:var(--g5);font-size:11px;font-weight:700;}
.sd::before,.sd::after{content:"";flex:1;height:1px;background:var(--g2);}
</style>
</head>

// PAYROLL CALC
function calc(e){
  var sal=e.sal||0,al=e.allow||0,nw=e.natWork||0,tr=e.transport||0,ot=e.overtime||0,ded=e.deduct||0;
  var gross=sal+al+nw+tr+ot;
  var iBase=Math.min(sal+al,10400);
  var empI=e.ins==="none"?0:Math.round(iBase*0.11);
  var emplI=e.ins==="full"?Math.round(iBase*0.1875):0;
  var mar=Math.round(gross*0.0005);
  var tBase=Math.max(0,gross-empI-1666.67)*12;
  var at=0;
  if(tBase>1200000)at=241375+(tBase-1200000)*0.275;
  else if(tBase>400000)at=61375+(tBase-400000)*0.225;
  else if(tBase>200000)at=21375+(tBase-200000)*0.2;
  else if(tBase>70000)at=1875+(tBase-70000)*0.15;
  else if(tBase>55000)at=375+(tBase-55000)*0.1;
  else if(tBase>40000)at=(tBase-40000)*0.025;
  var tax=Math.round(at/12);
  var net=gross-empI-tax-mar-ded;
  return{gross:gross,empI:empI,emplI:emplI,mar:mar,tax:tax,net:net,cost:gross+emplI};
}

}

function saveE(){

    var b=B[a.c]||{dr:0,cr:0};
    if(!b.dr&&!b.cr)return;
    var net=a.nat==="dr"?b.dr-b.cr:b.cr-b.dr;
    tD+=b.dr;tC+=b.cr;
    h+='<tr><td>'+a.n+'</td>';
    h+='<td class="td tn">'+(b.dr>0?fmt(b.dr):"-")+'</td>';
    h+='<td class="tc tn">'+(b.cr>0?fmt(b.cr):"-")+'</td>';
    h+='<td class="tn" style="font-weight:700;">'+fmt(Math.abs(net))+'</td></tr>';
  });
  var ok=Math.abs(tD-tC)<0.01;
  return h+'</tbody><tfoot><tr style="background:var(--n);"><td style="color:white;font-weight:900;padding:9px;">الإجمالي</td>'
    +'<td style="color:white;font-weight:800;padding:9px;text-align:left;">'+fmt(tD)+'</td>'
    +'<td style="color:white;font-weight:800;padding:9px;text-align:left;">'+fmt(tC)+'</td>'
    +'<td style="color:white;padding:9px;">'+(ok?"✅ متوازن":"⚠️ غير متوازن")+'</td></tr></tfoot></table>';
}
function rBalPage(){

}
function rIncPage(){

function rBVAPage(){

function rInvPage(){
  if(!DB.inventory)DB.inventory=[];
  if(!DB.invMovements)DB.invMovements=[];

  h+='<button class="btn btn-sky btn-sm" onclick="showInvHistory()">📋 الحركات</button></div>';
  h+='<button class="btn btn-sky btn-bl" onclick="newItem()">+ صنف جديد</button>';

    h+='<div class="card" style="margin-bottom:10px;">';

    h+='<div class="sg" style="margin-bottom:8px;">';
    h+='<div class="st" style="padding:9px;background:var(--skp);"><div style="font-size:10px;color:var(--g4);">الكمية</div><div style="font-weight:900;font-size:18px;color:var(--n);">'+item.qty+'</div><div style="font-size:10px;color:var(--g4);">'+item.unit+'</div></div>';
    h+='<div class="st" style="padding:9px;background:var(--gbg);"><div style="font-size:10px;color:var(--g4);">القيمة</div><div style="font-weight:800;font-size:14px;color:var(--gr);">'+fmt((item.qty||0)*(item.cost||0))+'</div><div style="font-size:10px;color:var(--g4);">ج.م</div></div>';

    h+='<button class="btn btn-sky btn-sm" onclick="addStock('+i+')">📥 إضافة</button>';
    h+='<button class="btn btn-sm btn-gy" onclick="outStock('+i+')">📤 صرف</button>';
    h+='</div></div>';
  });
  return h;
}

    h+='<div style="background:var(--rbg);border-radius:7px;padding:7px;"><div style="color:var(--g4);font-size:10px;">تأمين</div><div style="font-weight:800;color:var(--rd);">'+fmt(r.empI)+'</div></div>';
    h+='<div style="background:var(--abg);border-radius:7px;padding:7px;"><div style="color:var(--g4);font-size:10px;">ضريبة</div><div style="font-weight:800;color:var(--am);">'+fmt(r.tax)+'</div></div>';
    h+='</div>';
    h+='<button class="btn btn-sm" onclick="editSal('+i+');cm();" style="width:100%;margin-top:8px;background:var(--sk);font-size:12px;">✏️ تعديل المرتب</button>';

function rSetPage(){
  var org=DB.org||{};
  var h='<div class="ph-t" style="margin-bottom:14px;">⚙️ الإعدادات</div>';
  h+='<div class="fg"><label>اسم الجمعية</label><input id="set-org" value="'+(org.name||'')+'" placeholder="اسم الجمعية"></div>';
  h+='<div class="fg"><label>رقم السجل</label><input id="set-reg" value="'+(org.reg||'')+'" placeholder="رقم السجل"></div>';
  h+='<div class="fg"><label>المحافظة</label><input id="set-gov" value="'+(org.gov||'')+'" placeholder="القاهرة"></div>';
  h+='<div style="display:flex;gap:8px;margin-bottom:16px;">';
  h+='<button class="btn" onclick="saveSet()" style="flex:1;">✅ حفظ</button></div>';
  h+='<div class="sd">البيانات والنسخ الاحتياطي</div>';
  h+='<button class="btn btn-gy" style="width:100%;margin-bottom:8px;" onclick="exportDB()">📤 تصدير البيانات (JSON)</button>';
  h+='<button class="btn btn-rd" style="width:100%;" onclick="if(confirm(\'هل أنت متأكد من مسح جميع البيانات؟\'))resetDB()">🗑️ مسح جميع البيانات</button>';
  h+='<div style="margin-top:14px;background:var(--g1);border-radius:8px;padding:10px;font-size:10.5px;color:var(--g4);text-align:center;">';
  h+='أثر للحلول المالية — النسخة 1.0<br>تطوير تنمويين مصر</div>';
  return h;

function saveSet(){
  if(!DB.org)DB.org={};
  DB.org.name=sv("set-org");DB.org.reg=sv("set-reg");DB.org.gov=sv("set-gov");
  save();toast("✅ تم حفظ الإعدادات");
  var tb=document.querySelector(".tb-org");
  if(tb&&DB.org.name)tb.textContent=DB.org.name;
}
function exportDB(){
  var d=JSON.stringify(DB,null,2);
  var b=new Blob([d],{type:"application/json"});
  var u=URL.createObjectURL(b);
  var a=document.createElement("a");a.href=u;a.download="athar-backup.json";a.click();
  URL.revokeObjectURL(u);toast("✅ تم التصدير");
}
function resetDB(){
  localStorage.removeItem("atharDB");
  location.reload();
}

function newItem(){
  var h='<div class="fr"><div class="fg"><label>كود الصنف *</label><input id="it-c" placeholder="ITM003"></div><div class="fg"><label>اسم الصنف *</label><input id="it-n"></div></div>';
  h+='<div class="fr"><div class="fg"><label>الوحدة</label><input id="it-u" placeholder="جهاز / كيت ..."></div><div class="fg"><label>الكمية</label><input type="number" id="it-q" value="0"></div></div>';
  h+='<div class="fg"><label>سعر الوحدة (ج.م)</label><input type="number" id="it-p" value="0"></div>';
  h+='<div style="display:flex;gap:8px;margin-top:4px;"><button class="btn" onclick="saveItem()" style="flex:1;">✅ إضافة</button><button class="btn btn-gy" onclick="cm()">إلغاء</button></div>';
  om("صنف جديد",h);
}
function saveItem(){
  var c=sv("it-c"),n=sv("it-n");
  if(!c||!n){alert("الكود والاسم مطلوبان");return;}
  if(!DB.inventory)DB.inventory=[];
  DB.inventory.push({code:c,name:n,unit:sv("it-u"),qty:fv("it-q"),cost:fv("it-p")});
  save();cm();sub("inventory");toast("✅ تم إضافة الصنف");
}
function addStock(i){
  var item=DB.inventory[i];
  var h='<div style="background:var(--gbg);border-radius:8px;padding:10px;margin-bottom:12px;color:#065f46;font-size:12px;">الكمية الحالية: <strong>'+item.qty+' '+item.unit+'</strong></div>';
  h+='<div class="fg"><label>الكمية المضافة *</label><input type="number" id="add-stq" min="1"></div>';
  h+='<div class="fg"><label>السبب / المرجع</label><input id="add-str2" placeholder="فاتورة شراء رقم ..."></div>';
  h+='<div style="display:flex;gap:8px;margin-top:4px;"><button class="btn btn-gr" onclick="doStock('+i+',true,&quot;add-stq&quot;,&quot;add-str2&quot;)" style="flex:1;">✅ تأكيد</button><button class="btn btn-gy" onclick="cm()">إلغاء</button></div>';
  om("📥 إضافة — "+item.name,h);
}
function outStock(i){
  var item=DB.inventory[i];
  var h='<div style="background:var(--rbg);border-radius:8px;padding:10px;margin-bottom:12px;color:#991b1b;font-size:12px;">الكمية المتاحة: <strong>'+item.qty+' '+item.unit+'</strong></div>';
  h+='<div class="fg"><label>الكمية المصروفة *</label><input type="number" id="out-stq" min="1" max="'+item.qty+'"></div>';
  h+='<div class="fg"><label>المستلم / السبب</label><input id="out-str2" placeholder="اسم المستلم ..."></div>';
  h+='<div style="display:flex;gap:8px;margin-top:4px;"><button class="btn btn-rd" onclick="doStock('+i+',false,&quot;out-stq&quot;,&quot;out-str2&quot;)" style="flex:1;">✅ تأكيد</button><button class="btn btn-gy" onclick="cm()">إلغاء</button></div>';
  om("📤 صرف — "+item.name,h);
}
function doStock(i,add,qId,rId){
  qId=qId||'stq-in';
  rId=rId||'str2-in';
  var q=parseInt(el(qId)?el(qId).value:0)||0;
  var reason=sv(rId)||"";
  if(q<=0){alert("ادخل كمية صحيحة");return;}
  if(!add&&q>DB.inventory[i].qty){alert("الكمية أكبر من المتاح!");return;}
  var item=DB.inventory[i];
  if(!DB.invMovements)DB.invMovements=[];
  DB.invMovements.push({
    date:new Date().toISOString().split("T")[0],
    code:item.code,name:item.name,unit:item.unit,
    type:add?"in":"out",qty:q,
    before:item.qty,after:add?item.qty+q:item.qty-q,
    reason:reason
  });
  DB.inventory[i].qty=add?item.qty+q:item.qty-q;
  save();cm();sub("inventory");toast(add?"✅ تم إضافة المخزون":"✅ تم الصرف");
}

function showInvHistory(){
  if(!DB.invMovements||!DB.invMovements.length){
    om('📋 حركة المخزون','<div style="text-align:center;color:var(--g4);padding:30px;">لا توجد حركات بعد</div>');
    return;
  }
  var h='<table><thead><tr><th>التاريخ</th><th>الصنف</th><th>النوع</th><th>الكمية</th><th>قبل</th><th>بعد</th><th>السبب</th></tr></thead><tbody>';
  DB.invMovements.slice().reverse().forEach(function(m){
    h+='<tr>';
    h+='<td style="font-size:11px;">'+m.date+'</td>';
    h+='<td>'+m.name+'</td>';
    h+='<td><span class="badge '+(m.type==='in'?'bg':'br')+'">'+(m.type==='in'?'📥 إضافة':'📤 صرف')+'</span></td>';
    h+='<td class="tn" style="font-weight:800;color:'+(m.type==='in'?'var(--gr)':'var(--rd)')+';">'+m.qty+'</td>';
    h+='<td class="tn">'+m.before+'</td>';
    h+='<td class="tn" style="font-weight:700;">'+m.after+'</td>';
    h+='<td style="font-size:11px;color:var(--g4);">'+(m.reason||'—')+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table>';
  om('📋 حركة المخزون',h);
}


document.addEventListener('click',function(ev){var n=ev.target.closest('[data-nav]');if(n){nav(n.getAttribute('data-nav'),n);return;}var t=ev.target.closest('[data-eid]');if(t){viewE(t.getAttribute('data-eid'));return;}var s=ev.target.closest('[data-sub]');if(s){sub(s.getAttribute('data-sub'));return;}});

document.addEventListener("DOMContentLoaded", function(){
  nav("dash", document.querySelector('[data-nav="dash"]'));
});
</script>
