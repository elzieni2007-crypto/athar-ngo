<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أثر — لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#0f1c2e;--teal:#0e7490;--gold:#c8a84b;--bg:#f7f4ef;--white:#fff;--muted:#6b7f95}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f1c2e,#0e7490);padding:20px}
.login-box{background:white;border-radius:20px;padding:36px 30px;width:100%;max-width:380px;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#0f1c2e,#0e7490);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px}
.login-logo h1{font-family:'Tajawal',sans-serif;font-size:26px;font-weight:900;color:var(--ink)}
.login-logo p{font-size:12px;color:var(--muted);margin-top:4px}
.fg{margin-bottom:14px}
.fg label{font-size:12px;font-weight:700;color:#374151;display:block;margin-bottom:5px}
.fg input{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:'Cairo',sans-serif}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#0f1c2e,#0e7490);color:white;border:none;border-radius:10px;font-size:15px;font-weight:800;font-family:'Cairo',sans-serif;cursor:pointer;margin-top:4px}
#login-err{color:#dc2626;font-size:12px;text-align:center;min-height:16px;margin-bottom:8px}

/* DASHBOARD */
#dashboard{display:none}
.topbar{background:var(--ink);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tb-logo{font-family:'Tajawal',sans-serif;font-size:20px;font-weight:900;color:white}
.tb-logo span{color:var(--gold)}
.tb-user{font-size:12px;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:10px}
.btn-logout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;border-radius:7px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:'Cairo',sans-serif}

.main{max-width:1100px;margin:0 auto;padding:24px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-right:4px solid var(--teal)}
.stat-card.gold{border-color:var(--gold)}
.stat-card.green{border-color:#059669}
.stat-card.red{border-color:#dc2626}
.stat-num{font-family:'Tajawal',sans-serif;font-size:32px;font-weight:900;color:var(--ink)}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:4px}

/* TABLE */
.table-card{background:white;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;margin-bottom:24px}
.table-header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9}
.table-title{font-weight:900;font-size:15px;color:var(--ink)}
.search-box{padding:8px 14px;border:1.5px solid #e5e7eb;border-radius:9px;font-size:13px;font-family:'Cairo',sans-serif;width:220px}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;padding:12px 16px;text-align:right;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
td{padding:12px 16px;border-top:1px solid #f1f5f9;font-size:13px;vertical-align:middle}
tr:hover td{background:#fafafa}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.trial{background:#fef3c7;color:#92400e}
.badge.active{background:#d1fae5;color:#065f46}
.badge.expired{background:#fee2e2;color:#991b1b}
.city-badge{background:#e0f2fe;color:#0369a1;border-radius:6px;padding:2px 8px;font-size:11px}
.action-btn{background:var(--ink);color:white;border:none;border-radius:7px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:'Cairo',sans-serif;white-space:nowrap}
.action-btn.danger{background:#dc2626}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state div:first-child{font-size:48px;margin-bottom:12px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:18px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:900;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid #f1f5f9}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.btn-cancel{background:#f3f4f6;color:#374151;border:none;border-radius:9px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}
.btn-save{background:linear-gradient(135deg,#0f1c2e,#0e7490);color:white;border:none;border-radius:9px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}

/* LOADING */
.spinner{display:inline-block;width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:60px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">📊</div>
      <h1>أ<span style="color:var(--teal)">ثر</span></h1>
      <p>لوحة إدارة الجمعيات</p>
    </div>
    <div class="fg">
      <label>البريد الإلكتروني</label>
      <input id="adm-email" type="email" placeholder="elzieni2007@gmail.com" style="direction:ltr;text-align:left">
    </div>
    <div class="fg">
      <label>كلمة المرور</label>
      <input id="adm-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')adminLogin()">
    </div>
    <div id="login-err"></div>
    <button class="btn-login" onclick="adminLogin()">دخول ←</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="tb-logo">أ<span>ثر</span> <span style="font-size:12px;opacity:.5;font-weight:400">— لوحة الإدارة</span></div>
    <div class="tb-user">
      <span id="adm-name">مصطفى الزيني</span>
      <button class="btn-logout" onclick="adminLogout()">خروج</button>
    </div>
  </div>

  <div class="main">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">-</div>
        <div class="stat-lbl">إجمالي الجمعيات المسجلة</div>
      </div>
      <div class="stat-card green">
        <div class="stat-num" id="stat-trial">-</div>
        <div class="stat-lbl">في فترة التجربة</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-num" id="stat-paid">-</div>
        <div class="stat-lbl">مشتركة (مدفوعة)</div>
      </div>
      <div class="stat-card red">
        <div class="stat-num" id="stat-expired">-</div>
        <div class="stat-lbl">انتهت تجربتها</div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-header">
        <div class="table-title">📋 الجمعيات المسجلة</div>
        <input class="search-box" placeholder="🔍 ابحث باسم أو إيميل..." oninput="filterTable(this.value)" id="search-input">
      </div>
      <div id="table-container">
        <div class="loading"><div class="spinner"></div><div style="margin-top:12px;font-size:13px;color:var(--muted)">جاري التحميل...</div></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <h2 id="modal-title">تفاصيل الجمعية</h2>
    <div id="modal-content"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">إغلاق</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const cfg = {
  apiKey:"AIzaSyAsCP8zqAsw4I4t64Y06n3OWqhXJGtK5CA",
  authDomain:"athar-ngo.firebaseapp.com",
  projectId:"athar-ngo"
};
const app = initializeApp(cfg);
const db  = getFirestore(app);
const auth = getAuth(app);

const OWNER_EMAILS = ['elzieni2007@gmail.com','safaanasr048@gmail.com'];
let allOrgs = [];

/* ── Auth ── */
onAuthStateChanged(auth, user => {
  if(user && OWNER_EMAILS.includes(user.email)){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('adm-name').textContent = user.displayName || user.email;
    loadOrgs();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
  }
});

window.adminLogin = async () => {
  const email = document.getElementById('adm-email').value.trim();
  const pass  = document.getElementById('adm-pass').value.trim();
  const err   = document.getElementById('login-err');
  err.textContent = '';
  if(!OWNER_EMAILS.includes(email.toLowerCase())){
    err.textContent = '❌ هذا الإيميل غير مصرح له';
    return;
  }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    err.textContent = '❌ ' + (e.code === 'auth/wrong-password' ? 'كلمة مرور خاطئة' :
      e.code === 'auth/user-not-found' ? 'الإيميل غير مسجل' : e.message);
  }
};

window.adminLogout = () => signOut(auth);

/* ── Load Orgs ── */
async function loadOrgs(){
  try {
    const q = query(collection(db,'registrations'), orderBy('registeredAt','desc'));
    const snap = await getDocs(q);
    allOrgs = snap.docs.map(d => ({id:d.id, ...d.data()}));
    updateStats();
    renderTable(allOrgs);
  } catch(e) {
    document.getElementById('table-container').innerHTML =
      '<div class="empty-state"><div>⚠️</div><div>لم يتم العثور على بيانات<br><small style="color:#94a3b8">' + e.message + '</small></div></div>';
  }
}

function updateStats(){
  const today = new Date().toISOString().split('T')[0];
  const trial   = allOrgs.filter(o => o.plan === 'trial' && o.trialStart && daysDiff(o.trialStart) <= (o.trialDays||30));
  const paid    = allOrgs.filter(o => o.plan === 'paid' || o.plan === 'pro' || o.plan === 'basic');
  const expired = allOrgs.filter(o => o.plan === 'trial' && o.trialStart && daysDiff(o.trialStart) > (o.trialDays||30));
  document.getElementById('stat-total').textContent   = allOrgs.length;
  document.getElementById('stat-trial').textContent   = trial.length;
  document.getElementById('stat-paid').textContent    = paid.length;
  document.getElementById('stat-expired').textContent = expired.length;
}

function daysDiff(dateStr){
  return Math.floor((new Date() - new Date(dateStr)) / 86400000);
}

function trialStatus(org){
  if(org.plan === 'paid' || org.plan === 'pro') return {label:'مشترك', cls:'active'};
  if(!org.trialStart) return {label:'تجربة', cls:'trial'};
  const days = daysDiff(org.trialStart);
  const limit = org.trialDays || 30;
  if(days > limit) return {label:'منتهية', cls:'expired'};
  return {label:`تجربة (${limit-days} يوم)`, cls:'trial'};
}

function renderTable(orgs){
  if(!orgs.length){
    document.getElementById('table-container').innerHTML =
      '<div class="empty-state"><div>🏛️</div><div>لا توجد جمعيات مسجلة بعد</div></div>';
    return;
  }
  let html = '<table><thead><tr>'
    + '<th>#</th><th>اسم الجمعية</th><th>المسؤول</th><th>الموبايل</th>'
    + '<th>المحافظة</th><th>الإيميل</th><th>الحالة</th><th>تاريخ التسجيل</th><th>إجراء</th>'
    + '</tr></thead><tbody>';
  
  orgs.forEach((org, i) => {
    const st = trialStatus(org);
    const date = org.trialStart || (org.registeredAt?.toDate ? org.registeredAt.toDate().toLocaleDateString('ar-EG') : '—');
    html += `<tr>
      <td style="color:var(--muted)">${i+1}</td>
      <td><strong>${org.orgName||'—'}</strong>${org.licNo?`<br><small style="color:var(--muted)">${org.licNo}</small>`:''}</td>
      <td>${org.contactName||'—'}</td>
      <td style="direction:ltr">${org.phone||'—'}</td>
      <td><span class="city-badge">${org.city||'—'}</span></td>
      <td style="direction:ltr;font-size:12px">${org.email||'—'}</td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
      <td style="font-size:12px;color:var(--muted)">${date}</td>
      <td><button class="action-btn" onclick="showDetail('${org.id}')">تفاصيل</button></td>
    </tr>`;
  });
  
  html += '</tbody></table>';
  document.getElementById('table-container').innerHTML = html;
}

window.filterTable = (q) => {
  const filtered = allOrgs.filter(o =>
    (o.orgName||'').includes(q) ||
    (o.email||'').includes(q) ||
    (o.contactName||'').includes(q) ||
    (o.phone||'').includes(q) ||
    (o.city||'').includes(q)
  );
  renderTable(filtered);
};

window.showDetail = (id) => {
  const org = allOrgs.find(o => o.id === id);
  if(!org) return;
  const st = trialStatus(org);
  document.getElementById('modal-title').textContent = org.orgName || 'تفاصيل الجمعية';
  document.getElementById('modal-content').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      ${field('🏢 اسم الجمعية', org.orgName)}
      ${field('👤 المسؤول', org.contactName)}
      ${field('📱 الموبايل', org.phone, true)}
      ${field('📍 المحافظة', org.city)}
      ${field('✉️ الإيميل', org.email, true)}
      ${field('🏛️ رقم الترخيص', org.licNo)}
      ${field('📦 الباقة', org.plan||'trial')}
      ${field('📅 تاريخ التسجيل', org.trialStart||'—')}
    </div>
    <div style="background:#f8fafc;border-radius:10px;padding:14px;margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;margin-bottom:8px;color:var(--muted)">Tenant ID</div>
      <div style="font-size:11px;font-family:monospace;word-break:break-all">${org.tenantId||org.id}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-save" onclick="upgradePlan('${id}','pro')">🚀 ترقية Pro</button>
      <button class="btn-save" style="background:linear-gradient(135deg,#059669,#10b981)" onclick="extendTrial('${id}')">⏳ تمديد 30 يوم</button>
      <button class="btn-cancel btn-logout" style="background:#fee2e2;color:#dc2626" onclick="deleteOrg('${id}')">🗑️ حذف</button>
    </div>
  `;
  document.getElementById('detail-modal').classList.add('open');
};

function field(label, value, ltr=false){
  return `<div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:3px">${label}</div>
    <div style="font-size:13px;font-weight:600;${ltr?'direction:ltr;text-align:left':''}">${value||'—'}</div>
  </div>`;
}

window.closeModal = () => document.getElementById('detail-modal').classList.remove('open');

window.upgradePlan = async (id, plan) => {
  if(!confirm(`ترقية إلى ${plan}؟`)) return;
  await updateDoc(doc(db,'registrations',id), {plan});
  await loadOrgs();
  closeModal();
};

window.extendTrial = async (id) => {
  const org = allOrgs.find(o => o.id === id);
  const newStart = new Date().toISOString().split('T')[0];
  await updateDoc(doc(db,'registrations',id), {trialStart:newStart, trialDays:30});
  await loadOrgs();
  closeModal();
};

window.deleteOrg = async (id) => {
  if(!confirm('حذف هذه الجمعية نهائياً؟')) return;
  await deleteDoc(doc(db,'registrations',id));
  allOrgs = allOrgs.filter(o => o.id !== id);
  updateStats();
  renderTable(allOrgs);
  closeModal();
};

// Close modal on overlay click
document.getElementById('detail-modal').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});
</script>
</body>
</html>
